name: HMAC/SHA-256 native codegen (arm64)

# Verifiserer dei NATIVE codegen-krypto-builtinsa (builtin.sha256_bytes,
# builtin.hmac_sha256) ved å kompilere testprogram → ARM64 ELF via codegen-en
# (emit_sha256_bytes / __sha256_core / emit_hmac_sha256 i
# selfhost/native_execution/macho_arm64_codegen.no) og køyre den ferdige ELF-en
# NATIVT på ein arm-runnar. Exit 42 = alle RFC/FIPS-vektorar rette.
#
# Dette er verifiseringsvegen som IKKJE er mogleg lokalt på 16 GB-Mac
# (~11 GB tolka codegen-last OOM-ar mot swap-taket). GitHub-runnaren har
# nok minne til codegen-lasten (same som b2-seed-arm64-bygget).

on:
  workflow_dispatch:
  push:
    branches:
      - b2-independence
    paths:
      - selfhost/native_execution/macho_arm64_codegen.no
      - tests/test_sha256_native_arm64.no
      - tests/test_hmac_sha256_native_arm64.no
      - tests/test_pbkdf2_sha256_native_arm64.no
      - .github/workflows/hmac-sha256-native-arm64.yml

permissions:
  contents: read

jobs:
  build-arm64:
    name: Bygg test-ELF (native ARM64-codegen, x86-vert)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Materialiser x86-runtime + arm64-mål
        shell: bash
        run: |
          set -e
          mkdir -p dist build
          cp bootstrap/stage0/norscode-linux-x86_64 dist/norscode_native
          chmod +x dist/norscode_native
          touch build/.target_arm64
          ./dist/norscode_native version || true

      - name: Kompiler testprogram → NCB
        shell: bash
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CAPABILITIES: env.read,disk.read,disk.write
          NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp
        run: |
          set -e
          for t in test_sha256_native_arm64 test_hmac_sha256_native_arm64 test_pbkdf2_sha256_native_arm64; do
            NORSCODE_CMD=compile NORSCODE_FILE=tests/$t.no \
              NORSCODE_OUTPUT=build/$t.ncb.json ./dist/norscode_native
            ls -la build/$t.ncb.json
          done

      - name: Bygg NCB → ARM64 ELF via codegen (~11 GB tolka last)
        shell: bash
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CAPABILITIES: env.read,disk.read,disk.write
          NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp
        run: |
          set -e
          for t in test_sha256_native_arm64 test_hmac_sha256_native_arm64 test_pbkdf2_sha256_native_arm64; do
            echo "=== codegen $t ==="
            NORSCODE_CMD=run NORSCODE_FILE=tools/build_native_from_ncb.no \
              IN_NCB=build/$t.ncb.json OUT_ELF=build/$t.elf ./dist/norscode_native
            file build/$t.elf
          done

      - name: Last opp test-ELF-ar
        uses: actions/upload-artifact@v4
        with:
          name: hmac-sha256-test-elfs
          path: |
            build/test_sha256_native_arm64.elf
            build/test_hmac_sha256_native_arm64.elf
            build/test_pbkdf2_sha256_native_arm64.elf
          if-no-files-found: error
          retention-days: 7

  verify-arm64:
    name: Verifiser ELF nativt (arm-runnar) — exit 42
    needs: build-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hmac-sha256-test-elfs
          path: elfs

      - name: Kjør SHA-256 + HMAC test-ELF (native arm64)
        shell: bash
        run: |
          set +e
          fail=0
          for t in test_sha256_native_arm64 test_hmac_sha256_native_arm64 test_pbkdf2_sha256_native_arm64; do
            E="elfs/$t.elf"
            echo "===== $t ====="
            file "$E"; chmod +x "$E"
            "$E"; ec=$?
            echo "$t EXIT=$ec  (42 = alle vektorar rette)"
            if [ "$ec" != "42" ]; then
              echo "❌ FEIL: $t forventa exit 42, fekk $ec"
              fail=1
            else
              echo "✅ $t OK"
            fi
          done
          exit $fail
