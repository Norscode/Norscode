name: Windows native-nc verify (Norscode-bygd PE på ekte Windows)

# Verifiserer at Norscode sin EIGEN codegen byggjer eit fungerande Windows-nc frå kjelde
# (ingen C), og køyrer resultatet på ein EKTE windows-latest-runnar — ikkje wine.
#   1) bygg-windows-pe (ubuntu): bundl native_codegen_v2 med den committa linux-x86_64-seeden,
#      AOT-kompiler bunten med den committa codegen-ELF-en → cg1 (mi Windows-codegen som ELF),
#      og la cg1 emittere fikstur-PE-ane (NC_TARGET=windows-x86_64). Krev samstundes at cg1
#      gjev BYTE-IDENTISK linux-output som den committa codegen-en (LINID-porten).
#   2) kjor-paa-windows (windows-latest): køyr kvar PE på ekte Windows og krev at stdout +
#      exitkode er nøyaktig som venta (tests/windows_native/expected.tsv). Exitkoden kan ikkje
#      forfalskast, so dette er ein ekte Windows-verifikasjon av OSTAB→kernel32-vegen.
on:
  workflow_dispatch:
  push:
    paths:
      - selfhost/native_execution/native_codegen_v2.no
      - selfhost/native_execution/win64_os.no
      - selfhost/native_execution/win64_asm.no
      - selfhost/native_execution/pe_emitter.no
      - selfhost/native_execution/heap_layout.no
      - tests/windows_native/**
      - .github/workflows/windows-native-verify.yml

permissions:
  contents: read

jobs:
  bygg-windows-pe:
    name: Bygg Windows-PE frå kjelde (ubuntu, Norscode-codegen)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NORSCODE_ROOT: ${{ github.workspace }}
      NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp
    steps:
      - uses: actions/checkout@v6
      - name: Gjer seed + codegen-ELF køyrbare
        run: chmod +x bootstrap/stage0/norscode-linux-x86_64 bootstrap/native_codegen_x86_64.elf
      - name: Bundl Windows-codegen og bygg cg1 (mi codegen som ELF)
        run: |
          set -e
          ./bootstrap/stage0/norscode-linux-x86_64 bundle --output /tmp/cg.ncb.json selfhost/native_execution/native_codegen_v2.no
          NC_INPUT=/tmp/cg.ncb.json NC_OUTPUT=/tmp/cg1.elf ./bootstrap/native_codegen_x86_64.elf
          chmod +x /tmp/cg1.elf
      - name: Emitter fikstur-PE-ar + LINID-port (cg1 == committa codegen på linux)
        run: |
          set -e
          mkdir -p win
          fail=0
          for f in hei tekst unnatak gcstress lister tidrand; do
            ./bootstrap/stage0/norscode-linux-x86_64 compile tests/windows_native/$f.no -o /tmp/$f.ncb.json
            NORSCODE_GC_ALLOC=1 NC_INPUT=/tmp/$f.ncb.json NC_OUTPUT=/tmp/$f.ref.elf ./bootstrap/native_codegen_x86_64.elf
            NORSCODE_GC_ALLOC=1 NC_INPUT=/tmp/$f.ncb.json NC_OUTPUT=/tmp/$f.cg1.elf /tmp/cg1.elf
            if ! cmp -s /tmp/$f.ref.elf /tmp/$f.cg1.elf; then echo "[FAIL] $f: linux-output IKKJE byte-identisk (codegen-drift)"; fail=1; fi
            NORSCODE_GC_ALLOC=1 NC_TARGET=windows-x86_64 NC_INPUT=/tmp/$f.ncb.json NC_OUTPUT=win/$f.exe /tmp/cg1.elf
            echo "[OK] $f.exe $(stat -c %s win/$f.exe) B (LINID)"
          done
          exit $fail
      - name: Bygg nc_main som Windows-PE (full kompilator)
        run: |
          set -e
          ./bootstrap/stage0/norscode-linux-x86_64 bundle --output /tmp/nc_main.ncb.json selfhost/nc_main.no
          NORSCODE_GC_ALLOC=1 NC_TARGET=windows-x86_64 NC_INPUT=/tmp/nc_main.ncb.json NC_OUTPUT=win/nc_main.exe /tmp/cg1.elf
          echo "nc_main.exe $(stat -c %s win/nc_main.exe) B"
      - name: Last opp Windows-PE-ane
        uses: actions/upload-artifact@v6
        with:
          name: windows-native-pe
          path: win/*.exe
          retention-days: 7

  kjor-paa-windows:
    name: Køyr PE-ane på ekte Windows (windows-latest)
    needs: bygg-windows-pe
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: windows-native-pe
          path: win
      - name: Verifiser fikstur-PE-ane (stdout + exitkode) på ekte Windows
        shell: pwsh
        run: |
          $fail = 0
          foreach ($line in Get-Content tests/windows_native/expected.tsv) {
            if (-not $line.Trim()) { continue }
            $p = $line -split "`t"
            $name = $p[0]; $exp_exit = [int]$p[1]; $exp_out = $p[2]
            $out = (& ".\win\$name.exe" 2>&1 | Out-String).Trim()
            $ec = $LASTEXITCODE
            if ($ec -eq $exp_exit -and $out -eq $exp_out) {
              Write-Host "[WIN-OK] $name  exit=$ec  out=[$out]"
            } else {
              Write-Host "[WIN-FAIL] $name  exit=$ec (venta $exp_exit)  out=[$out] (venta [$exp_out])"
              $fail = 1
            }
          }
          Write-Host "=== nc_main.exe version (full kompilator på ekte Windows) ==="
          $v = (& ".\win\nc_main.exe" version 2>&1 | Out-String).Trim()
          $vec = $LASTEXITCODE
          Write-Host "nc_main version -> [$v] exit=$vec"
          if ($v -notmatch "Norscode") { Write-Host "[WIN-FAIL] nc_main version gav ikkje 'Norscode'"; $fail = 1 }
          exit $fail
