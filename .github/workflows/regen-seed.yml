name: Regenerer stage-0 seed (L5 Gen1 → precompiled → fragment)

# Manuell (workflow_dispatch) seed-regen på ein NATIV x86_64 Linux-runnar. Byggjer
# L5 Gen1-kompilator-bundle frå DAGENS (fletta) kjelde, skjer han i lean per-modul
# precompiled-NCB-ar og regenererer omgang-6b-fragmenta. Lastar opp resultatet som
# artefakt så det kan committast og fixpunkt-verifiserast av ELF stage-0-porten.
# (Den tunge L5-sjølvbygginga køyrer difor nativt, ikkje under lokal Rosetta.)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/regen-seed.yml"

permissions:
  contents: read

jobs:
  regen:
    name: Regenerer seed (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Materialiser v146-kandidat → dist/norscode_native
        run: |
          set -e
          cp bootstrap/candidates/norscode-linux-x86_64-v146 dist/norscode_native
          chmod +x dist/norscode_native
          ./dist/norscode_native --version 2>/dev/null || true
      - name: Bygg L5 Gen1-bundle frå kjelde (build/l5/compiler_v1.ncb.json)
        env:
          NC_OM6B_RUN_STAGE0: "1"
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
        run: ./bin/nc selfcompile-l5
      - name: Sjekk at L5 Gen1-bundle vart bygd
        run: |
          set -e
          ls -la build/l5/compiler_v1.ncb.json
      - name: Skjer Gen1 → lean precompiled-NCB-ar
        env:
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
        run: ./bin/nc run tools/materialize_l5_precompiled.no
      - name: Regenerer omgang-6b-fragment frå ferske precompiled
        env:
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
        run: ./bin/nc run tools/regenerate_omgang6b_fragments_safe.no
      - name: Last opp regenerert seed (precompiled + fragment + Gen1-bundle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-seed-${{ github.run_id }}
          path: |
            bootstrap/precompiled/*.ncb.json
            bootstrap/precompiled_fragments/*.functions.json
            bootstrap/precompiled_fragments_inner/*.functions.json
            build/l5/compiler_v1.ncb.json
          if-no-files-found: warn
          retention-days: 3
