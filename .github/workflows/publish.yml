name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  NORSCODE_CMD: run
  NORSCODE_FILE: tools/ci_shell_runner.no
  NORSCODE_ROOT: ${{ github.workspace }}
  NORSCODE_ENABLE_EXEC_PROSESS: "1"
  NORSCODE_VM_CAPABILITIES: env.read,process.exec,disk.read,disk.write
  NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ─── macOS arm64 ─────────────────────────────────────────────────────────────
  build-macos-arm64:
    name: Binary – macOS arm64
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-macos-arm64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Materialiser runtime gjennom committed stage0
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-macos-arm64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-macos-arm64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-macos-arm64"
        run: ./bootstrap/stage0/norscode-macos-arm64

      - name: C/Python-gate
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc feature-check app.no"
        run: ./bin/nc feature-check app.no

      - name: Verifiser stage-0 seed
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc verify-seed"
        run: ./bin/nc verify-seed

      - name: Bygg norscode_native
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/build_norscode_native.no"
        run: ./bin/nc run tools/build_norscode_native.no

      - name: Verifiser hosting-runtime gate
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_HOSTING_RUNTIME_BIN: ${{ github.workspace }}/dist/norscode_native
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write,net.dns,net.listen,net.connect,net.tls
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/hosting_runtime_gate_v3610.no"
        run: ./bin/nc run tools/hosting_runtime_gate_v3610.no

      - name: Selfcheck og pakk
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_PUBLISH_RUNTIME_SOURCE: dist/norscode_native
          NORSCODE_PUBLISH_RUNTIME_OUTPUT: norscode-macos-arm64
          NORSCODE_PUBLISH_SELFCHECK: "1"
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/publish_runtime_artifact.no"
        run: ./bin/nc run tools/publish_runtime_artifact.no

      - name: Last opp artefakt
        uses: actions/upload-artifact@v6
        with:
          name: norscode-macos-arm64
          path: |
            norscode-macos-arm64
            norscode-macos-arm64.sha256

  # ─── Linux x86_64 ────────────────────────────────────────────────────────────
  build-linux-x86_64:
    name: Binary – Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Materialiser runtime gjennom committed stage0
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64

      - name: C/Python-gate
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc feature-check app.no"
        run: ./bin/nc feature-check app.no

      - name: Verifiser stage-0 seed
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc verify-seed"
        run: ./bin/nc verify-seed

      - name: Bygg norscode_native
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/build_norscode_native.no"
        run: ./bin/nc run tools/build_norscode_native.no

      - name: Selfcheck og pakk
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_PUBLISH_RUNTIME_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_PUBLISH_RUNTIME_OUTPUT: norscode-linux-x86_64
          NORSCODE_PUBLISH_SELFCHECK: "1"
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/publish_runtime_artifact.no"
        run: ./bin/nc run tools/publish_runtime_artifact.no

      - name: Bygg stage-0 compiler ELF (Omgang 6b.4)
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/build_stage0_release_assets.no"
        run: ./bin/nc run tools/build_stage0_release_assets.no

      - name: Last opp artefakt
        uses: actions/upload-artifact@v6
        with:
          name: norscode-linux-x86_64
          path: |
            norscode-linux-x86_64
            norscode-linux-x86_64.sha256
            compiler_stage0-linux-x86_64.elf
            compiler_stage0-linux-x86_64.elf.sha256

  # ─── GitHub Release ──────────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-macos-arm64, build-linux-x86_64]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Last ned alle artefakter
        uses: actions/download-artifact@v7
        with:
          path: release-assets/

      - name: Publiser GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
          body: |
            ## Installasjon

            **macOS (arm64):**
            ```sh
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/norscode-macos-arm64 -o norscode
            chmod +x norscode && sudo mv norscode /usr/local/bin/nc
            ```

            **Linux x86_64:**
            ```sh
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/norscode-linux-x86_64 -o norscode
            chmod +x norscode && sudo mv norscode /usr/local/bin/nc
            ```
