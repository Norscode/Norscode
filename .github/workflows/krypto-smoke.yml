name: Krypto-smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - krypto-tls-primitiver

env:
  NORSCODE_CMD: run
  NORSCODE_FILE: tools/ci_shell_runner.no
  NORSCODE_ROOT: ${{ github.workspace }}
  NORSCODE_ENABLE_EXEC_PROSESS: "1"
  NORSCODE_VM_CAPABILITIES: env.read,process.exec,disk.read,disk.write
  NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GITHUB_TOKEN: ${{ github.token }}
  NC_CI: "1"

permissions:
  contents: read

jobs:
  krypto:
    name: Krypto RFC-vektorar (rein Norscode)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v4
      - name: Materialiser native runtime
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - name: SHA-512 (NIST)
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tests/test_sha512_nist.no"
        run: ./bin/nc run tests/test_sha512_nist.no
      - name: HKDF (RFC 5869)
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tests/test_hkdf_rfc5869.no"
        run: ./bin/nc run tests/test_hkdf_rfc5869.no
      - name: X25519 (RFC 7748)
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tests/test_x25519_rfc7748.no"
        run: ./bin/nc run tests/test_x25519_rfc7748.no
      - name: Ed25519 (RFC 8032)
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tests/test_ed25519_rfc8032.no"
        run: ./bin/nc run tests/test_ed25519_rfc8032.no
      - name: TLS 1.3 nokkelplan (RFC 8448)
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tests/test_tls13_keyschedule_rfc8448.no"
        run: ./bin/nc run tests/test_tls13_keyschedule_rfc8448.no
      # --- D2: TLS 1.3 record/handshake + differensial + fuzz ---
      - name: TLS 1.3 record-lag (RFC 8439/8448, ChaCha20-Poly1305)
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tests/test_tls13_record_chacha.no"
        run: ./bin/nc run tests/test_tls13_record_chacha.no
      - name: TLS 1.3 handshake-kodek (RFC 8448)
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tests/test_tls13_handshake_codec.no"
        run: ./bin/nc run tests/test_tls13_handshake_codec.no
      - name: TLS 1.3 full handtrykk (loopback)
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tests/test_tls13_handshake_flow.no"
        run: ./bin/nc run tests/test_tls13_handshake_flow.no
      - name: TLS 1.3 differensial-KAT (heile RFC 8448-loyndomstreet)
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tests/test_tls13_differential_kat.no"
        run: ./bin/nc run tests/test_tls13_differential_kat.no
      - name: TLS/X.509 parser-fuzzing (fail-closed)
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tests/test_tls13_fuzz_parsers.no"
        run: ./bin/nc run tests/test_tls13_fuzz_parsers.no
      # --- web-PKI: bigint + RSA + ECDSA + X.509-kjede ---
      - name: bigint (mul/divmod/modexp mot Python-vektorar)
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tests/test_bigint.no"
        run: ./bin/nc run tests/test_bigint.no
      - name: RSA PKCS#1 v1.5 SHA-256 (ekte 2048-bit nokkel)
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tests/test_rsa_pkcs1_sha256.no"
        run: ./bin/nc run tests/test_rsa_pkcs1_sha256.no
      - name: ECDSA P-256 (ekte openssl-signatur)
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tests/test_ecdsa_p256.no"
        run: ./bin/nc run tests/test_ecdsa_p256.no
      - name: X.509-kjede Ed25519
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tests/test_x509_chain_ed25519.no"
        run: ./bin/nc run tests/test_x509_chain_ed25519.no
      - name: X.509-kjede RSA (ekte openssl-kjede)
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tests/test_x509_chain_rsa.no"
        run: ./bin/nc run tests/test_x509_chain_rsa.no
      - name: X.509-kjede ECDSA P-256 (ekte openssl-kjede)
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tests/test_x509_chain_ecdsa.no"
        run: ./bin/nc run tests/test_x509_chain_ecdsa.no
