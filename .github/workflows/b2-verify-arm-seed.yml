name: B2 Verify arm64 full-AOT seed

on:
  workflow_dispatch:
  push:
    branches:
      - b2-independence

permissions:
  contents: read

jobs:
  verify:
    name: Kjør C-fri/JSON-fri arm64 nc_main-seed (native arm-runnar)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: "selftest + help + version + run-ncb-pure=42"
        shell: bash
        run: |
          set +e
          SEED=seedcheck/nc_main_arm64_seed.elf
          echo "=== fil ==="; file "$SEED"; ls -la "$SEED"
          chmod +x "$SEED"
          echo "===== help ====="; "$SEED" help; echo "HELP_EXIT=$?"
          echo "===== version ====="; "$SEED" version; echo "VERSION_EXIT=$?"
          echo "===== selftest ====="; "$SEED" selftest; echo "SELFTEST_EXIT=$?"
          echo "===== run-ncb-pure (venta exit 42) ====="; "$SEED" run-ncb-pure seedcheck/tiny42.ncb.json; echo "RUNNCBPURE_EXIT=$?"
          echo "ferdig"
