name: B2 Verify arm64 full-AOT seed

on:
  workflow_dispatch:
  push:
    branches:
      - b2-independence

permissions:
  contents: read

jobs:
  verify:
    name: Kjør C-fri/JSON-fri arm64 nc_main-seed (native arm-runnar)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: "env-dispatch: version + run-ncb-pure=42 + selftest"
        shell: bash
        run: |
          set +e
          SEED=seedcheck/nc_main_arm64_seed.elf
          file "$SEED"; chmod +x "$SEED"
          export NORSCODE_ROOT="$PWD"
          export NORSCODE_VM_CAPABILITIES=env.read,env.write,process.exec,disk.read,disk.write,jit.execute
          export NORSCODE_VM_DISK_ROOT="$PWD,.,/tmp"
          echo "===== version ====="; NORSCODE_CMD=version "$SEED"; echo "VERSION_EXIT=$?"
          echo "===== selftest ====="; NORSCODE_CMD=selftest "$SEED"; echo "SELFTEST_EXIT=$?"
          echo "===== run-ncb-pure (venta exit 42) ====="
          NORSCODE_CMD=run-ncb-pure NORSCODE_FILE=seedcheck/tiny42.ncb.json "$SEED"; echo "RUNNCBPURE_EXIT=$?"
          echo "ferdig"
