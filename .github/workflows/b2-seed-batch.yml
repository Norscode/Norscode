name: B2 Seed Batch full-AOT (arm64)

on:
  workflow_dispatch:
  push:
    branches:
      - b2-independence

env:
  NORSCODE_CMD: run
  NORSCODE_FILE: tools/ci_shell_runner.no
  NORSCODE_ROOT: ${{ github.workspace }}
  NORSCODE_ENABLE_EXEC_PROSESS: "1"
  NORSCODE_VM_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write,jit.execute
  NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp

permissions:
  contents: read

jobs:
  build-batch:
    name: Batch full-AOT arm64 seed (x86-vert)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6

      - name: Materialiser funksjonell x86-runtime
        env:
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64

      - name: "Steg 0b: opprett byggkatalogar"
        shell: bash
        run: mkdir -p build/fullhost build/fullhost/batch

      # Full-AOT-vegen (ncval_link) treng berre nc_main-NCB-en direkte —
      # UTAN L5/materialize (som strandar på committa runtime sin stubba
      # native-fs). compile bundlar heile den transitive importgrafen.
      - name: "Steg 1: kompiler full nc_main → NCB (env-compile)"
        shell: bash
        run: |
          set -e
          NORSCODE_CMD=compile NORSCODE_FILE=selfhost/nc_main.no \
            NORSCODE_OUTPUT=build/fullhost/nc_main_full.ncb.json \
            NORSCODE_ROOT="$PWD" NORSCODE_VM_CAPABILITIES=env.read,disk.read,disk.write \
            NORSCODE_VM_DISK_ROOT="$PWD,.,/tmp" ./dist/norscode_native
          ls -la build/fullhost/nc_main_full.ncb.json

      - name: "Steg 2: kompiler batch-codegen (elf_batch_host → codegen_batch_host.ncb.json)"
        shell: bash
        run: |
          set -e
          NORSCODE_CMD=compile NORSCODE_FILE=tools/elf_batch_host.no \
            NORSCODE_OUTPUT=build/fullhost/codegen_batch_host.ncb.json \
            NORSCODE_ROOT="$PWD" NORSCODE_VM_CAPABILITIES=env.read,disk.read,disk.write \
            NORSCODE_VM_DISK_ROOT="$PWD,.,/tmp" ./dist/norscode_native
          ls -la build/fullhost/codegen_batch_host.ncb.json

      - name: "Steg 3: batch-ELF-codegen (plan → compile → link) full-AOT arm64 (INGEN embed/json)"
        env:
          NC_ELF_NCB: build/fullhost/nc_main_full.ncb.json
          NC_ELF_BIN: build/fullhost/nc_main_arm64_seed.elf
          NC_BATCH_CODEGEN: build/fullhost/codegen_batch_host.ncb.json
          NC_BATCH_SIZE: "100"
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/build_fullhost_elf_batched.no"
        run: ./bin/nc run tools/build_fullhost_elf_batched.no

      - name: Bygg test-NCB (exit 42) + bekreft ELF
        shell: bash
        run: |
          set -e
          printf 'funksjon start() -> heiltall { returner 42 }\n' > /tmp/tiny42.no
          NORSCODE_CMD=compile NORSCODE_FILE=/tmp/tiny42.no NORSCODE_OUTPUT=build/fullhost/tiny42.ncb.json \
            NORSCODE_ROOT="$PWD" NORSCODE_VM_CAPABILITIES=env.read,disk.read,disk.write \
            NORSCODE_VM_DISK_ROOT="$PWD,.,/tmp" ./dist/norscode_native
          file build/fullhost/nc_main_arm64_seed.elf
          ls -la build/fullhost/nc_main_arm64_seed.elf build/fullhost/tiny42.ncb.json

      - name: Last opp batch-seed
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nc_main_arm64_batch_seed
          path: |
            build/fullhost/nc_main_arm64_seed.elf
            build/fullhost/tiny42.ncb.json
          if-no-files-found: warn
          retention-days: 7

  verify-batch:
    name: Verifiser batch-seed (native arm-runnar)
    needs: build-batch
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: nc_main_arm64_batch_seed
          path: seed
      - name: "selftest + run-ncb-pure=42"
        shell: bash
        run: |
          set +e
          SEED=seed/nc_main_arm64_seed.elf
          file "$SEED"; chmod +x "$SEED"
          echo "===== help ====="; "$SEED" help; echo "HELP_EXIT=$?"
          echo "===== selftest ====="; "$SEED" selftest; echo "SELFTEST_EXIT=$?"
          echo "===== run-ncb-pure=42 ====="; "$SEED" run-ncb-pure seed/tiny42.ncb.json; echo "RUNNCBPURE_EXIT=$?"
          echo "ferdig"
