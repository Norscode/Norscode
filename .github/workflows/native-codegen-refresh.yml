name: Native codegen refresh (Linux and macOS)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - selfhost/native_execution/**
      - selfhost/ncb_serde.no
      - selfhost/ncb_bin.no
      - std/windows_abi.no
      - tools/refresh_native_codegen.no
      - .github/workflows/native-codegen-refresh.yml

permissions:
  contents: read

concurrency:
  group: native-codegen-refresh-${{ github.ref }}
  cancel-in-progress: true

env:
  NORSCODE_ROOT: ${{ github.workspace }}
  NORSCODE_CMD: run
  NORSCODE_FILE: tools/ci_shell_runner.no
  NORSCODE_ENABLE_EXEC_PROSESS: "1"
  NORSCODE_VM_CAPABILITIES: env.read,process.exec,disk.read,disk.write
  NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
  NODE_BIN: /nonexistent
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh:
    name: Rebuild codegens on ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            runner: ubuntu-latest
            seed: norscode-linux-x86_64
            artifacts: |
              bootstrap/native_codegen_x86_64.elf*
              bootstrap/native_codegen_linux-arm64_on_linux-x86_64.elf*
              bootstrap/native_codegen_macos-arm64_on_linux-x86_64.elf*
          - host: macos-arm64
            runner: macos-latest
            seed: norscode-macos-arm64
            artifacts: |
              bootstrap/native_codegen_macos-arm64_on_macos-arm64.macho*
              bootstrap/native_codegen_linux-x86_64_on_macos-arm64.macho*
              bootstrap/native_codegen_norscodeos-x86_64_on_macos-arm64.macho*
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-${{ matrix.host }} run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - name: Materialize native runtime
        env:
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/${{ matrix.seed }}
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/${{ matrix.seed }}
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/${{ matrix.seed }}"
        run: ./bootstrap/stage0/${{ matrix.seed }}
      - name: Rebuild and verify native fixed point
        env:
          NORSCODE_VM_CI_STEP_TIMEOUT_MS: "3600000"
          NORSCODE_VM_CI_STREAM: "1"
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bin/nc
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/refresh_native_codegen.no
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/refresh_native_codegen.no"
        run: ./bin/nc run tools/refresh_native_codegen.no
      - name: Upload codegens and source provenance
        uses: actions/upload-artifact@v6
        with:
          name: native-codegen-refresh-${{ matrix.host }}
          path: |
            ${{ matrix.artifacts }}
            tools/active_surface_allowlist.txt
            build/codegen-refresh/report.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: native-codegen-refresh-logs-${{ matrix.host }}
          path: build/codegen-refresh/*.log
          if-no-files-found: ignore
          retention-days: 14
