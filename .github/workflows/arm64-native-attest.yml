name: ARM64 native krypto/TLS-attestasjon

# Byggjer den reine krypto/TLS-attestasjonsbinæren med Norscode sin EIGEN
# AArch64-codegen (elf_arm64_codegen) på ein ekte Linux-ARM64-runner — ingen gcc,
# ingen OpenSSL — køyrer han, og produserer GitHub-signert build-provenance.
#
# UTKAST (2026-08): må validerast/itererast på ein ekte ubuntu-24.04-arm-runner.
# Avheng av at den committede ARM64-stage0-seeden kan køyre kjelde-codegen
# (NORSCODE_USE_PRECOMPILED_SELFHOST=0). Krypto/TLS-flata er verifisert native i
# ein linux/arm64-sandkasse lokalt; dette steget gjer den formelle signeringa.

on:
  workflow_dispatch:

env:
  NORSCODE_CMD: run
  NORSCODE_FILE: tools/ci_shell_runner.no
  NORSCODE_ROOT: ${{ github.workspace }}
  NORSCODE_ENABLE_EXEC_PROSESS: "1"
  NORSCODE_VM_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write
  NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GITHUB_TOKEN: ${{ github.token }}
  NC_CI: "1"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    name: Bygg + signer native ARM64-krypto/TLS-binær
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-arm64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v4

      - name: Materialiser native runtime (ARM64-seed → dist/norscode_native)
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-arm64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-arm64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-arm64"
        run: ./bootstrap/stage0/norscode-linux-arm64

      - name: Kompiler attestasjonsprogram til NCB (rask veg)
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc compile tests/fixtures/arm64_krypto_attest.no /tmp/attest.ncb.json"
        run: ./bin/nc compile tests/fixtures/arm64_krypto_attest.no /tmp/attest.ncb.json

      - name: Bygg native ARM64-ELF via KJELDE-codegen (utan gcc/OpenSSL)
        env:
          NORSCODE_USE_PRECOMPILED_SELFHOST: "0"
          ATTEST_NCB: /tmp/attest.ncb.json
          ATTEST_ELF: /tmp/arm64_krypto_attest
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/build_arm64_krypto_attest.no"
        run: ./bin/nc run tools/build_arm64_krypto_attest.no

      - name: Køyr den native attestasjonsbinæren (må gje exit 0)
        shell: bash
        run: |
          chmod +x /tmp/arm64_krypto_attest
          file /tmp/arm64_krypto_attest
          /tmp/arm64_krypto_attest
          echo "native attestasjon exit=$?"

      - name: GitHub-signert build-provenance for binæren
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: /tmp/arm64_krypto_attest

      - name: Last opp attestasjonsbinær
        uses: actions/upload-artifact@v4
        with:
          name: arm64-krypto-tls-attest
          path: /tmp/arm64_krypto_attest
