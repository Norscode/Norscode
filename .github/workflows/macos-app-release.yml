name: macOS App Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

env:
  NORSCODE_CMD: run
  NORSCODE_FILE: tools/ci_shell_runner.no
  NORSCODE_ROOT: ${{ github.workspace }}
  NORSCODE_ENABLE_EXEC_PROSESS: "1"
  NORSCODE_VM_CAPABILITIES: env.read,process.exec,disk.read,disk.write
  NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GITHUB_TOKEN: ${{ github.token }}
  MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
  APPLE_ID: ${{ secrets.APPLE_ID }}
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

concurrency:
  group: macos-app-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-macos-app:
    name: Build macOS app artifacts
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-macos-arm64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Materialiser runtime gjennom committed stage0
        env:
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-macos-arm64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-macos-arm64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-macos-arm64"
        run: ./bootstrap/stage0/norscode-macos-arm64

      - name: C/Python-gate
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc feature-check app.no"
        run: ./bin/nc feature-check app.no

      - name: Verifiser stage-0 seed
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc verify-seed"
        run: ./bin/nc verify-seed

      - name: Verifiser Norscode-eigd macOS ZIP
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tests/test_package_macos_zip_native.no"
        run: ./bin/nc run tests/test_package_macos_zip_native.no

      - name: Bygg native runtime
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/build_norscode_native.no"
        run: ./bin/nc run tools/build_norscode_native.no

      - name: Verifiser hosting-runtime gate
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_HOSTING_RUNTIME_BIN: ${{ github.workspace }}/dist/norscode_native
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write,net.dns,net.listen,net.connect,net.tls
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/hosting_runtime_gate_v3610.no"
        run: ./bin/nc run tools/hosting_runtime_gate_v3610.no

      - name: Bygg macOS app
        env:
          NORSCODE_MACOS_APP_MODE: gui
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/build-macos-app.no"
        run: ./bin/nc run tools/build-macos-app.no

      - name: Signer macOS app (ad-hoc fallback)
        if: env.MACOS_CODESIGN_IDENTITY == ''
        env:
          NORSCODE_MACOS_SIGN_VERIFY: "1"
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/sign-macos-app.no"
        run: ./bin/nc run tools/sign-macos-app.no

      - name: Signer macOS app (Developer ID)
        if: env.MACOS_CODESIGN_IDENTITY != ''
        env:
          NORSCODE_MACOS_SIGN_VERIFY: "1"
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/sign-macos-app.no"
        run: ./bin/nc run tools/sign-macos-app.no

      - name: Pakk macOS app artifacts
        env:
          NORSCODE_MACOS_PACKAGE_FORMAT: all
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/package-macos-app.no"
        run: ./bin/nc run tools/package-macos-app.no

      - name: Notariser PKG
        if: env.MACOS_CODESIGN_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != ''
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/notarize-macos-app.no"
        run: ./bin/nc run tools/notarize-macos-app.no

      - name: Last opp macOS app artifacts
        uses: actions/upload-artifact@v6
        with:
          name: norscode-macos-app-artifacts
          path: |
            release-artifacts/Norscode-macos-*.zip
            release-artifacts/Norscode-macos-*.zip.sha256
            release-artifacts/Norscode-macos-*.pkg
            release-artifacts/Norscode-macos-*.pkg.sha256
            release-artifacts/Norscode-macos-*.dmg
            release-artifacts/Norscode-macos-*.dmg.sha256
          if-no-files-found: warn
          retention-days: 7

  github-release:
    name: GitHub Release (macOS app)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-macos-app]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Last ned macOS app artifacts
        uses: actions/download-artifact@v7
        with:
          name: norscode-macos-app-artifacts
          path: release-assets/

      - name: Publiser macOS app artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          append_body: true
          body: |

            ## macOS app

            Denne releasen inneheld no primære macOS app-artefakt:

            - `Norscode-macos-<versjon>.zip`
            - `Norscode-macos-<versjon>.pkg`
            - `Norscode-macos-<versjon>.dmg` berre når DMG-bygging lukkast i workflowen

            Lokal installasjon og byggesteg er dokumentert i `docs/MAC_APP_RELEASE.md` og `docs/MAC_APP_SIGNING.md`.
