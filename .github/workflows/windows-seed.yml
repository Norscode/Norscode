name: Windows fersk seed (frittståande CRT-fri nc_main-PE + ekte-Windows process-smoke)

# Byggjer ein FRITTSTÅANDE windows-x86_64 nc_main-PE frå levande kjelde
# (tools/build_windows_seed.no: materialize nc_main-NCB + native_codegen_v2 med
# NC_TARGET=windows-x86_64 → PE32+ som importerer berre KERNEL32/ADVAPI32/SHELL32),
# GATEAR C-runtime-fri import-tabell, og — med W6.1 process.exec (os_win_spawn) —
# RØYKTESTAR kandidaten på EKTE windows-latest: kandidaten er sin eigen ci_shell_runner-
# adapter (spawnar eit barn via CreateProcessW) som process_spawn_argv-ar `cmd /c echo`
# og fangar stdout. (Den committa C-vert-seeden kan IKKJE vere adapter — ignorerer
# argumenta → selftest — difor er kandidaten sjølv adapteren no.)
#
# Codegen-ELF-en blir bygd frå KJELDE i bygg-jobben (NC_WIN_REBUILD_CODEGEN=1) så
# os_win_spawn er med sjølv om den committa bootstrap-ELF-en enno ikkje har han.
# Alle run-blokker går gjennom ci_shell_runner-adapteren (fase-3-baseline: 0 shell-blokker).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - selfhost/native_execution/native_codegen_v2.no
      - selfhost/native_execution/pe_emitter.no
      - selfhost/native_execution/win64_os.no
      - selfhost/native_execution/win64_asm.no
      - selfhost/native_execution/heap_layout.no
      - selfhost/native_execution/codegen_prebuilt.no
      - std/native_gap.no
      - tools/build_windows_seed.no
      - tools/windows_freestanding_smoke.no
      - .github/workflows/windows-seed.yml

env:
  NORSCODE_ROOT: ${{ github.workspace }}
  NORSCODE_ENABLE_EXEC_PROSESS: "1"
  NORSCODE_VM_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write
  NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NC_CI: "1"

permissions:
  contents: read

jobs:
  bygg:
    name: Kryss-bygg frittståande CRT-fri windows nc_main (på x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - name: Materialiser native runtime (x86_64)
        env:
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - name: Bygg frittståande windows nc_main (codegen frå kjelde) + gate C-runtime-fri
        env:
          NORSCODE_VM_CI_STEP_TIMEOUT_MS: "5400000"
          NORSCODE_VM_CI_STREAM: "1"
          NC_WIN_REBUILD_CODEGEN: "1"
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/build_windows_seed.no"
        run: ./bin/nc run tools/build_windows_seed.no
      - name: Last opp den frittståande kandidaten
        if: success() || failure()
        uses: actions/upload-artifact@v6
        with:
          name: norscode-windows-freestanding-kandidat
          path: build/windows/nc_main_freestanding_win.exe
          if-no-files-found: error

  smoke-win:
    name: process.exec på ekte Windows (kandidat som adapter)
    needs: bygg
    runs-on: windows-latest
    timeout-minutes: 20
    # Kandidaten (med os_win_spawn) er sin EIGEN ci_shell_runner-adapter: han køyrer
    # ci_shell_runner (synkron, UTAN STREAM → process_spawn_argv-vegen = den synkrone
    # windows-greina _pg_windows_spawn_synkron), som spawnar eit barn (kandidaten) som
    # køyrer smoke-.no-en. Smoke-en process_spawn_argv-ar `cmd /c echo WIN-SPAWN-OK` og
    # krev «WIN-SPAWN-OK» i fanga stdout → exit 0. Dette øver CreateProcessW + pipe-fang
    # på EKTE Windows (ikkje wine). Ingen rå shell.
    defaults:
      run:
        shell: ${{ github.workspace }}/build/windows/nc_main_freestanding_win.exe run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: norscode-windows-freestanding-kandidat
          path: build/windows
      - name: process_spawn_argv (cmd /c echo) + fang stdout
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_NATIVE_BIN: ${{ github.workspace }}/build/windows/nc_main_freestanding_win.exe
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./build/windows/nc_main_freestanding_win.exe
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/windows_freestanding_smoke.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.
          NORSCODE_VM_CI_COMMAND: "./build/windows/nc_main_freestanding_win.exe run tools/windows_freestanding_smoke.no"
        run: ./build/windows/nc_main_freestanding_win.exe run tools/windows_freestanding_smoke.no
