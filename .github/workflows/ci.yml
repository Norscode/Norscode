name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  NORSCODE_CMD: run
  NORSCODE_FILE: tools/ci_shell_runner.no
  NORSCODE_ROOT: ${{ github.workspace }}
  NORSCODE_ENABLE_EXEC_PROSESS: "1"
  NORSCODE_VM_CAPABILITIES: env.read,process.exec,disk.read,disk.write
  NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GITHUB_TOKEN: ${{ github.token }}
  NC_CI: "1"
  TEST_TIMEOUT: "120"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:

  phase0-verify:
    name: Fase 0-verifikasjon
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - name: Materialiser native runtime
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - name: Kontroller app-syntaks
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc check app.no"
        run: ./bin/nc check app.no
      - env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/selfhost_phase0_verify.no"
        run: ./bin/nc run tools/selfhost_phase0_verify.no
      - env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/no_legacy_cvm.no"
        run: ./bin/nc run tools/no_legacy_cvm.no

  drift-guard:
    name: Driftsvakt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - name: Materialiser native runtime
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - env:
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/selfhost_drift_guard.no"
        run: ./bin/nc run tools/selfhost_drift_guard.no

  differential:
    name: Differensial-sele (AOT vs tolk)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - name: Materialiser native runtime
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - name: Differensial diff_smoke (tolk == AOT)
        env:
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_DIFF_FILE: tools/fixtures/diff_smoke.no
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/differensial_sele.no"
        run: ./bin/nc run tools/differensial_sele.no

  seed-only:
    name: Seed-only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - name: Materialiser native runtime
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc verify-seed"
        run: ./bin/nc verify-seed

  # ─── macOS: bygg → artefakt → verify (test får eiga 120 min) ─────────────────
  native-macos-build:
    name: Build macOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-macos-arm64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - name: Materialiser native frå stage-0 seed
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-macos-arm64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-macos-arm64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-macos-arm64"
        run: ./bootstrap/stage0/norscode-macos-arm64
      - name: Verifiser stage-0 seed
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc verify-seed"
        run: ./bin/nc verify-seed
      - uses: actions/upload-artifact@v6
        with:
          name: norscode-native-macos
          path: |
            dist/norscode_native
            bin/nc
          retention-days: 1

  native-macos:
    name: Native macOS (arm64)
    needs: native-macos-build
    runs-on: macos-latest
    env:
      NORSCODE_CI_SYSTEM: macOS
      NORSCODE_CI_ARCH: arm64
      NORSCODE_ROOT: ${{ github.workspace }}
      NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write,net.dns,net.connect,net.tcp,net.tls,net.listen,net.udp,thread.spawn,jit.execute
      NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
      TMPDIR: /tmp
      NC_TRACE_TESTS: "1"
      TEST_TIMEOUT: "60"
    timeout-minutes: 300
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-macos-arm64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: norscode-native-macos
          path: .
      - name: Gjenopprett runtime-modus gjennom Norscode
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-macos-arm64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-macos-arm64"
        run: ./bootstrap/stage0/norscode-macos-arm64
      - env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc selfhost-bootstrap-gate"
        run: ./bin/nc selfhost-bootstrap-gate
      - name: "Steg C: Bootstrap-self (pure VM)"
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc bootstrap-self"
        run: ./bin/nc bootstrap-self
      - name: Install VM loader fixtures
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/install_vm_loader_fixtures.no"
        run: ./bin/nc run tools/install_vm_loader_fixtures.no
      - name: Gjenopprett test-compile-cache (innhaldsadressert NCB-cache; sparar ~40 s hybrid-compile per test på seed-dist)
        uses: actions/cache/restore@v4
        with:
          path: build/nc-test-cache
          key: nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-macos-arm64', 'build/v9400/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-${{ github.run_id }}
          restore-keys: |
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-macos-arm64', 'build/v9400/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-rask-
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-macos-arm64', 'build/v9400/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-slow-
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-macos-arm64', 'build/v9400/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-
      - name: "Test (rask CI): 4 deterministiske parallelle shards"
        timeout-minutes: 165
        env:
          NC_PARALLEL_TEST_SHARDS: "4"
          # 6000->9000 s (100->150 min) BERRE macOS-fast (Linux-fast held 6000): 2026-09-06
          # kaldstart-hump — 3/4 shards traff 99-min-taket kaldt; cache-nøkkel-fiksen (e184484)
          # lagrar no ein finn-bar -rask-cache, men fyrste kalde run må fullføre for å varme han.
          NC_PARALLEL_TEST_TIMEOUT: "9000"
          NC_PARALLEL_TEST_MIN_TOTAL: "100"
          TEST_TIMEOUT: "25"
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/nc_test_parallel.no"
        run: ./bin/nc run tools/nc_test_parallel.no
      # 2026-09-11: alle steg etter testlana vart 7–9 gonger tregare på promoteringsgreina
      # (media-gate 2270 s mot 307 s på main). Vis kva som framleis køyrer og diskbruken.
      - name: Prosessdiagnose etter testlana
        if: success() || failure()
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/ci_proc_diag.no"
        run: ./bin/nc run tools/ci_proc_diag.no
      # 2026-09-04: den raske lana GJENOPPRETTA cachen men lagra han aldri (berre slow-lana
      # hadde save) → kvar køyring rekompilerte alle testar frå ei ~6 MB gammal cache → 4 shards
      # × 4800 s timeout på macOS. Lagra alltid (òg ved timeout) med eigen nøkkel-suffiks så
      # slow-lana sin save (same run_id) ikkje kolliderer.
      - name: Lagra test-compile-cache (rask lane; òg ved feil/timeout — neste køyring startar varm)
        if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: build/nc-test-cache
          key: nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-macos-arm64', 'build/v9400/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-rask-${{ github.run_id }}
      - name: "Media runtime gate"
        # 2026-09-06: 15 testar × kandidat-run; Linux 5,7 min, lokal macOS 3,5 min, men
        # CI-macOS-runneren (3–4× tregare, rett etter 4 test-shards) traff 15-min-taket.
        timeout-minutes: 40
        env:
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_MEDIA_RUNTIME_BIN: ${{ github.workspace }}/dist/norscode_native
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          # Porten spawnar kandidat-testar som skriv relative stiar (build/…). Barnet
          # arvar denne rota som NORSCODE_VM_TARGET_DISK_ROOT (prioritert i nc_run_policy),
          # så ei rot utan "." nektar relative skrivingar. Same verdi som test-shard-stega.
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/native_media_runtime_gate_v3010.no"
        run: ./bin/nc run tools/native_media_runtime_gate_v3010.no
      - name: "Omgang 6 smoke: skriv"
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc verify-omgang6 skriv"
        run: ./bin/nc verify-omgang6 skriv
      - name: "Omgang 6 smoke: int-to-str"
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc verify-omgang6 int"
        run: ./bin/nc verify-omgang6 int
      - name: "Omgang 6b: Stage-0 ELF"
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc verify-omgang6b"
        run: ./bin/nc verify-omgang6b

  macos-runtime-attestation:
    name: macOS runtime attestasjon (arm64)
    needs: native-macos-build
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-macos-arm64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: norscode-native-macos
          path: .
      - name: Gjenopprett køyrbar artefaktmodus
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-macos-arm64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-macos-arm64"
        run: ./bootstrap/stage0/norscode-macos-arm64
      - name: Bygg single-binary macOS-kandidat i Norscode
        env:
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./dist/norscode_native
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/build_macos_attestation_candidate.no
          NORSCODE_NATIVE_BIN: ${{ github.workspace }}/dist/norscode_native
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./dist/norscode_native"
        run: ./dist/norscode_native
      - name: Kjør ekte macOS runtime-attestasjon
        env:
          RUNNER_ARCH: ${{ runner.arch }}
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./build/norscode_native_macos_attested
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/macos_runtime_attestation.no
          NORSCODE_NATIVE_BIN: ${{ github.workspace }}/build/norscode_native_macos_attested
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write,net.tcp,net.tls
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./build/norscode_native_macos_attested"
        run: ./build/norscode_native_macos_attested
      - name: Signer macOS runtime-attestasjon
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: reports/macos-runtime-attestation.json
      - name: Verifiser samla macOS-plattformreadiness
        env:
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./build/norscode_native_macos_attested
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/platform_readiness_v3600.no
          NORSCODE_NATIVE_BIN: ${{ github.workspace }}/build/norscode_native_macos_attested
          NORSCODE_MACOS_CANDIDATE: ${{ github.workspace }}/build/norscode_native_macos_attested
          NORSCODE_MACOS_ATTESTATION: ${{ github.workspace }}/reports/macos-runtime-attestation.json
          NORSCODE_REQUIRE_MACOS_ATTESTATION: "1"
          NORSCODE_SOURCE_COMMIT: ${{ github.sha }}
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./build/norscode_native_macos_attested"
        run: ./build/norscode_native_macos_attested
      - name: Last opp macOS attestasjon
        uses: actions/upload-artifact@v6
        with:
          name: norscode-macos-runtime-attestation
          path: |
            build/norscode_native_macos_attested
            reports/macos-runtime-attestation.json
          if-no-files-found: error
          retention-days: 3

  native-macos-slow:
    name: Slow tests macOS (chunk/selfhost) shard ${{ matrix.shard }}
    needs: native-macos-build
    runs-on: macos-latest
    # 2026-09-06: éin 7 GB-macOS-runner brukte 300 min på heile suiten og drukna i
    # forlatne compile-prosessar. Spreier dei deterministiske shardane (indeks
    # 2026-09-07: nc_test.no DIREKTE per shard (NC_TEST_SHARD/SHARDS=4) over fire runnarar;
    # compile-cache-spor (-s<k>-).
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      NORSCODE_CI_SYSTEM: macOS
      NORSCODE_CI_ARCH: arm64
      NORSCODE_ROOT: ${{ github.workspace }}
      NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write,net.dns,net.connect,net.tcp,net.tls,net.listen,net.udp,thread.spawn,jit.execute
      NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
      TMPDIR: /tmp
    timeout-minutes: 240
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-macos-arm64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: norscode-native-macos
          path: .
      - name: Gjenopprett runtime-modus gjennom Norscode
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-macos-arm64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-macos-arm64"
        run: ./bootstrap/stage0/norscode-macos-arm64
      - name: Gjenopprett test-compile-cache (innhaldsadressert NCB-cache; sparar ~40 s hybrid-compile per test på seed-dist)
        uses: actions/cache/restore@v4
        with:
          path: build/nc-test-cache
          key: nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-macos-arm64', 'build/v9400/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-${{ github.run_id }}
          restore-keys: |
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-macos-arm64', 'build/v9400/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-slow-s${{ matrix.shard }}-
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-macos-arm64', 'build/v9400/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-slow-
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-macos-arm64', 'build/v9400/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-rask-
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-macos-arm64', 'build/v9400/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-
      - name: Komplett testsuite (direkte nc_test.no per shard, live progress)
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NC_CI: "1"
          TMPDIR: /tmp
          NC_TEST_ALL: "1"
          NC_SLOW_TESTS: "1"
          SLOW_TEST_TIMEOUT: "1200"
          TEST_TIMEOUT: "600"
          # 2 shards (var 4): 16 GB-runneren blei drepen (exit 143) idet 4 parallelle
          # hybrid-compile (~8.8 GB kvar) starta. Færre samtidige compile = mindre
          # minnepress. Kvar shard tek meir arbeid.
          # 2026-09-06: 190 min/shard var for lite òg med varm cache (Linux 1022/1081
          # bestått, macOS 729/1081 ved taket; +100–180 testar per køyring etter kvart
          # som compile-cachen veks). 300 min (job 350 av GitHub-maks 360) let lanen
          # fullføre og lagre ein komplett cache i éi køyring.
          # 2026-09-06: 3 shardar spreidde over 3 runnarar (matrix). Kvar jobb køyrer
          # ~1/3 av suiten: 200 min harness-budsjett, 220 min runner-vakt, 240 min jobb.
          # 2026-09-07: køyrer nc_test.no DIREKTE per shard (NC_TEST_SHARD/SHARDS),
          # ikkje nc_test_parallel-wrapperen. Wrapperen sin async-pipe strøymde ikkje
          # barnet sitt stdout på committed stage0 → 0 byte progresjon ved OOM. Direkte
          # + NC_TEST_PROGRESS_FILE (append per test til disk) overlever runner-død →
          # siste «START»-linje = testen som køyrde. 4 shardar (var 3) = raskare/lettare.
          NC_TEST_SHARD: "${{ matrix.shard }}"
          NC_TEST_SHARDS: "4"
          # Deferrar dei 10 tyngste hybrid-compile-testane (macho_arm64_codegen/
          # native_codegen_v2-importørar, ~10+ GB) til fersk-seed-porten; sjå er_tung_compile.
          NC_SKIP_HEAVY_COMPILE: "1"
          NC_TEST_PROGRESS_FILE: ${{ github.workspace }}/build/nc-test-progress-shard-${{ matrix.shard }}.log
          NORSCODE_VM_CI_STEP_TIMEOUT_MS: "13200000"
          NORSCODE_VM_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write
          # macOS-stage0 sin async-backend respekterer environment-kartet → testbarn
          # via async-ABI med SIGKILL ved timeout (forlatne compile-prosessar).
          NC_TEST_ASYNC_SPAWN: "1"
          # 2026-09-10: tilbake i ci_shell_runner (aktiv-flate-porten tillèt ikkje
          # bash-steg). NORSCODE_VM_CI_STREAM strøymer barnet sitt stdout i ~5 s-bitar
          # (verifisert på macOS-stage0) og NC_TRACE_TESTS skriv «[RUN] test» før kvar
          # test → siste [RUN]-linje i loggen = testen som køyrde då runneren døydde.
          NC_TRACE_TESTS: "1"
          NORSCODE_VM_CI_STREAM: "1"
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/nc_test.no"
        run: ./bin/nc run tools/nc_test.no
      - name: "Testframgang (overlever OOM): siste START = skuldig test"
        if: always()
        env:
          NC_TEST_PROGRESS_FILE: ${{ github.workspace }}/build/nc-test-progress-shard-${{ matrix.shard }}.log
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/ci_test_progress_tail.no"
        run: ./bin/nc run tools/ci_test_progress_tail.no
      - name: Last opp testframgang (per-test-tid, «DONE <utfall> <ms> <test>»)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nc-test-progress-macos-slow-${{ matrix.shard }}
          path: build/nc-test-progress-shard-${{ matrix.shard }}.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Lagra test-compile-cache (òg ved feil/timeout — neste køyring startar varm)
        if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: build/nc-test-cache
          key: nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-macos-arm64', 'build/v9400/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-slow-s${{ matrix.shard }}-${{ github.run_id }}

  # ─── Linux: bygg → artefakt → verify ─────────────────────────────────────────
  native-linux-build:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - name: Materialiser native frå stage-0 seed
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - name: Verifiser stage-0 seed
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc verify-seed"
        run: ./bin/nc verify-seed
      - uses: actions/upload-artifact@v6
        with:
          name: norscode-native-linux
          path: |
            dist/norscode_native
            bin/nc
          retention-days: 1

  native-linux:
    name: Native Linux (x86_64)
    needs: native-linux-build
    runs-on: ubuntu-latest
    env:
      NORSCODE_CI_SYSTEM: Linux
      NORSCODE_CI_ARCH: x86_64
      NORSCODE_ROOT: ${{ github.workspace }}
      NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write,net.dns,net.connect,net.tcp,net.tls,net.listen,net.udp,thread.spawn,jit.execute
      NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
      NORSCODE_EXPECT_EVENT_BACKEND: epoll
      NORSCODE_EXPECT_SANDBOX_BACKEND: seccomp
      NC_TRACE_TESTS: "1"
      TEST_TIMEOUT: "60"
      # Fersk sjølv-hosta stage0: VM-bokhaldet (skyggeheapen) gjer listetung kode 10–50×
      # tregare; alle fire shards gjekk ut på 100 min. Verktøy i fast-modus; nc_test held
      # bokhaldet på for testar som målar det (test_vm_fast i tools/nc_test.no).
      NORSCODE_VM_FAST: "1"
      NC_TEST_VM_FAST: "1"
    timeout-minutes: 300
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: norscode-native-linux
          path: .
      - name: Gjenopprett runtime-modus gjennom Norscode
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc selfhost-bootstrap-gate"
        run: ./bin/nc selfhost-bootstrap-gate
      - name: "Steg C: Bootstrap-self (pure VM)"
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc bootstrap-self"
        run: ./bin/nc bootstrap-self
      - name: Install VM loader fixtures
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/install_vm_loader_fixtures.no"
        run: ./bin/nc run tools/install_vm_loader_fixtures.no
      - name: Gjenopprett test-compile-cache (innhaldsadressert NCB-cache; sparar ~40 s hybrid-compile per test på seed-dist)
        uses: actions/cache/restore@v4
        with:
          path: build/nc-test-cache
          key: nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-linux-x86_64', 'bootstrap/precompiled/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-${{ github.run_id }}
          restore-keys: |
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-linux-x86_64', 'bootstrap/precompiled/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-rask-
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-linux-x86_64', 'bootstrap/precompiled/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-slow-
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-linux-x86_64', 'bootstrap/precompiled/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-
      - name: "Test (rask CI): 3 deterministiske parallelle shards"
        timeout-minutes: 160
        env:
          # 2026-09-20 (#200): fersk promotert seed er «listetung» → kvar shard-prosess
          # held ~2-2,5 GB (compile-arbeidssett i bump-allokatoren, aldri frigjort) +
          # tunge krypto-testbarn (t.d. test_argon2_native ~1 GB). 4 samtidige shards
          # sprengde runner-RAM → «runner shutdown signal»/143 (OOM) etter ~37 min. Main
          # (slankare seed) passerte på 4. Ned til 3 shards kappar toppminnet ~25 % og
          # held god parallellitet innanfor 115-min-budsjettet. Sjå [[seed-bytes-builtins-kostnad]].
          NC_PARALLEL_TEST_SHARDS: "3"
          # 4800->6000 s (80->100 min): macOS-fast-runneren traff 79,5 av 80 min og
          # timeout-a (passerte på ~72 min før) — marginal pga treg runner + tynn cache.
          # 6000->9000 s (100->150 min), 2026-09-24: kaldstart etter reseed. Cache-nøkkelen
          # hashar stage0-seedane og hybrid-verktøyet, så kvar ny seed startar kaldt
          # («Cache not found»). På d3a0901/b33dd51 var shard 0 og 2 grøne, men shard 1
          # traff 6000-s-taket etter den siste testen. Same kaldstart-hump som macOS-fast
          # (sjå over). Varme køyringar ligg godt under, så taket kostar berre ved kaldstart.
          NC_PARALLEL_TEST_TIMEOUT: "9000"
          NC_PARALLEL_TEST_MIN_TOTAL: "100"
          TEST_TIMEOUT: "25"
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/nc_test_parallel.no"
        run: ./bin/nc run tools/nc_test_parallel.no
      # 2026-09-04: den raske lana GJENOPPRETTA cachen men lagra han aldri (berre slow-lana
      # hadde save) → kvar køyring rekompilerte alle testar frå ei ~6 MB gammal cache → 4 shards
      # × 4800 s timeout på macOS. Lagra alltid (òg ved timeout) med eigen nøkkel-suffiks så
      # slow-lana sin save (same run_id) ikkje kolliderer.
      - name: Lagra test-compile-cache (rask lane; òg ved feil/timeout — neste køyring startar varm)
        if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: build/nc-test-cache
          key: nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-linux-x86_64', 'bootstrap/precompiled/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-rask-${{ github.run_id }}
      # 2026-09-24 (H1): dei tre portane under er uavhengige av test-shardane. Utan
      # `!cancelled()` vart dei `skipped` kvar gong teststeget feila (40 av 40 run på
      # PR #200), så fiksar i dei vart aldri køyrde på fersk Linux-seed. No køyrer dei
      # alltid og viser eigen grøn/raud status — meir dekning, ikkje mindre.
      - name: "Media runtime gate"
        if: ${{ !cancelled() }}
        # 2026-09-06: 15 testar × kandidat-run; Linux 5,7 min, lokal macOS 3,5 min, men
        # CI-macOS-runneren (3–4× tregare, rett etter 4 test-shards) traff 15-min-taket.
        timeout-minutes: 40
        env:
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_MEDIA_RUNTIME_BIN: ${{ github.workspace }}/dist/norscode_native
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          # Porten spawnar kandidat-testar som skriv relative stiar (build/…). Barnet
          # arvar denne rota som NORSCODE_VM_TARGET_DISK_ROOT (prioritert i nc_run_policy),
          # så ei rot utan "." nektar relative skrivingar. Same verdi som test-shard-stega.
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/native_media_runtime_gate_v3010.no"
        run: ./bin/nc run tools/native_media_runtime_gate_v3010.no
      - name: "verify-omgang6"
        if: ${{ !cancelled() }}
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc verify-omgang6"
        run: ./bin/nc verify-omgang6
      - name: "Omgang 6b: Stage-0 ELF"
        if: ${{ !cancelled() }}
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc verify-omgang6b"
        run: ./bin/nc verify-omgang6b

  linux-runtime-attestation:
    name: Linux runtime attestasjon (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Attestasjonen målar plattform-ABI-en, ikkje VM-bokhaldet (fersk sjølv-hosta stage0).
      NORSCODE_VM_FAST: "1"
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - name: Materialiser committed Linux stage0
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - name: Bygg single-binary Linux-kandidat i Norscode
        env:
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./dist/norscode_native
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/build_linux_attestation_candidate.no
          NORSCODE_NATIVE_BIN: ${{ github.workspace }}/dist/norscode_native
          NORSCODE_LINUX_ATTESTATION_CANDIDATE: ${{ github.workspace }}/dist/norscode_native
          NORSCODE_LINUX_CANDIDATE_ALREADY_EMBEDDED: "1"
          NORSCODE_LINUX_ATTESTATION_NCB: ${{ github.workspace }}/build/linux_runtime_attestation_probe.ncb.json
          NORSCODE_LINUX_ARM64_ATTESTATION_NCB: ${{ github.workspace }}/build/linux_arm64_runtime_attestation_probe.ncb.json
          NORSCODE_LINUX_ATTESTATION_DRIVER_NCB: ${{ github.workspace }}/build/linux_runtime_attestation_driver.ncb.json
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./dist/norscode_native"
        run: ./dist/norscode_native
      - name: Kjør ekte Linux runtime-attestasjon
        env:
          RUNNER_ARCH: ${{ runner.arch }}
          NORSCODE_VM_CI_CHILD_CMD: run-ncb
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./dist/norscode_native
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/build/linux_runtime_attestation_driver.ncb.json
          NORSCODE_NATIVE_BIN: ${{ github.workspace }}/dist/norscode_native
          NORSCODE_LINUX_ATTESTATION_ARCH: x86_64
          NORSCODE_LINUX_ATTESTATION_NCB: ${{ github.workspace }}/build/linux_runtime_attestation_probe.ncb.json
          NORSCODE_LINUX_ATTESTATION_OUTPUT: ${{ github.workspace }}/reports/linux-runtime-attestation-x86_64.json
          # Rein-Norscode TLS-matrisa (pure-VM ECC) er iboande treg (~8 min på rask runner);
          # 900 s-standarden i linux_runtime_attestation.no sprakk på trege runnarar (drepen 902 s).
          # 45 min gjev rikeleg margin under 60-min job-grensa og gjev framleis ekte FAIL ved reell heng.
          NORSCODE_LINUX_PROBE_TIMEOUT_MS: "2700000"
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write,net.tcp,net.tls,thread.spawn
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./dist/norscode_native"
        run: ./dist/norscode_native
      - name: Signer Linux runtime-attestasjon
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: reports/linux-runtime-attestation-x86_64.json
      - name: Last opp Linux-attestasjon
        uses: actions/upload-artifact@v6
        with:
          name: norscode-linux-x86_64-runtime-attestation
          path: |
            dist/norscode_native
            build/linux_runtime_attestation_probe.ncb.json
            build/linux_arm64_runtime_attestation_probe.ncb.json
            build/linux_runtime_attestation_driver.ncb.json
            reports/linux-runtime-attestation-x86_64.json
          if-no-files-found: error
          retention-days: 3

  native-linux-slow:
    name: Slow tests Linux (chunk/selfhost) shard ${{ matrix.shard }}
    needs: native-linux-build
    runs-on: ubuntu-latest
    # 2026-09-06: runneren fekk «shutdown signal» (exit 143, OOM) etter 96 min utan
    # ein einaste logglinje. To runnarar (indeks modulo 2) + strøymd logg.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      NORSCODE_CI_SYSTEM: Linux
      NORSCODE_CI_ARCH: x86_64
      # Fersk sjølv-hosta stage0: sjå native-linux (fast-modus for verktøy, bokhald på
      # for testar som målar det).
      NORSCODE_VM_FAST: "1"
      NC_TEST_VM_FAST: "1"
      NORSCODE_ROOT: ${{ github.workspace }}
      NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write,net.dns,net.connect,net.tcp,net.tls,net.listen,net.udp,thread.spawn,jit.execute
      NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
    timeout-minutes: 240
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: norscode-native-linux
          path: .
      - name: Gjenopprett runtime-modus gjennom Norscode
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - name: Norscode GC, relokering og trådsikkerhet
        # Normalt ~10 min (8 testar, test_runtime_memory ~260 s i slow-modus); taket
        # avgrensar verste fall så suiten under alltid rekk å køyre.
        timeout-minutes: 45
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write,thread.spawn
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/ci_native_gc.no"
        run: ./bin/nc run tools/ci_native_gc.no
      # 2026-09-24 (H4): GC-matrisa feilar no når ein test blir hoppa over (før: «OK (8/8)»
      # med test_runtime_memory SKIP). Ho er ein uavhengig port; ein raud matrise skal ikkje
      # gøyme heile slow-suiten for sharden, difor `!cancelled()` på cache og suite.
      - name: Gjenopprett test-compile-cache (innhaldsadressert NCB-cache; sparar ~40 s hybrid-compile per test på seed-dist)
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v4
        with:
          path: build/nc-test-cache
          key: nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-linux-x86_64', 'bootstrap/precompiled/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-${{ github.run_id }}
          restore-keys: |
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-linux-x86_64', 'bootstrap/precompiled/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-slow-s${{ matrix.shard }}-
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-linux-x86_64', 'bootstrap/precompiled/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-slow-
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-linux-x86_64', 'bootstrap/precompiled/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-rask-
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-linux-x86_64', 'bootstrap/precompiled/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-
      - name: Komplett testsuite (direkte nc_test.no per shard, live progress)
        if: ${{ !cancelled() }}
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NC_CI: "1"
          TMPDIR: /tmp
          NC_TEST_ALL: "1"
          NC_SLOW_TESTS: "1"
          SLOW_TEST_TIMEOUT: "1200"
          TEST_TIMEOUT: "600"
          # 2 shards (var 4): 16 GB-runneren blei drepen (exit 143) idet 4 parallelle
          # hybrid-compile (~8.8 GB kvar) starta. Færre samtidige compile = mindre
          # minnepress. Kvar shard tek meir arbeid.
          # 2026-09-06: 190 min/shard var for lite òg med varm cache (Linux 1022/1081
          # bestått, macOS 729/1081 ved taket; +100–180 testar per køyring etter kvart
          # som compile-cachen veks). 300 min (job 350 av GitHub-maks 360) let lanen
          # fullføre og lagre ein komplett cache i éi køyring.
          # 2026-09-06: 2 shardar spreidde over 2 runnarar (matrix); 200 min harness,
          # 220 min runner-vakt, 240 min jobb. Loggen blir strøymd (NORSCODE_VM_CI_STREAM).
          # 2026-09-07: nc_test.no DIREKTE per shard (sjå macOS-lanen). Shard 1 fekk
          # exit 143 (runner-OOM) på 185 min med wrapperen — utan progresjon i loggen.
          # Progressfila viser skuldig test. 4 shardar (var 2) = ~270 testar/shard.
          NC_TEST_SHARD: "${{ matrix.shard }}"
          NC_TEST_SHARDS: "4"
          # 2026-09-25 (H2): INGEN NC_SKIP_HEAVY_COMPILE her. Den committa Linux-seeden er
          # den ferske sjølv-hosta seeden (R1), som kompilerer dei 16 utsette testane
          # (er_tung_compile + er_committed_seed_ustabil) nativt og billeg: 16/16 grøne på
          # R1 (seed-gate-jobben 3×~1 min, lokal Docker-harness). macOS-lana (C-æra-seed)
          # utset dei framleis. Lana er raud på R1 frå før (to phase8-fiksturtestar, sjå
          # seed-gate-linux), så seed-gate-linux køyrer dei 16 òg på push/PR til ho er grøn.
          NC_TEST_PROGRESS_FILE: ${{ github.workspace }}/build/nc-test-progress-shard-${{ matrix.shard }}.log
          NORSCODE_VM_CI_STEP_TIMEOUT_MS: "13200000"
          NORSCODE_VM_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write
          # 16 GB-runner: cap 10 GiB (var 12) — ein enkelt compile som spring forbi
          # 16 GB drap runneren (exit 143) trass i 12 GB-cap. 10 GiB gjev meir
          # headroom under runner-taket medan legitime ~8.8 GB-compile framleis passerer.
          NC_TEST_MEMORY_BYTES: "10737418240"
          # 2026-09-10: tilbake i ci_shell_runner (sjå macOS-lanen): strøymd logg +
          # «[RUN] test» per test erstattar bash tail -F for OOM-diagnose.
          NC_TRACE_TESTS: "1"
          NORSCODE_VM_CI_STREAM: "1"
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/nc_test.no"
        run: ./bin/nc run tools/nc_test.no
      - name: "Testframgang (overlever OOM): siste START = skuldig test"
        if: always()
        env:
          NC_TEST_PROGRESS_FILE: ${{ github.workspace }}/build/nc-test-progress-shard-${{ matrix.shard }}.log
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/ci_test_progress_tail.no"
        run: ./bin/nc run tools/ci_test_progress_tail.no
      - name: Last opp testframgang (per-test-tid, «DONE <utfall> <ms> <test>»)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nc-test-progress-linux-slow-${{ matrix.shard }}
          path: build/nc-test-progress-shard-${{ matrix.shard }}.log
          if-no-files-found: ignore
          retention-days: 14
      # Cache-nøkkelen er plattformspesifikk (2026-09-24, H8). Han dekkjer committa
      # kompilator-input som seeden les UTANOM kjeldegrafen, sidan dependency_key og
      # compiler_implementation_key i nc_test.no berre hashar .no-kjelder:
      # - Linux: Linux-seeden + bootstrap/precompiled (berre vm.ncb.json att etter J1b;
      #   bootstrap/stdlib er fjerna i J1a, og selfhost-/stdlib-cachen er kjeldehash-porta).
      # - macOS: macOS-seeden + build/v9400 (C-æra-seeden kompilerer med den committa
      #   hybrid_compiler_bundle_v9400.ncb.json når fila finst; precompiled/stdlib endrar
      #   ikkje compile-outputen der, jf. json-inventory §1).
      # Ein reseed av den eine plattforma kastar ikkje lenger den andre sin varme cache.
      # `if: always()` er vurdert og forkasta: 2026-09-05 lagra ei kansellert køyring
      # avkorta NCB-ar skrivne av foreldrelause shard-prosessar (sjå cache_ncb_gyldig i
      # tools/nc_test.no), og cache-publiseringa der er kopi+slett, ikkje atomisk rename.
      - name: Lagra test-compile-cache (òg ved feil/timeout — neste køyring startar varm)
        if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: build/nc-test-cache
          key: nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-linux-x86_64', 'bootstrap/precompiled/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-slow-s${{ matrix.shard }}-${{ github.run_id }}

  # ─── Fersk-seed-porten: tools/seed_gate_tests.txt på Linux-seeden (H2) ───────────
  # Lista (krev_ny_seed-testane) vart køyrd av b2-seed-direct.yml til han vart sletta i
  # ef4da9c. Den committa Linux-seeden er no sjølv den ferske sjølv-hosta seeden (R1).
  # 2026-09-25 (H2): dei 16 testane slow-lana tidlegare utsette (er_tung_compile +
  # er_committed_seed_ustabil) var grøne her på R1 (16/16), og native-linux-slow køyrer dei
  # no òg (NC_SKIP_HEAVY_COMPILE er fjerna der). MEN native-linux-slow er raud på R1 frå før
  # (test_bundle_metadata_merge + test_nc_main_metadata_recovery: phase8-fiksturen er avleidd
  # av den regenererte vm.ncb-en, som har 27 globalar, ikkje 10; J1b byter til syntetisk
  # fikstur). Ein ny feil blant dei 16 ville difor gøyme seg bak den raude fargen der.
  # Difor køyrer porten framleis på push/PR med BERRE dei 16 (NC_TEST_BERRE_UTSETTE: same
  # predikat som NC_SKIP_HEAVY_COMPILE), som eige, synleg signal. Fjern push/PR-køyringa når
  # native-linux-slow er grøn. Heile tools/seed_gate_tests.txt køyrer ved workflow_dispatch.
  # IKKJE påkravd (continue-on-error): jobben viser raud sjekk, men køyringa blir grøn.
  seed-gate-linux:
    name: seed-gate (Linux) shard ${{ matrix.shard }}
    needs: native-linux-build
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      NORSCODE_CI_SYSTEM: Linux
      NORSCODE_CI_ARCH: x86_64
      NORSCODE_VM_FAST: "1"
      NC_TEST_VM_FAST: "1"
      NORSCODE_ROOT: ${{ github.workspace }}
      NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write,net.dns,net.connect,net.tcp,net.tls,net.listen,net.udp,thread.spawn,jit.execute
      NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
    timeout-minutes: 200
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: norscode-native-linux
          path: .
      - name: Gjenopprett runtime-modus gjennom Norscode
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      # Berre restore: gjenbruk NCB-ane som slow-/fast-lana har kompilert (same nøkkel),
      # utan å leggje fleire cache-blobbar i repo-kvoten.
      - name: Gjenopprett test-compile-cache (frå Linux-lanane)
        uses: actions/cache/restore@v4
        with:
          path: build/nc-test-cache
          key: nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-linux-x86_64', 'bootstrap/precompiled/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-${{ github.run_id }}
          restore-keys: |
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-linux-x86_64', 'bootstrap/precompiled/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-slow-
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-linux-x86_64', 'bootstrap/precompiled/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-rask-
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-linux-x86_64', 'bootstrap/precompiled/**', 'tools/compile_with_hybrid_bundle_v9400.no') }}-
      - name: "Seed-porten: tools/seed_gate_tests.txt via nc_test.no"
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NC_CI: "1"
          TMPDIR: /tmp
          # push/PR: ingen listefil, berre dei utsette testane frå tests/ (NC_TEST_BERRE_UTSETTE).
          # workflow_dispatch: heile tools/seed_gate_tests.txt (éitt testnamn per linje).
          # NC_TEST_ALL slår av lane-filteret, og NC_SKIP_HEAVY_COMPILE er medvite IKKJE sett.
          NC_TEST_LIST_FILE: ${{ github.event_name == 'workflow_dispatch' && format('{0}/tools/seed_gate_tests.txt', github.workspace) || '' }}
          NC_TEST_BERRE_UTSETTE: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
          NC_TEST_ALL: "1"
          NC_SLOW_TESTS: "1"
          SLOW_TEST_TIMEOUT: "1200"
          TEST_TIMEOUT: "600"
          NC_TEST_SHARD: "${{ matrix.shard }}"
          NC_TEST_SHARDS: "3"
          NC_TEST_PROGRESS_FILE: ${{ github.workspace }}/build/nc-test-progress-seedgate-${{ matrix.shard }}.log
          NORSCODE_VM_CI_STEP_TIMEOUT_MS: "10800000"
          NORSCODE_VM_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write
          NC_TEST_MEMORY_BYTES: "10737418240"
          NC_TRACE_TESTS: "1"
          NORSCODE_VM_CI_STREAM: "1"
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/nc_test.no"
        run: ./bin/nc run tools/nc_test.no
      - name: "Testframgang (overlever OOM): siste START = skuldig test"
        if: always()
        env:
          NC_TEST_PROGRESS_FILE: ${{ github.workspace }}/build/nc-test-progress-seedgate-${{ matrix.shard }}.log
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/ci_test_progress_tail.no"
        run: ./bin/nc run tools/ci_test_progress_tail.no
      - name: Last opp testframgang (per-test-tid, «DONE <utfall> <ms> <test>»)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nc-test-progress-seedgate-${{ matrix.shard }}
          path: build/nc-test-progress-seedgate-${{ matrix.shard }}.log
          if-no-files-found: ignore
          retention-days: 14

  acme-pebble-issuance:
    name: ACME RFC 8555-utstedelse (Pebble)
    needs: native-linux-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Fersk sjølv-hosta stage0: ACME-klienten og DNS-tenaren er trusta verktøy (fast-modus).
      NORSCODE_VM_FAST: "1"
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: norscode-native-linux
          path: .
      - name: Gjenopprett runtime-modus gjennom Norscode
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - name: Start fastlåst Pebble og Norscode DNS/TCP-server
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write,net.dns,net.connect,net.tcp,net.tls
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/acme_pebble_ci.no"
        run: ./bin/nc run tools/acme_pebble_ci.no
      - name: Full konto-, DNS-01- og sertifikatutstedelse
        env:
          NORSCODE_ACME_DIRECTORY: https://localhost:14000/dir
          NORSCODE_ACME_CA_FILE: /tmp/pebble.minica.pem
          NORSCODE_ACME_DNS_VALUE_FILE: /tmp/norscode-acme-share/value
          NORSCODE_ACME_DNS_ACK_FILE: /tmp/norscode-acme-share/ack
          NODE_BIN: /nonexistent
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write,net.listen,net.connect,net.tcp,net.udp,net.dns,net.tls
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/acme_pebble_issuance_gate.no"
        run: ./bin/nc run tools/acme_pebble_issuance_gate.no
      - name: Stopp Pebble
        if: always()
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_ACME_CI_ACTION: cleanup
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/acme_pebble_ci.no"
        run: ./bin/nc run tools/acme_pebble_ci.no

  # Materialiser PE-kandidaten frå committed Windows-stage0 og verifiserte
  # NCB-payloadar. Ingen C-/Zig-krysskompilator er del av aktiv CI.
  windows-runtime-candidate:
    name: Windows runtime kandidat (Norscode cross-build)
    needs: native-macos-build
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-macos-arm64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: norscode-native-macos
          path: .
      - name: Gjenopprett køyrbar artefaktmodus
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-macos-arm64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-macos-arm64"
        run: ./bootstrap/stage0/norscode-macos-arm64
      - name: Bygg Windows-kandidat gjennom Norscode stage0/NCB
        env:
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./dist/norscode_native
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/build_windows_stage0_candidate.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_NATIVE_BIN: ${{ github.workspace }}/dist/norscode_native
          NORSCODE_USE_PRECOMPILED_SELFHOST: "0"
          NORSCODE_RUN_CACHE: "0"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./dist/norscode_native"
        run: ./dist/norscode_native
      - uses: actions/upload-artifact@v6
        with:
          name: norscode-windows-cross-candidate
          path: |
            build/windows/norscode_native_windows_x86_64.exe
          if-no-files-found: error
          retention-days: 3

  # Windows ABI må verifiseres i hoved-CI-en, ikkje berre ved release/tag.
  windows-runtime-cross-compile:
    name: Windows runtime ABI (x86_64)
    needs: windows-runtime-candidate
    if: ${{ true }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-windows-x86_64.exe run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: norscode-windows-cross-candidate
          path: build/windows
      - name: Verifiser tracked Windows stage0
        env:
          NORSCODE_NATIVE_BIN: ${{ github.workspace }}/bootstrap/stage0/norscode-windows-x86_64.exe
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-windows-x86_64.exe selftest"
        run: ./bootstrap/stage0/norscode-windows-x86_64.exe selftest
      - name: Kjør og attester Windows runtime
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_NATIVE_BIN: ${{ github.workspace }}/build/windows/norscode_native_windows_x86_64.exe
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./build/windows/norscode_native_windows_x86_64.exe
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/windows_runtime_attestation.no
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./build/windows/norscode_native_windows_x86_64.exe"
        run: ./build/windows/norscode_native_windows_x86_64.exe
      - name: Signer Windows runtime-attestasjon
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: reports/windows-runtime-attestation.json
      - name: Verifiser samla Windows-plattformreadiness
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_NATIVE_BIN: ${{ github.workspace }}/build/windows/norscode_native_windows_x86_64.exe
          NORSCODE_WINDOWS_CANDIDATE: ${{ github.workspace }}/build/windows/norscode_native_windows_x86_64.exe
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./build/windows/norscode_native_windows_x86_64.exe
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/platform_readiness_v3600.no
          NORSCODE_WINDOWS_ATTESTATION: ${{ github.workspace }}/reports/windows-runtime-attestation.json
          NORSCODE_REQUIRE_WINDOWS_ATTESTATION: "1"
          NORSCODE_SOURCE_COMMIT: ${{ github.sha }}
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./build/windows/norscode_native_windows_x86_64.exe"
        run: ./build/windows/norscode_native_windows_x86_64.exe
      - name: Last opp Windows ABI-diagnose
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: norscode-windows-runtime-abi
          path: |
            build/windows/norscode_native_windows_x86_64.exe
            reports/windows-runtime-attestation.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Verifiser tracked stage0 mot attestert kandidat
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./build/windows/norscode_native_windows_x86_64.exe
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/verify_identical_files.no
          NORSCODE_COMPARE_FILE_A: ${{ github.workspace }}/bootstrap/stage0/norscode-windows-x86_64.exe
          NORSCODE_COMPARE_FILE_B: ${{ github.workspace }}/build/windows/norscode_native_windows_x86_64.exe
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,disk.read
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./build/windows/norscode_native_windows_x86_64.exe"
        run: ./build/windows/norscode_native_windows_x86_64.exe

  all-platform-runtime-attestation:
    name: Samla signert plattformreadiness
    needs:
      - macos-runtime-attestation
      - linux-runtime-attestation
      - windows-runtime-cross-compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: norscode-macos-runtime-attestation
          path: build/attest/macos
      - uses: actions/download-artifact@v7
        with:
          name: norscode-linux-x86_64-runtime-attestation
          path: build/attest/linux-x86
      - uses: actions/download-artifact@v7
        with:
          name: norscode-windows-runtime-abi
          path: build/attest/windows
      - name: Verifiser alle signerte runtime-attestasjonar samla
        env:
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/platform_readiness_v3600.no
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_NATIVE_BIN: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_MACOS_CANDIDATE: ${{ github.workspace }}/build/attest/macos/build/norscode_native_macos_attested
          NORSCODE_MACOS_ATTESTATION: ${{ github.workspace }}/build/attest/macos/reports/macos-runtime-attestation.json
          NORSCODE_LINUX_CANDIDATE: ${{ github.workspace }}/build/attest/linux-x86/dist/norscode_native
          NORSCODE_LINUX_X86_64_ATTESTATION: ${{ github.workspace }}/build/attest/linux-x86/reports/linux-runtime-attestation-x86_64.json
          NORSCODE_WINDOWS_CANDIDATE: ${{ github.workspace }}/build/attest/windows/build/windows/norscode_native_windows_x86_64.exe
          NORSCODE_WINDOWS_ATTESTATION: ${{ github.workspace }}/build/attest/windows/reports/windows-runtime-attestation.json
          NORSCODE_REQUIRE_MACOS_ATTESTATION: "1"
          NORSCODE_REQUIRE_LINUX_ATTESTATION: "1"
          # ARM64: C.5 fjerna C-arkivet, og den einaste vegen til ein current-ABI
          # ARM64-runtime gjekk gjennom gcc + build/v3009/native_candidate_gc.c.
          # Rein Norscode har enno ingen AArch64 full-host runtime (berre x86-64 har
          # NcVal-runtime i native_codegen_v2.no), so ARM64-attestasjon er reelt
          # BLOKKERT til B2/C.2 landar. Rapporten held fram med å seie
          # production_ready_linux_arm64=false — vi maskerer ingenting, vi krev det
          # berre ikkje som port medan det er umogleg.
          NORSCODE_REQUIRE_LINUX_ARM64_ATTESTATION: "0"
          NORSCODE_REQUIRE_WINDOWS_ATTESTATION: "1"
          NORSCODE_SOURCE_COMMIT: ${{ github.sha }}
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64

  elf-selfcompile:
    name: ELF stage-0 kandidat (Linux x86_64)
    needs: native-linux-build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Kompilator- og kodegenereringsverktøy på fersk sjølv-hosta stage0 (fast-modus).
      NORSCODE_VM_FAST: "1"
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: norscode-native-linux
          path: .
      - name: Gjenopprett runtime-modus gjennom Norscode
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - name: "Gen0 (kjelde) -> Gen1 -> Gen2 -> Gen3: fikspunkt Gen2 == Gen3"
        env:
          NC_OM6B_RUN_STAGE0: "1"
          NORSCODE_GEN1_SOURCE_JOBS: "1"
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_VM_CI_COMMAND: "./bin/nc selfcompile-stage0-elf"
        run: ./bin/nc selfcompile-stage0-elf
      - name: Last opp Gen0-, Gen2- og Gen3-fragment (diagnose)
        # J2: det finst ingen committa fragment å regenerere. Gen0 blir generert frå
        # kjelde med seeden ([0/5]) og porten krev Gen2 == Gen3. Artefaktet er berre
        # diagnose når fikspunktet divergerer.
        if: always() && hashFiles('build/6b/fragments_gen0/*.functions.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: norscode-linux-x86_64-source-only-fragments
          path: |
            build/6b/fragments_gen0/*.functions.json
            build/6b/selfcompile/source_only/fragments_inner/*.functions.json
            build/6b/selfcompile/source_only_gen3/fragments_inner/*.functions.json
            build/6b/selfcompile/source_only_gen2.ncb.json
            build/6b/selfcompile/gen2.ncb.json
            build/6b/selfcompile/gen3.ncb.json
          if-no-files-found: warn
          retention-days: 3
      - name: Last opp stage-0 kandidat (fikspunkt Gen2 == Gen3) og Gen1 ELF
        if: always() && hashFiles('build/6b/selfcompile/gen1_compiler.elf') != ''
        uses: actions/upload-artifact@v6
        with:
          name: norscode-linux-x86_64-elf-candidate
          path: |
            build/6b/selfcompile/gen2_compiler.elf
            build/6b/selfcompile/gen3_compiler.elf
            build/6b/selfcompile/gen1_compiler.elf
          retention-days: 7
      - name: Last opp source-executor-diagnose
        if: always() && hashFiles('build/6b/selfcompile/gen1_source_executor.elf') != ''
        uses: actions/upload-artifact@v6
        with:
          name: norscode-linux-x86_64-source-executor-diagnose
          path: |
            build/6b/selfcompile/gen1_source_executor.ncb.json
            build/6b/selfcompile/gen1_source_executor.elf
            build/6b/selfcompile/gen1_source_executor.elf.symbols
            build/6b/selfcompile/source_only/ncb/*.progress
            build/6b/selfcompile/source_only/ncb/executor-lexer_m1.ncb.json
            build/6b/selfcompile/source_only/ncb/executor-lexer_m1.ncb.json.elf
            build/6b/selfcompile/source_only/ncb/executor-lexer_m1.ncb.json.elf.symbols
          if-no-files-found: warn
          retention-days: 3
      - name: Last opp Gen1 ELF logg
        if: always() && hashFiles('build/6b/selfcompile/gen1_elf_bundle.log') != ''
        uses: actions/upload-artifact@v6
        with:
          name: norscode-linux-x86_64-elf-log
          path: |
            build/6b/selfcompile/gen1_elf_bundle.log
            build/6b/selfcompile/gen1_elf_attempts.txt
            build/6b/selfcompile/gen1_elf_preset.log
            build/6b/selfcompile/gen2_elf_source.log
            build/6b/selfcompile/gen1_elf_source_ncb.log
            build/6b/selfcompile/gen1_elf_chunked_source_ncb.log
          retention-days: 7
      - name: Last opp Gen1 ELF diagnose
        if: always() && hashFiles('build/6b/selfcompile/gen1_elf_diagnose.txt') != ''
        uses: actions/upload-artifact@v6
        with:
          name: norscode-linux-x86_64-elf-diagnose
          path: build/6b/selfcompile/gen1_elf_diagnose.txt
          retention-days: 7

  format-lint-check:
    name: Format og Lint (Python-fri)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - name: Materialiser native runtime
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - name: Verifiser stage-0 seed
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc verify-seed"
        run: ./bin/nc verify-seed
      # 2026-09-24 (H11): lint-stega var `continue-on-error: true`, men alle tre gav
      # «OK … (0 funn)» på fersk Linux-seed (run 36014918036). No obligatoriske, så ein
      # ny lint-regresjon blir raud i staden for å gå stille gjennom.
      - name: Lint lexer
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc lint selfhost/lexer/lexer_m1.no --check"
        run: ./bin/nc lint selfhost/lexer/lexer_m1.no --check
      - name: Lint parser
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc lint selfhost/parser.no --check"
        run: ./bin/nc lint selfhost/parser.no --check
      - name: Lint kompiler
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc lint selfhost/kompiler.no --check"
        run: ./bin/nc lint selfhost/kompiler.no --check
