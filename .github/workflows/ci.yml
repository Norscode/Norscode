          NC_SKIP_HEAVY_COMPILE: "1"
          NC_TEST_PROGRESS_FILE: ${{ github.workspace }}/build/nc-test-progress-shard-${{ matrix.shard }}.log
          NORSCODE_VM_CI_STEP_TIMEOUT_MS: "13200000"
          NORSCODE_VM_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write
          # 16 GB-runner: cap 10 GiB (var 12) — ein enkelt compile som spring forbi
          # 16 GB drap runneren (exit 143) trass i 12 GB-cap. 10 GiB gjev meir
          # headroom under runner-taket medan legitime ~8.8 GB-compile framleis passerer.
          NC_TEST_MEMORY_BYTES: "10737418240"
        run: |
