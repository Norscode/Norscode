            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-*', 'tools/compile_with_hybrid_bundle_v9400.no') }}-slow-
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-*', 'tools/compile_with_hybrid_bundle_v9400.no') }}-rask-
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-*', 'tools/compile_with_hybrid_bundle_v9400.no') }}-
