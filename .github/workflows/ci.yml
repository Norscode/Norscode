name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  NORSCODE_CMD: run
  NORSCODE_FILE: tools/ci_shell_runner.no
  NORSCODE_ROOT: ${{ github.workspace }}
  NORSCODE_ENABLE_EXEC_PROSESS: "1"
  NORSCODE_VM_CAPABILITIES: env.read,process.exec,disk.read,disk.write
  NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GITHUB_TOKEN: ${{ github.token }}
  NC_CI: "1"
  TEST_TIMEOUT: "120"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:

  phase0-verify:
    name: Fase 0-verifikasjon
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v4
      - name: Materialiser native runtime
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - name: Kontroller app-syntaks
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc check app.no"
        run: ./bin/nc check app.no
      - env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/selfhost_phase0_verify.no"
        run: ./bin/nc run tools/selfhost_phase0_verify.no
      - env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/no_legacy_cvm.no"
        run: ./bin/nc run tools/no_legacy_cvm.no

  drift-guard:
    name: Driftsvakt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v4
      - name: Materialiser native runtime
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - env:
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/selfhost_drift_guard.no"
        run: ./bin/nc run tools/selfhost_drift_guard.no

  differential:
    name: Differensial-sele (AOT vs tolk)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v4
      - name: Materialiser native runtime
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - name: Differensial diff_smoke (tolk == AOT)
        env:
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_DIFF_FILE: tools/fixtures/diff_smoke.no
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/differensial_sele.no"
        run: ./bin/nc run tools/differensial_sele.no

  seed-only:
    name: Seed-only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v4
      - name: Materialiser native runtime
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc verify-seed"
        run: ./bin/nc verify-seed

  # ─── macOS: bygg → artefakt → verify (test får eiga 120 min) ─────────────────
  native-macos-build:
    name: Build macOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-macos-arm64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - name: Materialiser native frå stage-0 seed
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-macos-arm64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-macos-arm64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-macos-arm64"
        run: ./bootstrap/stage0/norscode-macos-arm64
      - name: Verifiser stage-0 seed
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc verify-seed"
        run: ./bin/nc verify-seed
      - uses: actions/upload-artifact@v4
        with:
          name: norscode-native-macos
          path: |
            dist/norscode_native
            bin/nc
          retention-days: 1

  native-macos:
    name: Native macOS (arm64)
    needs: native-macos-build
    runs-on: macos-latest
    env:
      NORSCODE_CI_SYSTEM: macOS
      NORSCODE_CI_ARCH: arm64
      NORSCODE_ROOT: ${{ github.workspace }}
      NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write,net.dns,net.connect,net.tcp
      NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
      TMPDIR: /tmp
      NC_TRACE_TESTS: "1"
      TEST_TIMEOUT: "60"
    timeout-minutes: 300
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-macos-arm64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: norscode-native-macos
          path: .
      - name: Gjenopprett runtime-modus gjennom Norscode
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-macos-arm64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-macos-arm64"
        run: ./bootstrap/stage0/norscode-macos-arm64
      - env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc selfhost-bootstrap-gate"
        run: ./bin/nc selfhost-bootstrap-gate
      - name: "Steg C: Bootstrap-self (pure VM)"
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc bootstrap-self"
        run: ./bin/nc bootstrap-self
      - name: Install VM loader fixtures
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/install_vm_loader_fixtures.no"
        run: ./bin/nc run tools/install_vm_loader_fixtures.no
      - name: Gjenopprett test-compile-cache (innhaldsadressert NCB-cache; sparar ~40 s hybrid-compile per test på seed-dist)
        uses: actions/cache/restore@v4
        with:
          path: build/nc-test-cache
          key: nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-*', 'tools/compile_with_hybrid_bundle_v9400.no') }}-${{ github.run_id }}
          restore-keys: |
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-*', 'tools/compile_with_hybrid_bundle_v9400.no') }}-rask-
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-*', 'tools/compile_with_hybrid_bundle_v9400.no') }}-slow-
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-*', 'tools/compile_with_hybrid_bundle_v9400.no') }}-
      - name: "Test (rask CI): 4 deterministiske parallelle shards"
        timeout-minutes: 165
        env:
          NC_PARALLEL_TEST_SHARDS: "4"
          # 6000->9000 s (100->150 min) BERRE macOS-fast (Linux-fast held 6000): 2026-09-06
          # kaldstart-hump — 3/4 shards traff 99-min-taket kaldt; cache-nøkkel-fiksen (e184484)
          # lagrar no ein finn-bar -rask-cache, men fyrste kalde run må fullføre for å varme han.
          NC_PARALLEL_TEST_TIMEOUT: "9000"
          NC_PARALLEL_TEST_MIN_TOTAL: "100"
          TEST_TIMEOUT: "25"
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/nc_test_parallel.no"
        run: ./bin/nc run tools/nc_test_parallel.no
      # 2026-09-04: den raske lana GJENOPPRETTA cachen men lagra han aldri (berre slow-lana
      # hadde save) → kvar køyring rekompilerte alle testar frå ei ~6 MB gammal cache → 4 shards
      # × 4800 s timeout på macOS. Lagra alltid (òg ved timeout) med eigen nøkkel-suffiks så
      # slow-lana sin save (same run_id) ikkje kolliderer.
      - name: Lagra test-compile-cache (rask lane; òg ved feil/timeout — neste køyring startar varm)
        if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: build/nc-test-cache
          key: nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-*', 'tools/compile_with_hybrid_bundle_v9400.no') }}-rask-${{ github.run_id }}
      - name: "Media runtime gate"
        # 2026-09-06: 15 testar × kandidat-run; Linux 5,7 min, lokal macOS 3,5 min, men
        # CI-macOS-runneren (3–4× tregare, rett etter 4 test-shards) traff 15-min-taket.
        timeout-minutes: 40
        env:
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_MEDIA_RUNTIME_BIN: ${{ github.workspace }}/dist/norscode_native
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/native_media_runtime_gate_v3010.no"
        run: ./bin/nc run tools/native_media_runtime_gate_v3010.no
      - name: "Omgang 6 smoke: skriv"
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc verify-omgang6 skriv"
        run: ./bin/nc verify-omgang6 skriv
      - name: "Omgang 6 smoke: int-to-str"
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc verify-omgang6 int"
        run: ./bin/nc verify-omgang6 int
      - name: "Omgang 6b: Stage-0 ELF"
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc verify-omgang6b"
        run: ./bin/nc verify-omgang6b

  macos-runtime-attestation:
    name: macOS runtime attestasjon (arm64)
    needs: native-macos-build
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-macos-arm64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: norscode-native-macos
          path: .
      - name: Gjenopprett køyrbar artefaktmodus
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-macos-arm64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-macos-arm64"
        run: ./bootstrap/stage0/norscode-macos-arm64
      - name: Bygg single-binary macOS-kandidat i Norscode
        env:
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./dist/norscode_native
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/build_macos_attestation_candidate.no
          NORSCODE_NATIVE_BIN: ${{ github.workspace }}/dist/norscode_native
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./dist/norscode_native"
        run: ./dist/norscode_native
      - name: Kjør ekte macOS runtime-attestasjon
        env:
          RUNNER_ARCH: ${{ runner.arch }}
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./build/norscode_native_macos_attested
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/macos_runtime_attestation.no
          NORSCODE_NATIVE_BIN: ${{ github.workspace }}/build/norscode_native_macos_attested
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write,net.tcp,net.tls
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./build/norscode_native_macos_attested"
        run: ./build/norscode_native_macos_attested
      - name: Signer macOS runtime-attestasjon
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: reports/macos-runtime-attestation.json
      - name: Verifiser samla macOS-plattformreadiness
        env:
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./build/norscode_native_macos_attested
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/platform_readiness_v3600.no
          NORSCODE_NATIVE_BIN: ${{ github.workspace }}/build/norscode_native_macos_attested
          NORSCODE_MACOS_CANDIDATE: ${{ github.workspace }}/build/norscode_native_macos_attested
          NORSCODE_MACOS_ATTESTATION: ${{ github.workspace }}/reports/macos-runtime-attestation.json
          NORSCODE_REQUIRE_MACOS_ATTESTATION: "1"
          NORSCODE_SOURCE_COMMIT: ${{ github.sha }}
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./build/norscode_native_macos_attested"
        run: ./build/norscode_native_macos_attested
      - name: Last opp macOS attestasjon
        uses: actions/upload-artifact@v4
        with:
          name: norscode-macos-runtime-attestation
          path: |
            build/norscode_native_macos_attested
            reports/macos-runtime-attestation.json
          if-no-files-found: error
          retention-days: 3

  native-macos-slow:
    name: Slow tests macOS (chunk/selfhost) shard ${{ matrix.shard }}
    needs: native-macos-build
    runs-on: macos-latest
    # 2026-09-06: éin 7 GB-macOS-runner brukte 300 min på heile suiten og drukna i
    # forlatne compile-prosessar. Spreier dei deterministiske shardane (indeks
    # 2026-09-07: nc_test.no DIREKTE per shard (NC_TEST_SHARD/SHARDS=4) over fire runnarar;
    # compile-cache-spor (-s<k>-).
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      NORSCODE_CI_SYSTEM: macOS
      NORSCODE_CI_ARCH: arm64
      NORSCODE_ROOT: ${{ github.workspace }}
      NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write,net.dns,net.connect,net.tcp
      NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
      TMPDIR: /tmp
    timeout-minutes: 240
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-macos-arm64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: norscode-native-macos
          path: .
      - name: Gjenopprett runtime-modus gjennom Norscode
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-macos-arm64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-macos-arm64"
        run: ./bootstrap/stage0/norscode-macos-arm64
      - name: Gjenopprett test-compile-cache (innhaldsadressert NCB-cache; sparar ~40 s hybrid-compile per test på seed-dist)
        uses: actions/cache/restore@v4
        with:
          path: build/nc-test-cache
          key: nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-*', 'tools/compile_with_hybrid_bundle_v9400.no') }}-${{ github.run_id }}
          restore-keys: |
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-*', 'tools/compile_with_hybrid_bundle_v9400.no') }}-slow-s${{ matrix.shard }}-
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-*', 'tools/compile_with_hybrid_bundle_v9400.no') }}-slow-
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-*', 'tools/compile_with_hybrid_bundle_v9400.no') }}-rask-
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-*', 'tools/compile_with_hybrid_bundle_v9400.no') }}-
      - name: Komplett testsuite (direkte nc_test.no per shard, live progress)
        shell: bash
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NC_CI: "1"
          TMPDIR: /tmp
          NC_TEST_ALL: "1"
          NC_SLOW_TESTS: "1"
          SLOW_TEST_TIMEOUT: "1200"
          TEST_TIMEOUT: "600"
          # 2 shards (var 4): 16 GB-runneren blei drepen (exit 143) idet 4 parallelle
          # hybrid-compile (~8.8 GB kvar) starta. Færre samtidige compile = mindre
          # minnepress. Kvar shard tek meir arbeid.
          # 2026-09-06: 190 min/shard var for lite òg med varm cache (Linux 1022/1081
          # bestått, macOS 729/1081 ved taket; +100–180 testar per køyring etter kvart
          # som compile-cachen veks). 300 min (job 350 av GitHub-maks 360) let lanen
          # fullføre og lagre ein komplett cache i éi køyring.
          # 2026-09-06: 3 shardar spreidde over 3 runnarar (matrix). Kvar jobb køyrer
          # ~1/3 av suiten: 200 min harness-budsjett, 220 min runner-vakt, 240 min jobb.
          # 2026-09-07: køyrer nc_test.no DIREKTE per shard (NC_TEST_SHARD/SHARDS),
          # ikkje nc_test_parallel-wrapperen. Wrapperen sin async-pipe strøymde ikkje
          # barnet sitt stdout på committed stage0 → 0 byte progresjon ved OOM. Direkte
          # + NC_TEST_PROGRESS_FILE (append per test til disk) overlever runner-død →
          # siste «START»-linje = testen som køyrde. 4 shardar (var 3) = raskare/lettare.
          NC_TEST_SHARD: "${{ matrix.shard }}"
          NC_TEST_SHARDS: "4"
          # Deferrar dei 10 tyngste hybrid-compile-testane (macho_arm64_codegen/
          # native_codegen_v2-importørar, ~10+ GB) til fersk-seed-porten; sjå er_tung_compile.
          NC_SKIP_HEAVY_COMPILE: "1"
          NC_TEST_PROGRESS_FILE: ${{ github.workspace }}/build/nc-test-progress-shard-${{ matrix.shard }}.log
          NORSCODE_VM_CI_STEP_TIMEOUT_MS: "13200000"
          NORSCODE_VM_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write
          # macOS-stage0 sin async-backend respekterer environment-kartet → testbarn
          # via async-ABI med SIGKILL ved timeout (forlatne compile-prosessar).
          NC_TEST_ASYNC_SPAWN: "1"
        run: |
          set -uo pipefail
          PF="$NC_TEST_PROGRESS_FILE"
          mkdir -p "$(dirname "$PF")"; : > "$PF"
          # Live-strøym progressfila til GitHub-loggen: overlever runner-OOM (exit 143
          # drep runneren → if:always()-steg blir hoppa over; ci_shell_runner bufrar til
          # slutt). Siste [framgang] START = testen som drap runneren.
          ( tail -n +1 -F "$PF" 2>/dev/null | sed -u 's/^/[framgang] /' ) &
          TPID=$!
          NORSCODE_CMD=run NORSCODE_FILE="$GITHUB_WORKSPACE/tools/nc_test.no" ./bin/nc
          RC=$?
          sleep 2; kill "$TPID" 2>/dev/null || true
          echo "=== siste testframgang ==="; tail -40 "$PF" 2>/dev/null || true
          echo "nc_test exit=$RC"; exit $RC
      - name: "Testframgang (overlever OOM): siste START = skuldig test"
        if: always()
        shell: bash
        run: tail -60 "${{ github.workspace }}/build/nc-test-progress-shard-${{ matrix.shard }}.log" 2>/dev/null || echo "(ingen framgangsfil)"
      - name: Lagra test-compile-cache (òg ved feil/timeout — neste køyring startar varm)
        if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: build/nc-test-cache
          key: nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-*', 'tools/compile_with_hybrid_bundle_v9400.no') }}-slow-s${{ matrix.shard }}-${{ github.run_id }}

  # ─── Linux: bygg → artefakt → verify ─────────────────────────────────────────
  native-linux-build:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - name: Materialiser native frå stage-0 seed
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - name: Verifiser stage-0 seed
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc verify-seed"
        run: ./bin/nc verify-seed
      - uses: actions/upload-artifact@v4
        with:
          name: norscode-native-linux
          path: |
            dist/norscode_native
            bin/nc
          retention-days: 1

  native-linux:
    name: Native Linux (x86_64)
    needs: native-linux-build
    runs-on: ubuntu-latest
    env:
      NORSCODE_CI_SYSTEM: Linux
      NORSCODE_CI_ARCH: x86_64
      NORSCODE_ROOT: ${{ github.workspace }}
      NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write,net.dns,net.connect,net.tcp
      NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
      NORSCODE_EXPECT_EVENT_BACKEND: epoll
      NORSCODE_EXPECT_SANDBOX_BACKEND: seccomp
      NC_TRACE_TESTS: "1"
      TEST_TIMEOUT: "60"
    timeout-minutes: 300
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: norscode-native-linux
          path: .
      - name: Gjenopprett runtime-modus gjennom Norscode
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc selfhost-bootstrap-gate"
        run: ./bin/nc selfhost-bootstrap-gate
      - name: "Steg C: Bootstrap-self (pure VM)"
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc bootstrap-self"
        run: ./bin/nc bootstrap-self
      - name: Install VM loader fixtures
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/install_vm_loader_fixtures.no"
        run: ./bin/nc run tools/install_vm_loader_fixtures.no
      - name: Gjenopprett test-compile-cache (innhaldsadressert NCB-cache; sparar ~40 s hybrid-compile per test på seed-dist)
        uses: actions/cache/restore@v4
        with:
          path: build/nc-test-cache
          key: nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-*', 'tools/compile_with_hybrid_bundle_v9400.no') }}-${{ github.run_id }}
          restore-keys: |
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-*', 'tools/compile_with_hybrid_bundle_v9400.no') }}-rask-
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-*', 'tools/compile_with_hybrid_bundle_v9400.no') }}-slow-
            nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-*', 'tools/compile_with_hybrid_bundle_v9400.no') }}-
      - name: "Test (rask CI): 4 deterministiske parallelle shards"
        timeout-minutes: 115
        env:
          NC_PARALLEL_TEST_SHARDS: "4"
          # 4800->6000 s (80->100 min): macOS-fast-runneren traff 79,5 av 80 min og
          # timeout-a (passerte på ~72 min før) — marginal pga treg runner + tynn cache.
          NC_PARALLEL_TEST_TIMEOUT: "6000"
          NC_PARALLEL_TEST_MIN_TOTAL: "100"
          TEST_TIMEOUT: "25"
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/nc_test_parallel.no"
        run: ./bin/nc run tools/nc_test_parallel.no
      # 2026-09-04: den raske lana GJENOPPRETTA cachen men lagra han aldri (berre slow-lana
      # hadde save) → kvar køyring rekompilerte alle testar frå ei ~6 MB gammal cache → 4 shards
      # × 4800 s timeout på macOS. Lagra alltid (òg ved timeout) med eigen nøkkel-suffiks så
      # slow-lana sin save (same run_id) ikkje kolliderer.
      - name: Lagra test-compile-cache (rask lane; òg ved feil/timeout — neste køyring startar varm)
        if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: build/nc-test-cache
          key: nc-test-cache-${{ runner.os }}-${{ hashFiles('bootstrap/stage0/norscode-*', 'tools/compile_with_hybrid_bundle_v9400.no') }}-rask-${{ github.run_id }}
      - name: "Media runtime gate"
        # 2026-09-06: 15 testar × kandidat-run; Linux 5,7 min, lokal macOS 3,5 min, men
        # CI-macOS-runneren (3–4× tregare, rett etter 4 test-shards) traff 15-min-taket.
        timeout-minutes: 40
        env:
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_MEDIA_RUNTIME_BIN: ${{ github.workspace }}/dist/norscode_native
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/native_media_runtime_gate_v3010.no"
        run: ./bin/nc run tools/native_media_runtime_gate_v3010.no
      - env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc verify-omgang6"
        run: ./bin/nc verify-omgang6
      - name: "Omgang 6b: Stage-0 ELF"
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc verify-omgang6b"
        run: ./bin/nc verify-omgang6b

  linux-runtime-attestation:
    name: Linux runtime attestasjon (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - name: Materialiser committed Linux stage0
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - name: Bygg single-binary Linux-kandidat i Norscode
        env:
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./dist/norscode_native
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/build_linux_attestation_candidate.no
          NORSCODE_NATIVE_BIN: ${{ github.workspace }}/dist/norscode_native
          NORSCODE_LINUX_ATTESTATION_CANDIDATE: ${{ github.workspace }}/dist/norscode_native
          NORSCODE_LINUX_CANDIDATE_ALREADY_EMBEDDED: "1"
          NORSCODE_LINUX_ATTESTATION_NCB: ${{ github.workspace }}/build/linux_runtime_attestation_probe.ncb.json
          NORSCODE_LINUX_ARM64_ATTESTATION_NCB: ${{ github.workspace }}/build/linux_arm64_runtime_attestation_probe.ncb.json
          NORSCODE_LINUX_ATTESTATION_DRIVER_NCB: ${{ github.workspace }}/build/linux_runtime_attestation_driver.ncb.json
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./dist/norscode_native"
        run: ./dist/norscode_native
      - name: Kjør ekte Linux runtime-attestasjon
        env:
          RUNNER_ARCH: ${{ runner.arch }}
          NORSCODE_VM_CI_CHILD_CMD: run-ncb
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./dist/norscode_native
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/build/linux_runtime_attestation_driver.ncb.json
          NORSCODE_NATIVE_BIN: ${{ github.workspace }}/dist/norscode_native
          NORSCODE_LINUX_ATTESTATION_ARCH: x86_64
          NORSCODE_LINUX_ATTESTATION_NCB: ${{ github.workspace }}/build/linux_runtime_attestation_probe.ncb.json
          NORSCODE_LINUX_ATTESTATION_OUTPUT: ${{ github.workspace }}/reports/linux-runtime-attestation-x86_64.json
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write,net.tcp,net.tls,thread.spawn
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./dist/norscode_native"
        run: ./dist/norscode_native
      - name: Signer Linux runtime-attestasjon
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: reports/linux-runtime-attestation-x86_64.json
      - name: Last opp Linux-attestasjon
        uses: actions/upload-artifact@v4
        with:
          name: norscode-linux-x86_64-runtime-attestation
          path: |
            dist/norscode_native
            build/linux_runtime_attestation_probe.ncb.json
            build/linux_arm64_runtime_attestation_probe.ncb.json
            build/linux_runtime_attestation_driver.ncb.json
            reports/linux-runtime-attestation-x86_64.json
          if-no-files-found: error
          retention-days: 3

