          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - name: Start fastlåst Pebble og Norscode DNS/TCP-server
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write,net.dns,net.connect,net.tcp,net.tls
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/acme_pebble_ci.no"
        run: ./bin/nc run tools/acme_pebble_ci.no
      - name: Full konto-, DNS-01- og sertifikatutstedelse
        env:
          NORSCODE_ACME_DIRECTORY: https://localhost:14000/dir
          NORSCODE_ACME_CA_FILE: /tmp/pebble.minica.pem
          NORSCODE_ACME_DNS_VALUE_FILE: /tmp/norscode-acme-share/value
          NORSCODE_ACME_DNS_ACK_FILE: /tmp/norscode-acme-share/ack
          NODE_BIN: /nonexistent
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write,net.listen,net.connect,net.tcp,net.udp,net.dns,net.tls
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/acme_pebble_issuance_gate.no"
        run: ./bin/nc run tools/acme_pebble_issuance_gate.no
      - name: Stopp Pebble
        if: always()
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_ACME_CI_ACTION: cleanup
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/acme_pebble_ci.no"
        run: ./bin/nc run tools/acme_pebble_ci.no

  # Materialiser PE-kandidaten frå committed Windows-stage0 og verifiserte
  # NCB-payloadar. Ingen C-/Zig-krysskompilator er del av aktiv CI.
  windows-runtime-candidate:
    name: Windows runtime kandidat (Norscode cross-build)
    needs: native-macos-build
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-macos-arm64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: norscode-native-macos
          path: .
      - name: Gjenopprett køyrbar artefaktmodus
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-macos-arm64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-macos-arm64"
        run: ./bootstrap/stage0/norscode-macos-arm64
      - name: Bygg Windows-kandidat gjennom Norscode stage0/NCB
        env:
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./dist/norscode_native
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/build_windows_stage0_candidate.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_NATIVE_BIN: ${{ github.workspace }}/dist/norscode_native
          NORSCODE_USE_PRECOMPILED_SELFHOST: "0"
          NORSCODE_RUN_CACHE: "0"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./dist/norscode_native"
        run: ./dist/norscode_native
      - uses: actions/upload-artifact@v4
        with:
          name: norscode-windows-cross-candidate
          path: |
            build/windows/norscode_native_windows_x86_64.exe
          if-no-files-found: error
          retention-days: 3

  # Windows ABI må verifiseres i hoved-CI-en, ikkje berre ved release/tag.
  windows-runtime-cross-compile:
    name: Windows runtime ABI (x86_64)
    needs: windows-runtime-candidate
    if: ${{ true }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-windows-x86_64.exe run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v7
        with:
          name: norscode-windows-cross-candidate
          path: build/windows
      - name: Verifiser tracked Windows stage0
        env:
          NORSCODE_NATIVE_BIN: ${{ github.workspace }}/bootstrap/stage0/norscode-windows-x86_64.exe
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-windows-x86_64.exe selftest"
        run: ./bootstrap/stage0/norscode-windows-x86_64.exe selftest
      - name: Kjør og attester Windows runtime
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_NATIVE_BIN: ${{ github.workspace }}/build/windows/norscode_native_windows_x86_64.exe
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./build/windows/norscode_native_windows_x86_64.exe
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/windows_runtime_attestation.no
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./build/windows/norscode_native_windows_x86_64.exe"
        run: ./build/windows/norscode_native_windows_x86_64.exe
      - name: Signer Windows runtime-attestasjon
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: reports/windows-runtime-attestation.json
      - name: Verifiser samla Windows-plattformreadiness
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_NATIVE_BIN: ${{ github.workspace }}/build/windows/norscode_native_windows_x86_64.exe
          NORSCODE_WINDOWS_CANDIDATE: ${{ github.workspace }}/build/windows/norscode_native_windows_x86_64.exe
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./build/windows/norscode_native_windows_x86_64.exe
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/platform_readiness_v3600.no
          NORSCODE_WINDOWS_ATTESTATION: ${{ github.workspace }}/reports/windows-runtime-attestation.json
          NORSCODE_REQUIRE_WINDOWS_ATTESTATION: "1"
          NORSCODE_SOURCE_COMMIT: ${{ github.sha }}
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./build/windows/norscode_native_windows_x86_64.exe"
        run: ./build/windows/norscode_native_windows_x86_64.exe
      - name: Last opp Windows ABI-diagnose
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norscode-windows-runtime-abi
          path: |
            build/windows/norscode_native_windows_x86_64.exe
            reports/windows-runtime-attestation.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Verifiser tracked stage0 mot attestert kandidat
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./build/windows/norscode_native_windows_x86_64.exe
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/verify_identical_files.no
          NORSCODE_COMPARE_FILE_A: ${{ github.workspace }}/bootstrap/stage0/norscode-windows-x86_64.exe
          NORSCODE_COMPARE_FILE_B: ${{ github.workspace }}/build/windows/norscode_native_windows_x86_64.exe
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,disk.read
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./build/windows/norscode_native_windows_x86_64.exe"
        run: ./build/windows/norscode_native_windows_x86_64.exe

  all-platform-runtime-attestation:
    name: Samla signert plattformreadiness
    needs:
      - macos-runtime-attestation
      - linux-runtime-attestation
      - windows-runtime-cross-compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: norscode-macos-runtime-attestation
          path: build/attest/macos
      - uses: actions/download-artifact@v7
        with:
          name: norscode-linux-x86_64-runtime-attestation
          path: build/attest/linux-x86
      - uses: actions/download-artifact@v7
        with:
          name: norscode-windows-runtime-abi
          path: build/attest/windows
      - name: Verifiser alle signerte runtime-attestasjonar samla
        env:
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/platform_readiness_v3600.no
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_NATIVE_BIN: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_MACOS_CANDIDATE: ${{ github.workspace }}/build/attest/macos/build/norscode_native_macos_attested
          NORSCODE_MACOS_ATTESTATION: ${{ github.workspace }}/build/attest/macos/reports/macos-runtime-attestation.json
          NORSCODE_LINUX_CANDIDATE: ${{ github.workspace }}/build/attest/linux-x86/dist/norscode_native
          NORSCODE_LINUX_X86_64_ATTESTATION: ${{ github.workspace }}/build/attest/linux-x86/reports/linux-runtime-attestation-x86_64.json
          NORSCODE_WINDOWS_CANDIDATE: ${{ github.workspace }}/build/attest/windows/build/windows/norscode_native_windows_x86_64.exe
          NORSCODE_WINDOWS_ATTESTATION: ${{ github.workspace }}/build/attest/windows/reports/windows-runtime-attestation.json
          NORSCODE_REQUIRE_MACOS_ATTESTATION: "1"
          NORSCODE_REQUIRE_LINUX_ATTESTATION: "1"
          # ARM64: C.5 fjerna C-arkivet, og den einaste vegen til ein current-ABI
          # ARM64-runtime gjekk gjennom gcc + build/v3009/native_candidate_gc.c.
          # Rein Norscode har enno ingen AArch64 full-host runtime (berre x86-64 har
          # NcVal-runtime i native_codegen_v2.no), so ARM64-attestasjon er reelt
          # BLOKKERT til B2/C.2 landar. Rapporten held fram med å seie
          # production_ready_linux_arm64=false — vi maskerer ingenting, vi krev det
          # berre ikkje som port medan det er umogleg.
          NORSCODE_REQUIRE_LINUX_ARM64_ATTESTATION: "0"
          NORSCODE_REQUIRE_WINDOWS_ATTESTATION: "1"
          NORSCODE_SOURCE_COMMIT: ${{ github.sha }}
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64

  elf-selfcompile:
    name: ELF stage-0 kandidat (Linux x86_64)
    needs: native-linux-build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: norscode-native-linux
          path: .
      - name: Gjenopprett runtime-modus gjennom Norscode
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - name: "Gen1 ELF -> source-only Gen2 ELF byte-paritet"
        env:
          NC_OM6B_RUN_STAGE0: "1"
          NORSCODE_GEN1_SOURCE_JOBS: "1"
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_VM_CI_COMMAND: "./bin/nc selfcompile-stage0-elf"
        run: ./bin/nc selfcompile-stage0-elf
      - name: Last opp source-only Gen2-fragment (fixpunkt-regen-kjelde for committa fragment)
        # [2/4] skriv fragment kompilerte av DAGENS toolchain (Gen1-ELF med rett JSON-
        # escaping) frå kjelde. Når fixpunktet divergerer fordi dei COMMITTA fragmenta er
        # stale, er desse den korrekte erstatninga: last ned → commit som
        # bootstrap/precompiled_fragments{,_inner} → Gen1 == Gen2.
        if: always() && hashFiles('build/6b/selfcompile/source_only/fragments/*.functions.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: norscode-linux-x86_64-source-only-fragments
          path: |
            build/6b/selfcompile/source_only/fragments/*.functions.json
            build/6b/selfcompile/source_only/fragments_inner/*.functions.json
            build/6b/selfcompile/source_only_gen2.ncb.json
            build/6b/selfcompile/gen2.ncb.json
          if-no-files-found: warn
          retention-days: 3
      - name: Last opp Gen1 ELF som stage-0 kandidat
        if: always() && hashFiles('build/6b/selfcompile/gen1_compiler.elf') != ''
        uses: actions/upload-artifact@v6
        with:
          name: norscode-linux-x86_64-elf-candidate
          path: build/6b/selfcompile/gen1_compiler.elf
          retention-days: 7
      - name: Last opp source-executor-diagnose
        if: always() && hashFiles('build/6b/selfcompile/gen1_source_executor.elf') != ''
        uses: actions/upload-artifact@v6
        with:
          name: norscode-linux-x86_64-source-executor-diagnose
          path: |
            build/6b/selfcompile/gen1_source_executor.ncb.json
            build/6b/selfcompile/gen1_source_executor.elf
            build/6b/selfcompile/gen1_source_executor.elf.symbols
            build/6b/selfcompile/source_only/ncb/*.progress
            build/6b/selfcompile/source_only/ncb/executor-lexer_m1.ncb.json
            build/6b/selfcompile/source_only/ncb/executor-lexer_m1.ncb.json.elf
            build/6b/selfcompile/source_only/ncb/executor-lexer_m1.ncb.json.elf.symbols
          if-no-files-found: warn
          retention-days: 3
      - name: Last opp Gen1 ELF logg
        if: always() && hashFiles('build/6b/selfcompile/gen1_elf_bundle.log') != ''
        uses: actions/upload-artifact@v6
        with:
          name: norscode-linux-x86_64-elf-log
          path: |
            build/6b/selfcompile/gen1_elf_bundle.log
            build/6b/selfcompile/gen1_elf_attempts.txt
            build/6b/selfcompile/gen1_elf_preset.log
            build/6b/selfcompile/gen1_elf_source_ncb.log
            build/6b/selfcompile/gen1_elf_chunked_source_ncb.log
          retention-days: 7
      - name: Last opp Gen1 ELF diagnose
        if: always() && hashFiles('build/6b/selfcompile/gen1_elf_diagnose.txt') != ''
        uses: actions/upload-artifact@v6
        with:
          name: norscode-linux-x86_64-elf-diagnose
          path: build/6b/selfcompile/gen1_elf_diagnose.txt
          retention-days: 7

  format-lint-check:
    name: Format og Lint (Python-fri)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - name: Materialiser native runtime
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - name: Verifiser stage-0 seed
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc verify-seed"
        run: ./bin/nc verify-seed
      - name: Lint lexer
        continue-on-error: true
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc lint selfhost/lexer/lexer_m1.no --check"
        run: ./bin/nc lint selfhost/lexer/lexer_m1.no --check
      - name: Lint parser
        continue-on-error: true
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc lint selfhost/parser.no --check"
        run: ./bin/nc lint selfhost/parser.no --check
      - name: Lint kompiler
        continue-on-error: true
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc lint selfhost/kompiler.no --check"
        run: ./bin/nc lint selfhost/kompiler.no --check
