name: B2 Seed Direct (x86_64)

on:
  workflow_dispatch:
  push:
    branches: [selvstendig-fra-179]
    paths:
      - selfhost/native_execution/native_codegen_v2.no
      - selfhost/nc_main.no
      - tools/build_x86_seed.no
      - .github/workflows/b2-seed-direct.yml

env:
  NORSCODE_CMD: run
  NORSCODE_FILE: tools/ci_shell_runner.no
  NORSCODE_ROOT: ${{ github.workspace }}
  NORSCODE_ENABLE_EXEC_PROSESS: "1"
  NORSCODE_VM_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write,jit.execute
  NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp

permissions:
  contents: read

jobs:
  build-seed:
    name: Direkte nc_main native seed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6

      - name: Materialiser runtime gjennom committed stage0
        env:
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64

      # Driver spawnar to subprosessar med EKSPLISITT miljø (omgår
      # ci_shell_runner-whitelista): (1) dist compile nc_main → NCB, (2) dist
      # run native_codegen_v2 (INTERPRETERT → ingen self-boot-segfault) → ELF.
      - name: Bygg full nc_main native seed (driver)
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/build_x86_seed.no"
        run: ./bin/nc run tools/build_x86_seed.no

      - name: "Verifiser seed (diagnose — basiskommandoar + gdb-backtrace)"
        shell: bash
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write,jit.execute
          NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp
        run: |
          set +e
          SEED=./build/nc_main_seed.elf
          file "$SEED"
          chmod +x "$SEED"
          echo "===== TRACE help (siste VMCALL før krasj) ====="
          NC_VM_TRACE_CALLS=1 "$SEED" help > /tmp/trace.out 2>&1
          echo "--- NCBDIAG ---"; cat /tmp/ncbdiag.txt 2>/dev/null || echo "(ingen ncbdiag)"
          echo "TRACE_EXIT=$?"
          echo "--- siste 8 VMCALL ---"; grep "VMCALL:" /tmp/trace.out | tail -8
          echo "--- siste 8 linjer totalt ---"; tail -8 /tmp/trace.out
          echo "===== help ====="
          "$SEED" help
          echo "HELP_EXIT=$?"
          echo "===== version ====="
          "$SEED" version
          echo "VERSION_EXIT=$?"
          echo "===== run-ncb-pure exit-42 ====="
          printf 'funksjon start() -> heiltall { returner 42 }\n' > /tmp/tiny42.no
          ./dist/norscode_native compile /tmp/tiny42.no /tmp/tiny42.ncb.json
          "$SEED" run-ncb-pure /tmp/tiny42.ncb.json
          echo "RUNNCBPURE_EXIT=$?"
          echo "===== selftest ====="
          "$SEED" selftest
          echo "SELFTEST_EXIT=$?"
          echo "===== gdb backtrace ====="
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb
          gdb -q -batch -ex "run selftest" -ex "info registers rdi rbp rsp" -ex "echo \n==PROLOG 0x49f166==\n" -ex "x/40i 0x49f166" -ex "echo \n==LOCALS==\n" -ex "x/8gx \$rbp-0x40" -ex "echo \n==ARGS above rbp==\n" -ex "x/6gx \$rbp" "$SEED" 2>&1 | tail -80
          echo "===== symbol-oppslag for krasj-adresser ====="
          SYM="$SEED.symbols"
          ls -la "$SYM" || true
          for A in 4200896 4846267; do
            echo "--- addr $A (0x$(printf '%x' $A)) ---"
            awk -F'\t' -v a=$A '$1<=a && a<$2 {print "  FN: "$3" ["$1","$2")"}' "$SYM" | head -3
            # nærmaste funksjon under adressa som fallback
            awk -F'\t' -v a=$A '$1<=a {print $1"\t"$3}' "$SYM" | sort -n | tail -1 | sed 's/^/  nearest<=: /'
          done
          echo "diagnose ferdig"

      # 2026-09-06: BEVIS-STEG før seed-promotering. Den ferske seeden (GC v5: aligna blokker,
      # kanon-cache PÅ i GC-modus, alle rå streng-allokatorar via fri-lista, port ∝ live-tal)
      # må køyre den vanlege test-harnessen på eit representativt subset — kompile-steget
      # (hybrid-bundle) OG køyresteget går gjennom NC_NATIVE = fersk seed. Fyrst når dette er
      # grønt i CI (native x86-64, ikkje emulert) kan bootstrap/stage0/norscode-linux-x86_64
      # promoterast. Lokalt (Docker-emulert): std/zip.no 13 s / 285 MB-topp mot committed
      # seed 19 s / 181 MB rein bump; selfhost/vm.no committed 60 s.
      - name: "BEVIS: harness-subset på fersk seed (NC_NATIVE=build/nc_main_seed.elf)"
        # DIAGNOSTISK til seeden beviser seg (som litmus-diagnostikkstega): rapporterer i loggen,
        # blokkerer ikkje PR-en. Flipp til gating (fjern continue-on-error) når steget er grønt.
        # 2026-09-06 (v5c): vm.no → exit 199 (GC-heap full) nativt etter 2,3 s — legacy RT_JOIN
        # var kvadratisk i GC-modus; v5d slår på lineær join.
        continue-on-error: true
        shell: bash
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CAPABILITIES: env.read,env.write,process.exec,thread.spawn,net.tcp,net.dns,disk.read,disk.write,jit.execute
          NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NC_CI: "1"
          NC_TEST_ALL: "1"
          NC_SLOW_TESTS: "1"
          NC_TEST_CACHE: "0"
          NC_TRACE_TESTS: "1"
          TEST_TIMEOUT: "600"
          SLOW_TEST_TIMEOUT: "1200"
          NC_TEST_MEMORY_BYTES: "12884901888"
        run: |
          set -e
          SEED=./build/nc_main_seed.elf
          chmod +x "$SEED"
          echo "=== kompileringstid fersk seed vs committed (selfhost/vm.no) ==="
          set +e
          /usr/bin/time -f "fersk:     %e s  maxrss=%M KB" env NORSCODE_CMD=compile NORSCODE_FILE=$PWD/selfhost/vm.no NORSCODE_OUTPUT=/tmp/vm_fresh.ncb.json "$SEED" >/dev/null
          FRESH_RC=$?
          if [ "$FRESH_RC" -ne 0 ]; then
            echo "=== fersk seed feila (rc=$FRESH_RC) → gdb-krasjfangst (nativ ptrace) ==="
            sudo apt-get update -qq && sudo apt-get install -y -qq gdb >/dev/null
            env NORSCODE_CMD=compile NORSCODE_FILE=$PWD/selfhost/vm.no NORSCODE_OUTPUT=/tmp/vm_fresh2.ncb.json \
              gdb -q -batch -ex run -ex "info registers rip rax rbx rcx rdx rsi rdi rbp rsp r8 r9 r10 r11 r12 r13 r14 r15" -ex "x/14i \$rip-28" -ex "x/10gx \$rsp" "$SEED" 2>&1 | tail -60
            SYM="$SEED.symbols"; [ -f "$SYM" ] && echo "(symbolkart: $SYM — start<TAB>slutt<TAB>namn; slå opp rip der)"
            exit "$FRESH_RC"
          fi
          set -e
          /usr/bin/time -f "committed: %e s  maxrss=%M KB" env NORSCODE_CMD=compile NORSCODE_FILE=$PWD/selfhost/vm.no NORSCODE_OUTPUT=/tmp/vm_seed.ncb.json ./bootstrap/stage0/norscode-linux-x86_64 >/dev/null
          ls -la /tmp/vm_fresh.ncb.json /tmp/vm_seed.ncb.json
          echo "=== harness-subset (compile+run via fersk seed) ==="
          printf '%s\n' tests/test_liste_unik.no tests/test_ncb_bin_edgecases.no tests/test_ncb_serde_dualformat.no tests/test_unntakstypar.no tests/test_json_array.no tests/test_json_typed.no tests/test_json_skriv_raw_bool.no tests/test_native_module_globals_codegen.no tests/test_tarfile_pure.no tests/test_zip_stored_pure.no > /tmp/subset.txt
          # berre dei som finst (namn kan avvike mellom greiner)
          : > /tmp/subset_ok.txt; while read t; do [ -f "$t" ] && echo "$t" >> /tmp/subset_ok.txt; done < /tmp/subset.txt
          echo "testar: $(wc -l < /tmp/subset_ok.txt)"
          NC_NATIVE="$SEED" NC_TEST_FILES="$(cat /tmp/subset_ok.txt)" NORSCODE_CMD=run NORSCODE_FILE=tools/nc_test.no "$SEED"
      - name: Last opp native seed-kandidat
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nc_main_x86_64_seed
          path: |
            build/nc_main_seed.elf
            build/nc_main_seed.elf.symbols
          if-no-files-found: warn
          retention-days: 7
