name: B2 Seed Direct (x86_64)

on:
  workflow_dispatch:

env:
  NORSCODE_CMD: run
  NORSCODE_FILE: tools/ci_shell_runner.no
  NORSCODE_ROOT: ${{ github.workspace }}
  NORSCODE_ENABLE_EXEC_PROSESS: "1"
  NORSCODE_VM_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write,jit.execute
  NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp

permissions:
  contents: read

jobs:
  build-seed:
    name: Direkte nc_main native seed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6

      - name: Materialiser runtime gjennom committed stage0
        env:
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64

      # Bygg heile nc_main direkte med den committa codegen (dist) — INGEN
      # fersk-codegen-self-boot (v3604-probe SIGSEGV-ar på native_codegen_v2
      # sine rt_hex-blobar). Committa codegen byggjer alt kompilator-bundlen i
      # ELF stage-0-porten, så han handterer store program.
      - name: Bygg full nc_main native seed (direkte)
        env:
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write,jit.execute
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bin/nc bygg-native --target linux-x86_64 selfhost/nc_main.no build/nc_main_x86_64_seed.elf"
        run: ./bin/nc bygg-native --target linux-x86_64 selfhost/nc_main.no build/nc_main_x86_64_seed.elf

      - name: Verifiser seed (raw ELF, selftest + run-ncb-pure)
        shell: bash
        run: |
          set -x
          file build/nc_main_x86_64_seed.elf || exit 1
          chmod +x build/nc_main_x86_64_seed.elf
          # selftest
          ./build/nc_main_x86_64_seed.elf selftest; echo "SELFTEST_EXIT=$?"
          # run-ncb-pure på ein triviell exit-42 NCB
          printf 'funksjon start() -> heiltall { returner 42 }\n' > /tmp/tiny42.no
          ./dist/norscode_native compile /tmp/tiny42.no /tmp/tiny42.ncb.json || true
          ./build/nc_main_x86_64_seed.elf run-ncb-pure /tmp/tiny42.ncb.json; echo "RUNNCBPURE_EXIT=$?"

      - name: Last opp native seed-kandidat
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nc_main_x86_64_seed
          path: build/nc_main_x86_64_seed.elf
          if-no-files-found: warn
          retention-days: 7
