name: GC-litmus (Fase 3)

# Non-gating diagnostikk-loop for Fase 3 (AOT-GC). Byggjer eit 10k-hmac
# self-hosted native ELF (native_codegen_v2) og køyrer det. Fram til GC-en er
# implementert KRASJAR litmusen (SIGSEGV) — det er den forventa veggen. Steget er
# continue-on-error, så workflowen HELD SEG GRØN (dette er diagnostikk, ikkje ein
# regresjon), og status blir rapportert i job-samandraget. Når GC landar og
# litmusen gjev exit 0, viser samandraget grønt. Ligg i eiga workflow så det
# aldri påverkar Selvstendighet-porten.

on:
  push:
    branches:
      - selvstendig-fra-179
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gc-litmus:
    name: "GC-litmus 10k-hmac (Fase 3 diagnostikk)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Materialiser stage-0 seed
        run: ./bin/nc verify-seed
      - name: "GC F1-probe (råminne-primitiv — GATING, må vere grøn)"
        run: sh tools/gc_f1_probe_run.sh
      - name: "Bygg + køyr GC-litmus (reproduserer veggen)"
        id: litmus
        continue-on-error: true
        run: sh tools/gc_litmus_run.sh
      - name: "Rapporter litmus-status (samandrag)"
        run: |
          if [ "${{ steps.litmus.outcome }}" = "success" ]; then
            echo "## 🟢 GC-litmus BESTÅTT — AOT-heapen toler 10k hmac (Fase 3-GC verkar)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 🔴 GC-litmus: veggen står (SIGSEGV på 10k hmac) — venta til Fase 3-GC landar" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Bump-allokator utan reclaim sprenger 2 GB-heapen. Mål: hand-emittert mark-sweep-GC (docs/05-development/AOT_GC_DESIGN.md)." >> "$GITHUB_STEP_SUMMARY"
          fi
