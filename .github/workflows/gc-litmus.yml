name: GC-litmus (Fase 3)

# Non-gating Fase-3-diagnostikk (AOT-GC). Byggjer GC-probar (F1 primitiv, F2
# obj_addr/layout, …) og 10k-hmac-litmusen til self-hosted native ELF-ar via
# native_codegen_v2 og køyrer dei. Under GC-utvikling KRASJAR nokre av desse med
# vilje (SIGSEGV) — det er raud→grøn-mål, ikkje regresjon. Alle steg er
# continue-on-error så workflowen HELD SEG GRØN; status per probe/litmus blir
# rapportert i job-samandraget. Ligg i eiga workflow så det aldri påverkar
# Selvstendighet-porten.

on:
  push:
    branches:
      - selvstendig-fra-179
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gc-litmus:
    name: "GC-probar + litmus (Fase 3 diagnostikk)"
    runs-on: ubuntu-latest
    # ~30 probar + 2 litmusar, kvar byggjer ein ELF via ncb-to-elf (self-hosta AOT) på
    # stage0-seeden — heile suiten tek >20 min på ubuntu-latest (traff 20m18s-taket).
    timeout-minutes: 50
    # ncb-to-elf (self-hosta AOT) treng ein køyrbar native runtime. FØR lente oppsettet
    # seg på at `./bin/nc verify-seed` materialiserte dist/norscode_native som sideeffekt,
    # men main (#182) skreiv verify_seed_only.no shellfri → han rører ALDRI dist meir.
    # Peik difor NORSCODE_NATIVE_BIN rett på den committa Linux-stage0-seeden (jobben
    # køyrer alltid på ubuntu x86_64), så ncb_to_elf.no finn runtime utan plattform-
    # deteksjon/materialisering.
    env:
      NORSCODE_NATIVE_BIN: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64
    steps:
      - uses: actions/checkout@v6
      - name: Materialiser native runtime (bin/nc er symlink → dist/norscode_native)
        # bin/nc er (som på main) ein symlink til dist/norscode_native, som ikkje finst i
        # eit reint checkout. Materialiser den committa Linux-stage0-seeden med rein cp
        # FØR fyrste ./bin/nc (same mønster som ci.yml sine "Materialiser"-steg).
        run: |
          set -e
          mkdir -p dist
          cp bootstrap/stage0/norscode-linux-x86_64 dist/norscode_native
          chmod +x dist/norscode_native
      - name: Verifiser stage-0 seed (isolert, rører ikkje dist)
        run: ./bin/nc verify-seed
      - name: "GC F1-probe (råminne-primitiv)"
        id: f1
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_f1_probe.no F1
      - name: "GC F2-probe (obj_addr + objekt-layout)"
        id: f2
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_f2_probe.no F2
      - name: "GC F3-probe (stakk-rot-skann)"
        id: f3
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_f3_probe.no F3
      - name: "GC trace-probe (graf-traversering: liste→element)"
        id: trace
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_f4_trace_probe.no TRACE
      - name: "GC reclaim-probe (gc_alloc/gc_free fri-liste)"
        id: reclaim
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_reclaim_probe.no RECLAIM
      - name: "GC reclaim-LOOP-probe (5000 alloc/free → avgrensa minne)"
        id: reclaimloop
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_reclaim_loop_probe.no RECLAIMLOOP
      - name: "GC mark-probe (allokeringsfri mark-bitmap)"
        id: mark
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_mark_probe.no MARK
      - name: "GC mark-native-probe (allokeringsfri maskinkode-DFS)"
        id: marknat
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_mark_native_probe.no MARKNAT
      - name: "GC sweep-native-probe (allokeringsfri maskinkode-sweep)"
        id: sweepnat
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_sweep_native_probe.no SWEEPNAT
      - name: "GC mark-traverse-probe (DFS graf-mark)"
        id: mtrav
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_mark_traverse_probe.no MTRAV
      - name: "GC sweep-probe (live-map → gc_free hol)"
        id: sweep
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_sweep_probe.no SWEEP
      - name: "GC gc_collect-probe (mark+sweep ende-til-ende)"
        id: collect
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_collect_probe.no COLLECT
      - name: "GC gc_collect-NATIVE-probe (maskinkode mark+sweep samla)"
        id: collectnat
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_collect_native_probe.no COLLECTNAT
      - name: "GC gc_box_int-probe (iii: fri-liste-støtta int-boksar)"
        id: boxint
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_box_int_probe.no BOXINT
      - name: "GC gc_alloc16-probe (iii: register-trygg rå 16B-allokator)"
        id: alloc16
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_alloc16_probe.no ALLOC16
      - name: "GC (iii) aritmetikk MED fri-liste-boksing (NORSCODE_GC_ALLOC=1)"
        id: arithgc
        continue-on-error: true
        env:
          NORSCODE_GC_ALLOC: "1"
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_alloc_arith_probe.no ARITHGC
      - name: "GC (iv) bitmap-clear-probe (nullstill mark-bitmap)"
        id: bmclear
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_bitmap_clear_probe.no BMCLEAR
      - name: "GC (iv) sort-livemap-probe (insertion-sort etter adresse)"
        id: sortlm
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_sort_livemap_probe.no SORTLM
      - name: "GC (iv) sweep-full-probe (indre hol + hale)"
        id: sweepfull
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_sweep_full_probe.no SWEEPFULL
      - name: "GC (iv) mark-roots-probe (konservativ stakk-rot-skann)"
        id: markroots
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_mark_roots_probe.no MARKROOTS
      - name: "GC (iv) gc_collect_native-probe (mark-roots+sort+sweep samla)"
        id: collectfull
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_collect_native_full_probe.no COLLECTFULL
      - name: "GC (iv) ENDE-TIL-ENDE collect (NORSCODE_GC_ALLOC=1, 8M iter)"
        id: e2e
        continue-on-error: true
        env:
          NORSCODE_GC_ALLOC: "1"
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_collect_e2e_probe.no E2E
      - name: "GC (iv) DEBUG collect (NORSCODE_GC_ALLOC=1, 1500 iter, markørar)"
        id: dbg
        continue-on-error: true
        env:
          NORSCODE_GC_ALLOC: "1"
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_collect_dbg_probe.no DBG
      - name: "GC hmac_n flagg PÅ (200 hmac med collect — korrektheit)"
        id: hmnon
        continue-on-error: true
        env:
          NORSCODE_GC_ALLOC: "1"
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/hmac_n.no HMNON
      - name: "GC hmac-korrektheit flagg PÅ (300 hmac == kanon mac[0]/mac[31])"
        id: hmcorr
        continue-on-error: true
        env:
          NORSCODE_GC_ALLOC: "1"
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_correct_probe.no CORR
      - name: "GC map flagg PÅ (type 4 overlever collect)"
        id: gcmap
        continue-on-error: true
        env:
          NORSCODE_GC_ALLOC: "1"
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_map_probe.no MAP
      - name: "GC map grown flagg PÅ (40 streng-entries, grow+collect)"
        id: gcmap2
        continue-on-error: true
        env:
          NORSCODE_GC_ALLOC: "1"
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_map2_probe.no MAP2
      - name: "GC nøsta+rekursjon flagg PÅ (liste-av-map, map-av-liste, bool)"
        id: gcnest
        continue-on-error: true
        env:
          NORSCODE_GC_ALLOC: "1"
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_nested_probe.no NEST
      - name: "Codegen: unnatak prøv/fang/kast flagg PÅ (kryssfunksjon, 400 kast fanga)"
        id: exc1
        continue-on-error: true
        env:
          NORSCODE_GC_ALLOC: "1"
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_feat_probe.no FEAT
      - name: "Codegen: nøsta try + unntaksverdi + rethrow flagg PÅ"
        id: exc2
        continue-on-error: true
        env:
          NORSCODE_GC_ALLOC: "1"
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_exc_probe.no EXC
      - name: "Integrasjon: mini-uttrykkstolk (rekursjon+map+unnatak) flagg PÅ"
        id: mini
        continue-on-error: true
        env:
          NORSCODE_GC_ALLOC: "1"
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_mini_probe.no MINI
      - name: "Codegen: json_stringify list/map flagg PÅ (nøsta NCB-like)"
        id: jstr
        continue-on-error: true
        env:
          NORSCODE_GC_ALLOC: "1"
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_jstr2_probe.no JS2
      - name: "Codegen: json_parse_raw + round-trip flagg PÅ"
        id: jparse
        continue-on-error: true
        env:
          NORSCODE_GC_ALLOC: "1"
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_jp_probe.no JP
      - name: "Codegen: slice(liste)+legg_til flagg PÅ (type-dispatch)"
        id: slice
        continue-on-error: true
        env:
          NORSCODE_GC_ALLOC: "1"
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_slice_probe.no SL
      - name: "Codegen: tekst(heiltall) → desimal (regresjonsvakt)"
        id: tekst
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_tekst_probe.no TEKST
      - name: "Codegen: json_stringify escapar \\ \" LF TAB (regresjonsvakt — frosen rutine droppa bakstrek)"
        id: jsonesc
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_jsonesc_probe.no JSONESC
      - name: "Codegen: bakstrek-konstant round-trip (sjølvkalibrert escape-dekoding; ikkje dobbeltdekod)"
        id: bsconst
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_bs_probe.no BS
      - name: "Codegen: streng + heiltall/null-konkat konverterer (var segfault @0x4010ab i fersk seed)"
        id: concat
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_concat_probe.no CONCAT
      - name: "Codegen: builtin.system_info nativt (uname/getcwd/readlink → map; var null → SIGSEGV)"
        id: sysinfo
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_sysinfo_probe.no SYSINFO
      - name: "Codegen: liste-indeks utanfor grensene → fangbart unntak (RT_FEIL krasja)"
        id: index
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_index_probe.no INDEX
      - name: "Codegen: vent.sov søv faktisk (nanosleep #35; seed var no-op)"
        id: sov
        continue-on-error: true
        run: sh archive/legacy_shell/tools/gc_probe_run.sh tests/fixtures/gc_sov_probe.no SOV
      - name: "GC-litmus 10k-hmac UTAN GC (baseline — SIGSEGV er VENTA, demonstrerer veggen)"
        id: litmus
        run: |
          rc=0
          sh archive/legacy_shell/tools/gc_litmus_run.sh || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::warning::baseline utan GC BESTOD (uventa) — bump-heapen sprakk ikkje denne gongen"
          elif [ "$rc" -ge 128 ]; then
            echo "✓ VENTA: baseline utan GC krasja (exit=$rc, SIGSEGV) — bump-allokatoren sprengde heapen. Dette ER Fase-3-veggen; flagg-PÅ-steget under skal vere grønt."
          else
            echo "::error::baseline gav uventa exit=$rc (ikkje 0, ikkje signal)"; exit "$rc"
          fi
      # GATING: dette steget LÅSER Fase 3. Ingen continue-on-error → CI FEILAR om GC-en
      # regrederer (self-hosta mark-sweep må halde 10k hmac innan avgrensa minne).
      - name: "GC-litmus 10k-hmac MED GC (NORSCODE_GC_ALLOC=1) — DEN STORE (gating)"
        id: litmusgc
        env:
          NORSCODE_GC_ALLOC: "1"
        run: sh archive/legacy_shell/tools/gc_litmus_run.sh
      - name: "Rapporter Fase-3-status (samandrag)"
        if: always()
        run: |
          emoji() { [ "$1" = "success" ] && echo "🟢" || echo "🔴"; }
          {
            echo "## Fase 3 GC-diagnostikk"
            echo ""
            echo "| Steg | Status |"
            echo "| --- | --- |"
            echo "| F1 råminne-primitiv (raw_load64/store64/heap_bump) | $(emoji '${{ steps.f1.outcome }}') ${{ steps.f1.outcome }} |"
            echo "| F2 obj_addr + objekt-layout | $(emoji '${{ steps.f2.outcome }}') ${{ steps.f2.outcome }} |"
            echo "| F3 stakk-rot-skann | $(emoji '${{ steps.f3.outcome }}') ${{ steps.f3.outcome }} |"
            echo "| Trace: graf-traversering (liste→element) | $(emoji '${{ steps.trace.outcome }}') ${{ steps.trace.outcome }} |"
            echo "| Reclaim: gc_alloc/gc_free fri-liste | $(emoji '${{ steps.reclaim.outcome }}') ${{ steps.reclaim.outcome }} |"
            echo "| Reclaim-LOOP: 5000 alloc/free → avgrensa minne | $(emoji '${{ steps.reclaimloop.outcome }}') ${{ steps.reclaimloop.outcome }} |"
            echo "| Mark: allokeringsfri mark-bitmap | $(emoji '${{ steps.mark.outcome }}') ${{ steps.mark.outcome }} |"
            echo "| Mark-native: allokeringsfri maskinkode-DFS | $(emoji '${{ steps.marknat.outcome }}') ${{ steps.marknat.outcome }} |"
            echo "| Sweep-native: allokeringsfri maskinkode-sweep | $(emoji '${{ steps.sweepnat.outcome }}') ${{ steps.sweepnat.outcome }} |"
            echo "| Mark-traverse: DFS graf-mark | $(emoji '${{ steps.mtrav.outcome }}') ${{ steps.mtrav.outcome }} |"
            echo "| Sweep: live-map → gc_free hol | $(emoji '${{ steps.sweep.outcome }}') ${{ steps.sweep.outcome }} |"
            echo "| gc_collect: mark+sweep ende-til-ende | $(emoji '${{ steps.collect.outcome }}') ${{ steps.collect.outcome }} |"
            echo "| gc_collect-NATIVE: maskinkode mark+sweep samla | $(emoji '${{ steps.collectnat.outcome }}') ${{ steps.collectnat.outcome }} |"
            echo "| gc_box_int (iii): fri-liste-støtta int-boksar | $(emoji '${{ steps.boxint.outcome }}') ${{ steps.boxint.outcome }} |"
            echo "| gc_alloc16 (iii): register-trygg rå 16B-allokator | $(emoji '${{ steps.alloc16.outcome }}') ${{ steps.alloc16.outcome }} |"
            echo "| (iii) aritmetikk m/fri-liste-boksing (flagg PÅ, hex-patch) | $(emoji '${{ steps.arithgc.outcome }}') ${{ steps.arithgc.outcome }} |"
            echo "| (iv) bitmap-clear: nullstill mark-bitmap | $(emoji '${{ steps.bmclear.outcome }}') ${{ steps.bmclear.outcome }} |"
            echo "| (iv) sort-livemap: insertion-sort etter adresse | $(emoji '${{ steps.sortlm.outcome }}') ${{ steps.sortlm.outcome }} |"
            echo "| (iv) sweep-full: indre hol + hale | $(emoji '${{ steps.sweepfull.outcome }}') ${{ steps.sweepfull.outcome }} |"
            echo "| (iv) mark-roots: konservativ stakk-rot-skann | $(emoji '${{ steps.markroots.outcome }}') ${{ steps.markroots.outcome }} |"
            echo "| (iv) gc_collect_native: mark-roots+sort+sweep samla | $(emoji '${{ steps.collectfull.outcome }}') ${{ steps.collectfull.outcome }} |"
            echo "| (iv) ENDE-TIL-ENDE: collect haustar 8M-iter garbage (flagg PÅ) | $(emoji '${{ steps.e2e.outcome }}') ${{ steps.e2e.outcome }} |"
            echo "| hmac_n 200 hmac med collect (flagg PÅ) | $(emoji '${{ steps.hmnon.outcome }}') ${{ steps.hmnon.outcome }} |"
            echo "| hmac-korrektheit: 300 hmac == kanon (flagg PÅ) | $(emoji '${{ steps.hmcorr.outcome }}') ${{ steps.hmcorr.outcome }} |"
            echo "| GC map (type 4) overlever collect | $(emoji '${{ steps.gcmap.outcome }}') ${{ steps.gcmap.outcome }} |"
            echo "| GC map grown (40 streng-entries) | $(emoji '${{ steps.gcmap2.outcome }}') ${{ steps.gcmap2.outcome }} |"
            echo "| GC nøsta+rekursjon (liste/map/bool) | $(emoji '${{ steps.gcnest.outcome }}') ${{ steps.gcnest.outcome }} |"
            echo "| codegen: unnatak prøv/fang/kast (kryssfunksjon) | $(emoji '${{ steps.exc1.outcome }}') ${{ steps.exc1.outcome }} |"
            echo "| codegen: nøsta try + rethrow + unntaksverdi | $(emoji '${{ steps.exc2.outcome }}') ${{ steps.exc2.outcome }} |"
            echo "| integrasjon: mini-uttrykkstolk (rekursjon+map+unnatak) | $(emoji '${{ steps.mini.outcome }}') ${{ steps.mini.outcome }} |"
            echo "| codegen: json_stringify list/map (nøsta NCB-like) | $(emoji '${{ steps.jstr.outcome }}') ${{ steps.jstr.outcome }} |"
            echo "| codegen: json_parse_raw + round-trip | $(emoji '${{ steps.jparse.outcome }}') ${{ steps.jparse.outcome }} |"
            echo "| codegen: slice(liste)+legg_til (type-dispatch) | $(emoji '${{ steps.slice.outcome }}') ${{ steps.slice.outcome }} |"
            echo "| codegen: tekst(heiltall) → desimal | $(emoji '${{ steps.tekst.outcome }}') ${{ steps.tekst.outcome }} |"
            echo "| codegen: JSON-escaping (bakstrek/quote/LF) i json_stringify | $(emoji '${{ steps.jsonesc.outcome }}') ${{ steps.jsonesc.outcome }} |"
            echo "| codegen: bakstrek-konstant round-trip (sjølvkalibrert dekoding) | $(emoji '${{ steps.bsconst.outcome }}') ${{ steps.bsconst.outcome }} |"
            echo "| codegen: vent.sov søv faktisk (nanosleep #35) | $(emoji '${{ steps.sov.outcome }}') ${{ steps.sov.outcome }} |"
            echo "| codegen: streng+heiltall/null-konkat (to_text før RT_CONCAT) | $(emoji '${{ steps.concat.outcome }}') ${{ steps.concat.outcome }} |"
            echo "| codegen: builtin.system_info nativt (uname/getcwd/readlink) | $(emoji '${{ steps.sysinfo.outcome }}') ${{ steps.sysinfo.outcome }} |"
            echo "| codegen: liste-indeks utanfor → fangbart «Indeks utanfor: N» | $(emoji '${{ steps.index.outcome }}') ${{ steps.index.outcome }} |"
            echo "| 10k-hmac baseline UTAN GC (SIGSEGV venta = veggen, svelgd→grøn) | $(emoji '${{ steps.litmus.outcome }}') ${{ steps.litmus.outcome }} |"
            echo "| **10k-hmac litmus MED GC (flagg PÅ) — DEN STORE (GATING)** | $(emoji '${{ steps.litmusgc.outcome }}') ${{ steps.litmusgc.outcome }} |"
            echo ""
            echo "**Fase 3 LANDA:** self-hosta mark-sweep-GC held 10k hmac innan avgrensa minne (exit 0), 300 hmac == kanon mac, paritet flagg AV urørt. Flagg-PÅ-steget er GATING. Verifisert på ekte native Linux x86-64 i CI (docs/05-development/AOT_GC_DESIGN.md)."
          } >> "$GITHUB_STEP_SUMMARY"
