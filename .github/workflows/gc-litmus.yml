name: GC-litmus (Fase 3)

# Non-gating diagnostikk-loop for Fase 3 (AOT-GC). Byggjer eit 10k-hmac
# self-hosted native ELF (native_codegen_v2) og køyrer det. Fram til GC-en
# er implementert KRASJAR dette (SIGSEGV) — det er den RAUDE baselinen / veggen.
# Ligg i EIGA workflow så det aldri påverkar den grøne Selvstendighet-porten.
# Fase 3-mål: gjer denne jobben grøn.

on:
  push:
    branches:
      - selvstendig-fra-179
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gc-litmus:
    name: "GC-litmus 10k-hmac (raud til GC landar)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Materialiser stage-0 seed
        run: ./bin/nc verify-seed
      - name: "Bygg + køyr GC-litmus (reproduserer veggen)"
        run: sh tools/gc_litmus_run.sh
