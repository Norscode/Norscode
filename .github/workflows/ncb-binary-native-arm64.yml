name: Binær-NCB → native ARM64 (dual-format)

# Verifiserer heile JSON→binær-NCB-migreringa NATIVT: eit testprogram blir
# kompilert til NCB, konvertert til det deterministiske BINÆRformatet
# (magic 0x93 'N' 'C' 'B' + serde.serialiser), og bygd til ARM64 ELF via
# codegen-en sin dual-format-lesar (macho_arm64_codegen.les_ncb_fil →
# serde.deserialiser). Både binær- OG JSON-vegen skal gje exit 42 — det viser
# at lesaren les binært OG at JSON framleis fungerer (bakoverkompat).
#
# Køyrer i CI av same grunn som hmac-workflowen: den tolka codegen-lasten
# OOM-ar på 16 GB-Mac, men GitHub-runnaren har nok minne.

on:
  workflow_dispatch:
  push:
    branches:
      - b2-independence
    paths:
      - selfhost/ncb_bin.no
      - selfhost/ncb_serde.no
      - selfhost/native_execution/macho_arm64_codegen.no
      - selfhost/native_execution/elf_arm64_codegen.no
      - tools/build_native_from_ncb.no
      - tools/ncb_to_binary.no
      - tools/fixtures/ncb_binary_roundtrip_arm64.no
      - .github/workflows/ncb-binary-native-arm64.yml

permissions:
  contents: read

jobs:
  build-arm64:
    name: Bygg binær- + JSON-NCB → ARM64 ELF
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Materialiser x86-runtime (seed)
        shell: bash
        run: |
          set -e
          mkdir -p dist build
          cp bootstrap/stage0/norscode-linux-x86_64 dist/norscode_native
          chmod +x dist/norscode_native
          ./dist/norscode_native version || true

      - name: Kompiler testprogram → JSON-NCB (seed)
        shell: bash
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CAPABILITIES: env.read,disk.read,disk.write
          NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp
        run: |
          set -e
          NORSCODE_CMD=compile NORSCODE_FILE=tools/fixtures/ncb_binary_roundtrip_arm64.no \
            NORSCODE_OUTPUT=build/rt.ncb.json ./dist/norscode_native
          ls -la build/rt.ncb.json

      - name: Konverter JSON-NCB → binær-NCB (frå kjelde)
        shell: bash
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CAPABILITIES: env.read,disk.read,disk.write
          NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp
        run: |
          set -e
          NORSCODE_CMD=run NORSCODE_FILE=tools/ncb_to_binary.no \
            IN_NCB=build/rt.ncb.json OUT_NCB=build/rt.ncbin ./dist/norscode_native
          ls -la build/rt.ncbin
          # magic-header-sjekk: 0x93 0x4e 0x43 0x42 ('NCB')
          hdr=$(head -c 4 build/rt.ncbin | od -An -tx1 | tr -d ' \n')
          echo "magic=$hdr"
          if [ "$hdr" != "934e4342" ]; then echo "❌ feil magic: $hdr"; exit 1; fi
          echo "✅ binær-NCB har rett magic-header"

      - name: Bygg BINÆR-NCB → ARM64 ELF (dual-format-lesar)
        shell: bash
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CAPABILITIES: env.read,disk.read,disk.write
          NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp
        run: |
          set -e
          NORSCODE_CMD=run NORSCODE_FILE=tools/build_native_from_ncb.no \
            IN_NCB=build/rt.ncbin OUT_ELF=build/rt_from_bin.elf ./dist/norscode_native
          file build/rt_from_bin.elf

      - name: Bygg JSON-NCB → ARM64 ELF (regresjon: JSON framleis)
        shell: bash
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CAPABILITIES: env.read,disk.read,disk.write
          NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp
        run: |
          set -e
          NORSCODE_CMD=run NORSCODE_FILE=tools/build_native_from_ncb.no \
            IN_NCB=build/rt.ncb.json OUT_ELF=build/rt_from_json.elf ./dist/norscode_native
          file build/rt_from_json.elf

      - name: Last opp ELF-ar
        uses: actions/upload-artifact@v4
        with:
          name: ncb-binary-roundtrip-elfs
          path: |
            build/rt_from_bin.elf
            build/rt_from_json.elf
          if-no-files-found: error
          retention-days: 7

  verify-arm64:
    name: Køyr begge ELF nativt (arm-runnar) — exit 42
    needs: build-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ncb-binary-roundtrip-elfs
          path: elfs

      - name: Verifiser exit 42 for binær- og JSON-vegen
        shell: bash
        run: |
          set +e
          fail=0
          for tag in bin json; do
            E="elfs/rt_from_$tag.elf"
            echo "===== rt_from_$tag ====="
            file "$E"; chmod +x "$E"
            "$E"; ec=$?
            echo "rt_from_$tag EXIT=$ec  (42 = rett)"
            if [ "$ec" != "42" ]; then
              echo "❌ FEIL: rt_from_$tag forventa exit 42, fekk $ec"
              fail=1
            else
              echo "✅ rt_from_$tag OK"
            fi
          done
          exit $fail
