name: Linux App Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

env:
  NORSCODE_CMD: run
  NORSCODE_FILE: tools/ci_shell_runner.no
  NORSCODE_ROOT: ${{ github.workspace }}
  NORSCODE_ENABLE_EXEC_PROSESS: "1"
  NORSCODE_VM_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write
  NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: linux-app-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-linux-app:
    name: Build Linux app artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Materialiser runtime gjennom committed stage0
        env:
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64

      - name: C/Python-gate
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc feature-check app.no"
        run: ./bin/nc feature-check app.no

      - name: Verifiser stage-0 seed
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc verify-seed"
        run: ./bin/nc verify-seed

      - name: Bygg native runtime
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/build_norscode_native.no"
        run: ./bin/nc run tools/build_norscode_native.no

      # Bygg fersk full-host frå levande .no-importgraf gjennom native NCB→ELF.
      # Kandidaten blir verifisert og lasta opp, men committed stage0 blir ikkje
      # endra av workflowen.
      - name: Bygg Linux Norscode full-host-kandidat
        timeout-minutes: 45
        env:
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./dist/norscode_native
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/build_linux_openssl_candidate_v3604.no
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./dist/norscode_native"
        run: ./dist/norscode_native

      - name: Aktiver verifiseringskandidat i dist
        env:
          NORSCODE_CI_FILE_SOURCE: build/v3600/linux/norscode_native_linux_x86_64_v3603_openssl
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64

      - name: Attester binær filesystem-straum
        env:
          NORSCODE_REQUIRE_BINARY_FILESYSTEM_LIVE: "1"
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./dist/norscode_native
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tests/test_native_filesystem_binary_stream.no
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./dist/norscode_native"
        run: ./dist/norscode_native

      - name: Attester Norscode TAR GZIP-straum
        env:
          NORSCODE_REQUIRE_BINARY_FILESYSTEM_LIVE: "1"
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./dist/norscode_native
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tests/test_release_tar_gzip_binary_stream.no
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./dist/norscode_native"
        run: ./dist/norscode_native

      - name: Bygg Linux app artifacts
        env:
          NORSCODE_LINUX_PACKAGE_FORMAT: all
          NORSCODE_REQUIRE_BINARY_ARCHIVE_STREAM: "1"
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/package-linux-app.no"
        run: ./bin/nc run tools/package-linux-app.no

      - name: Last opp Linux app artifacts
        uses: actions/upload-artifact@v6
        with:
          name: norscode-linux-app-artifacts
          path: |
            release-artifacts/Norscode-linux-*-AppDir.tar.gz
            release-artifacts/Norscode-linux-*-AppDir.tar.gz.sha256
            build/v3600/linux/norscode_native_linux_x86_64_v3603_openssl
          if-no-files-found: warn
          retention-days: 7

  github-release:
    name: GitHub Release (Linux app)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-linux-app]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Last ned Linux app artifacts
        uses: actions/download-artifact@v7
        with:
          name: norscode-linux-app-artifacts
          path: release-assets/

      - name: Publiser Linux app artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          append_body: true
          body: |

            ## Linux app

            Denne releasen inneheld no Linux app-artefakt:

            - `Norscode-linux-<versjon>-AppDir.tar.gz`
            AppImage er ikkje ein skjult normalavhengigheit. Han kan byggjast
            separat gjennom det eksplisitte `appimage-adapter`-valet.

            Installasjon og oppgradering er dokumentert i `docs/LINUX_APP_RELEASE.md` og `docs/LINUX_APP_INSTALL.md`.
