name: Selfhost Lexer Token Smoke

# Køyrer selfhost bootstrap gate når selfhost-lekseren eller tilhøyrande
# filer endrar seg. Brukar bin/nc — ingen Python eller C-kompilator trengs.

on:
  push:
    paths:
      - 'selfhost/lexer/**'
      - 'selfhost/parser.no'
      - 'selfhost/compiler/**'
      - 'selfhost/bootstrap_gate.no'
      - '.github/workflows/selfhost-lexer-token-smoke.yml'
  pull_request:
    paths:
      - 'selfhost/lexer/**'
      - 'selfhost/parser.no'
      - 'selfhost/compiler/**'
      - 'selfhost/bootstrap_gate.no'
      - '.github/workflows/selfhost-lexer-token-smoke.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: lexer-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  token-smoke:
    name: Selfhost lexer parity-røyktest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Bygg norscode_native
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_CMD: run
          NORSCODE_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp
        run: ./bootstrap/stage0/norscode-linux-x86_64

      - name: Verifiser stage-0 seed
        run: ./bin/nc verify-seed

      - name: Selfhost bootstrap gate
        run: ./bin/nc selfhost-bootstrap-gate

      - name: Røyk-test selfhost/nc_main.no
        env:
          NORSCODE_VM_CAPABILITIES: env.read,disk.read,disk.write
          NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
        run: ./bin/nc test tests/test_nc_main_smoke.no
