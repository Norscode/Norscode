name: Selvstendighet

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: selvstendighet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify-linux:
    name: Verifiser streng selvstendighet (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
      - name: Materialiser runtime gjennom committed stage0
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_CMD: run
          NORSCODE_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - run: ./bin/nc feature-check app.no
      - name: Verifiser stage-0 seed
        run: ./bin/nc verify-seed
      - run: ./bin/nc selvstendighet --strict
  elf-selfcompile:
    name: ELF stage-0 kandidat (Linux x86_64)
    needs: verify-linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Materialiser runtime gjennom committed stage0
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_CMD: run
          NORSCODE_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - name: Verifiser stage-0 seed
        run: ./bin/nc verify-seed
      - name: "Hard gate: Gen1 ELF -> Gen2 ELF byte-paritet"
        env:
          NC_OM6B_RUN_STAGE0: "1"
        run: ./bin/nc selfcompile-stage0-elf
