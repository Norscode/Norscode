name: Selvstendighet

on:
  push:
    branches:
      - main
      - master
  pull_request:
    paths:
      - .github/workflows/selvstendighet.yml
      - tools/verify_selvstendighet.no
      - tools/build_ci_runtime_candidate.no
      - tools/selfcompile_toolchain.no
      - tools/refresh_native_codegen.no
      - bootstrap/**
      - selfhost/**
      - std/**
      - tools/**
      - tests/test_selfcompile_toolchain.no
      - tests/test_verify_selvstendighet_*.no
      - tests/test_native_tls_event_loop.no
      - tests/test_linux_runtime_attestation_probe.no
  workflow_dispatch:

env:
  NORSCODE_CMD: run
  NORSCODE_FILE: tools/ci_shell_runner.no
  NORSCODE_ROOT: ${{ github.workspace }}
  NORSCODE_ENABLE_EXEC_PROSESS: "1"
  NORSCODE_VM_CAPABILITIES: env.read,process.exec,disk.read,disk.write
  NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
  GITHUB_TOKEN: ${{ github.token }}
  # Fersk sjølv-hosta stage0: utan fast-modus gjekk 0b ut på 2 t (C-æra-runtimen: heile
  # porten på 11 min; lokalt 408 s med fast-modus). Verktøya får fast-modus; nc_test held
  # bokhaldet på for testar som målar det (sjå test_vm_fast i tools/nc_test.no).
  NORSCODE_VM_FAST: "1"
  NC_TEST_VM_FAST: "1"
  NORSCODE_BYTECODE_GATE: "hard"

concurrency:
  group: selvstendighet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  toolchain-fixed-point:
    name: "Heil verktøykjede frå éin seed (Linux x86_64)"
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - name: Kaldbygg codegen og runtime gjennom tre kjeldegenerasjonar
        env:
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/selfcompile_toolchain.no
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_STEP_TIMEOUT_MS: "13800000"
          NORSCODE_VM_CI_STREAM: "1"
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - name: Last opp kjeldebinding, fikspunkt og fullstendige byggloggar
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: norscode-toolchain-fixed-point-${{ github.run_id }}
          path: |
            build/toolchain-rebuild/latest.txt
            build/toolchain-rebuild/*/report.json
            build/toolchain-rebuild/*/gen*/sources.manifest
            build/toolchain-rebuild/*/gen*/*.log
            build/toolchain-rebuild/*/gen*/build/ci-runtime/build.json
            build/toolchain-rebuild/*/gen*/build/ci-runtime/*.log
          if-no-files-found: error
          retention-days: 7
  verify-linux:
    name: Verifiser streng selvstendighet (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - name: Materialiser promotert Linux stage0
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - name: Verifiser promotert Linux stage0 mot SHA256SUMS
        env:
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./dist/norscode_native
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/verify_linux_stage0.no
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,disk.read
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.
          NORSCODE_VM_CI_COMMAND: "./dist/norscode_native"
        run: ./dist/norscode_native
      - name: Køyr streng sjølvstendighetsport gjennom native dispatcher
        env:
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./dist/norscode_native
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/verify_selvstendighet.no
          NORSCODE_SELVSTENDIGHET_STRICT: "1"
          NORSCODE_NATIVE_BIN: ${{ github.workspace }}/dist/norscode_native
          NC_NATIVE: ${{ github.workspace }}/dist/norscode_native
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write,thread.spawn,net.tcp,net.http,net.dns,jit.execute
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./dist/norscode_native"
        run: ./dist/norscode_native
      - name: Last opp autoritativ L5 Gen1 for cache-diagnostikk
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: norscode-linux-l5-gen1-${{ github.run_id }}
          path: build/l5/compiler_v1.ncb.json
          if-no-files-found: warn
          retention-days: 3
      - name: Last opp kjeldebinding og byggloggar for test-runtime
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: norscode-selvstendighet-runtime-${{ github.run_id }}
          path: |
            build/ci-runtime/build.json
            build/ci-runtime/*.log
          if-no-files-found: warn
          retention-days: 3
  elf-selfcompile:
    name: "Selvstendighet: ELF stage-0 kandidat (Linux x86_64)"
    needs: verify-linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - name: Materialiser promotert Linux stage0
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - name: "Hard gate: Gen0 (kjelde) -> Gen1 -> Gen2 -> Gen3, fikspunkt Gen2 == Gen3"
        env:
          NC_OM6B_RUN_STAGE0: "1"
          NORSCODE_VM_CI_COMMAND: "./bin/nc selfcompile-stage0-elf"
        run: ./bin/nc selfcompile-stage0-elf
