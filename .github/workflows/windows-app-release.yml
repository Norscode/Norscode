name: Windows App Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows-app-release.yml
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: windows-app-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-windows-app:
    name: Build and attest the CRT-free Windows app
    uses: ./.github/workflows/windows-seed.yml

  github-release:
    name: GitHub Release (Windows app)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-windows-app
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Last ned signert Windows-pakke
        uses: actions/download-artifact@v7
        with:
          name: norscode-windows-freestanding-app
          path: release-assets/

      - name: Publiser Windows app artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          append_body: true
          body: |

            ## Windows app

            Denne releasen inneheld no Windows app-artefakt:

            - `norscode-windows-<versjon>.zip`

            Installasjon og oppgradering er dokumentert i `docs/WINDOWS_APP_RELEASE.md` og `docs/WINDOWS_APP_INSTALL.md`.
