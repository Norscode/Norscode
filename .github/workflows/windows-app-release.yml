name: Windows App Release
# Release contract: actions/attest-build-provenance@v3
# Release contract: tools/windows_runtime_attestation.no

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

env:
  NORSCODE_CMD: run
  NORSCODE_FILE: tools/ci_shell_runner.no
  NORSCODE_ROOT: ${{ github.workspace }}
  NORSCODE_ENABLE_EXEC_PROSESS: "1"
  NORSCODE_VM_CAPABILITIES: env.read,process.exec,disk.read,disk.write
  NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: windows-app-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  # J1c (PLAN F1.1): vm- og vm-executor-payloadane er ikkje committa. Generer dei frå kjelde
  # på Linux-seeden (same verktøy som i CI) og del dei med Windows-bygget som artefakt.
  runtime-payloads:
    name: Generer runtime-payloadar (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NORSCODE_VM_FAST: "1"
      NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
      NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Materialiser native frå stage-0 seed
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - name: Generer runtime-payloadar frå kjelde
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/materialize_runtime_payloads.no"
        run: ./bin/nc run tools/materialize_runtime_payloads.no
      - name: Last opp runtime-payloadane
        uses: actions/upload-artifact@v6
        with:
          name: norscode-runtime-payloads
          path: |
            bootstrap/precompiled/vm.ncb.json
            bootstrap/precompiled/vm.ncb.json.srchash
            selfhost/vm_executor.ncb.json
            selfhost/vm_executor.ncb.json.srchash
          if-no-files-found: error
          retention-days: 3

  build-windows-app:
    name: Build Windows app artifacts
    runs-on: windows-latest
    needs: [runtime-payloads]
    timeout-minutes: 20
    env:
      # J1c: payloadane kjem frå artefaktet til runtime-payloads i same køyring. C-æra-seeden
      # skal verken kjeldehashe dei (treg) eller re-generere dei (ikkje-kanonisk executor):
      # B4-porten under krev at payloadane i exe-en er nett dei genererte filene.
      NORSCODE_PAYLOADS_TRUST: "1"
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-windows-x86_64.exe run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Last ned genererte runtime-payloadar (J1c)
        uses: actions/download-artifact@v7
        with:
          name: norscode-runtime-payloads
          path: .

      - name: Bygg Windows runtime frå committed stage0 og NCB
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_NATIVE_BIN: ${{ github.workspace }}/bootstrap/stage0/norscode-windows-x86_64.exe
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-windows-x86_64.exe
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/build_windows_stage0_candidate.no
          NORSCODE_WINDOWS_CANDIDATE: ${{ github.workspace }}/build/windows/norscode_native_windows_x86_64.exe
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-windows-x86_64.exe"
        run: ./bootstrap/stage0/norscode-windows-x86_64.exe

      - name: Kjør og attester Windows runtime
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_NATIVE_BIN: ${{ github.workspace }}/build/windows/norscode_native_windows_x86_64.exe
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./build/windows/norscode_native_windows_x86_64.exe
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/windows_runtime_attestation.no
          NORSCODE_ENABLE_EXEC_PROSESS: "1"
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CI_COMMAND: "./build/windows/norscode_native_windows_x86_64.exe"
        run: ./build/windows/norscode_native_windows_x86_64.exe

      - name: Signer Windows runtime-attestasjon
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: reports/windows-runtime-attestation.json

      - name: Pakk Windows app artifacts
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_WINDOWS_PACKAGE_EXE: build/windows/norscode_native_windows_x86_64.exe
          # Den bygde og attesterte kandidaten eig pakkesteget. Fallbacken held
          # tempnamnet kompatibelt medan kandidaten brukar gjeldande rmdir-ABI.
          NORSCODE_TEMP_FORCE_FALLBACK: "1"
          NORSCODE_USE_PRECOMPILED_STDLIB: "0"
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./build/windows/norscode_native_windows_x86_64.exe
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/package-windows-app.no
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.
          NORSCODE_VM_CI_COMMAND: "./build/windows/norscode_native_windows_x86_64.exe"
        run: ./build/windows/norscode_native_windows_x86_64.exe

      # B4: den same exe-en som vart pakka går til paritetsporten (jobben windows-stage0-parity).
      # Han blir ikkje publisert sjølv; github-release krev at porten er grøn.
      - name: Last opp release-kandidaten til B4-paritetsporten
        uses: actions/upload-artifact@v6
        with:
          name: norscode-windows-release-candidate
          path: build/windows/norscode_native_windows_x86_64.exe
          if-no-files-found: error
          retention-days: 7

      - name: Last opp Windows app artifacts
        uses: actions/upload-artifact@v6
        with:
          name: norscode-windows-app-artifacts
          path: |
            release-artifacts/norscode-windows-*.zip
            release-artifacts/norscode-windows-*.zip.sha256
            reports/windows-runtime-attestation.json
          if-no-files-found: error
          retention-days: 7

  # B4 (PLAN F1.1): paritetsporten mot den exe-en som faktisk blir pakka og publisert. Han er
  # bygd på Windows-C-æra-seeden (listebru + fil_append_binary, ny kodeveg etter J1c), og
  # byggjaren sjekkar der berre forma (windows_stage0_parity=unverified). Her: PE-prefikset er
  # byte-identisk med committa stage0 (sha256), manifestforma er lik og kvar payload er den
  # genererte fila. Linux-seeden (C-æra-runtimen treng ~7 GB for listekopiane).
  windows-stage0-parity:
    name: "B4: Windows-stage0-paritet (Linux)"
    runs-on: ubuntu-latest
    needs: [build-windows-app, runtime-payloads]
    timeout-minutes: 15
    env:
      NORSCODE_VM_FAST: "1"
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Last ned release-kandidaten
        uses: actions/download-artifact@v7
        with:
          name: norscode-windows-release-candidate
          path: build/windows
      - name: Last ned genererte runtime-payloadar (J1c)
        uses: actions/download-artifact@v7
        with:
          name: norscode-runtime-payloads
          path: .
      - name: "B4: Windows-stage0-paritet (PE-prefiks + manifestform + payload == generert)"
        env:
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/verify_windows_stage0_parity.no
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_PARITY_STAGE0: ${{ github.workspace }}/bootstrap/stage0/norscode-windows-x86_64.exe
          NORSCODE_PARITY_CANDIDATE: ${{ github.workspace }}/build/windows/norscode_native_windows_x86_64.exe
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,disk.read
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64

  github-release:
    name: GitHub Release (Windows app)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # B4 må vere grøn før noko blir publisert.
    needs: [build-windows-app, windows-stage0-parity]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Last ned Windows app artifacts
        uses: actions/download-artifact@v7
        with:
          name: norscode-windows-app-artifacts
          path: release-assets/

      - name: Publiser Windows app artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          append_body: true
          body: |

            ## Windows app

            Denne releasen inneheld no Windows app-artefakt:

            - `norscode-windows-<versjon>.zip`

            Installasjon og oppgradering er dokumentert i `docs/WINDOWS_APP_RELEASE.md` og `docs/WINDOWS_APP_INSTALL.md`.
