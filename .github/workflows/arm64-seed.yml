name: ARM64 fersk seed (kryss-bygd nc_main + seed-port på ekte arm64, Linux og macOS)

# M5 (A5): Linux ARM64-nc_main frå levande kjelde med Norscode sin EIGEN AArch64-codegen
# — ingen C-kompilator, ingen Python.
#   1) kryssbygg (x86_64): materialiser full-host nc_main-NCB og køyr den pinna kryss-
#      codegen-en bootstrap/native_codegen_linux-arm64_on_linux-x86_64.elf
#      (tools/build_arm64_seed.no). Codegen-en er deterministisk: same kjelde → same bytes.
#   2) seed-gate-arm64 (ekte ubuntu-24.04-arm): kandidaten blir dist/norscode_native og
#      køyrer selftest + tools/seed_gate_tests.txt (via tools/nc_test.no) — same port som
#      den ferske Linux x86_64-seeden gjekk gjennom før promotering.
# Kandidaten er promotert til bootstrap/stage0/norscode-linux-arm64 (C-æra-seeden ligg i
# bootstrap/stage0/rollback/); porten held han grøn og reproduserbar.
# M1 (macOS): same NCB → bootstrap/native_codegen_macos-arm64_on_linux-x86_64.elf → Mach-O
# arm64 (ad hoc-signert i Norscode sin eigen Mach-O-emitter), og seed-gate-macos køyrer same
# port på ein ekte macOS-arm64-runner. Adapteren der er framleis den committa macOS-stage0-en.
on:
  workflow_dispatch:
  pull_request:
    paths:
      # Kandidaten inneheld heile runtime-lukkinga, også nye std-modular.
      - std/**
      - selfhost/native_execution/native_codegen_v2.no
      - selfhost/native_execution/heap_layout.no
      - selfhost/native_execution/macho_arm64_codegen.no
      - selfhost/native_execution/elf_arm64_codegen.no
      - selfhost/native_execution/elf_arm64_emitter.no
      - selfhost/native_execution/macho_arm64_emitter.no
      - bootstrap/native_codegen_linux-arm64_on_linux-x86_64.elf
      - bootstrap/native_codegen_macos-arm64_on_linux-x86_64.elf
      - bootstrap/stage0/norscode-linux-arm64
      - bootstrap/stage0/norscode-macos-arm64
      - std/native_gap.no
      - std/native_sys.no
      - std/runtime_filesystem_native.no
      - tools/build_arm64_seed.no
      - tools/build_ci_runtime_candidate.no
      - tools/materialize_nc_main_fullhost_candidate.no
      - tools/native_runtime_gap_gate_v3001.no
      - tests/native_runtime_gap_probe_v3001.no
      - tests/test_native_filesystem_durable.no
      - tests/test_norsdb_durable_checkpoint.no
      - tests/opplasting_mappe_gap_probe.no
      - tools/verify_identical_files.no
      - tests/test_verify_identical_files_large.no
      - std/windows_abi.no
      - std/windows_process.no
      - std/windows_network.no
      - std/windows_schannel.no
      - std/windows_filesystem.no
      - tools/ci_shell_runner.no
      - tools/differensial_sele.no
      - tests/test_ci_shell_runner.no
      - tests/test_selfhost_candidate_runtime.no
      - tests/fixtures/ci_arm64_environment_probe.no
      - tests/fixtures/ci_candidate_environment_probe.no
      - .github/workflows/arm64-seed.yml

env:
  NORSCODE_ROOT: ${{ github.workspace }}
  NORSCODE_ENABLE_EXEC_PROSESS: "1"
  NORSCODE_VM_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write
  NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NC_CI: "1"

permissions:
  contents: read

jobs:
  kryssbygg:
    name: Kryss-bygg arm64 nc_main (linux + macos, på x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - name: Materialiser native runtime (x86_64)
        env:
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64
      - name: Bygg fersk fullhost-NCB med byteverifisert L5-kompilator
        env:
          NORSCODE_VM_CI_STEP_TIMEOUT_MS: "1800000"
          NORSCODE_VM_CI_STREAM: "1"
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/build_ci_runtime_candidate.no"
        run: ./bin/nc run tools/build_ci_runtime_candidate.no
      - name: Bygg linux-arm64 nc_main frå kjelde (materialisering + kryss-codegen)
        env:
          NORSCODE_VM_CI_STEP_TIMEOUT_MS: "5400000"
          # Byte-paritet er ein eigen obligatorisk jobb. Kandidaten må få køyre
          # seed-porten på ekte ARM64 før ein ny stage0 kan promoterast.
          NORSCODE_VM_CI_STREAM: "1"
          NORSCODE_SEED_NCB: ${{ github.workspace }}/build/ci-runtime/nc_main_fullhost.ncb.json
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/build_arm64_seed.no"
        run: ./bin/nc run tools/build_arm64_seed.no
      - name: Bygg macos-arm64 nc_main frå same NCB (kryss-codegen → Mach-O)
        # Bevar diagnostikk for begge mål dersom det fyrste bygget feilar.
        if: ${{ !cancelled() }}
        env:
          NORSCODE_VM_CI_STEP_TIMEOUT_MS: "1800000"
          NC_ARM64_OS: macos
          NORSCODE_SEED_NCB: ${{ github.workspace }}/build/ci-runtime/nc_main_fullhost.ncb.json
          NORSCODE_VM_CI_STREAM: "1"
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/build_arm64_seed.no"
        run: ./bin/nc run tools/build_arm64_seed.no
      - name: Last opp kandidaten
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: norscode-linux-arm64-kandidat
          path: |
            build/arm64/nc_main_arm64
            build/arm64/nc_main_arm64.symbols
          if-no-files-found: error
          retention-days: 14
      - name: Last opp macOS-kandidaten
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: norscode-macos-arm64-kandidat
          path: build/arm64/nc_main_macos_arm64
          if-no-files-found: error
          retention-days: 14
      # Symbolkart + NCB for feilsøking på macOS (sample/krasjrapport → funksjon; lokal
      # ombygging av kandidaten med codegenen i nc_main). Ikkje del av kandidaten.
      - name: Last opp macOS-symbolkart og NCB
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: norscode-macos-arm64-feilsok
          path: |
            build/arm64/nc_main_macos_arm64.symbols
            build/ci-runtime/nc_main_fullhost.ncb.json
            build/ci-runtime/build.json
          if-no-files-found: warn
          retention-days: 7

  seed-paritet:
    name: Stage0 byte-paritet (${{ matrix.os }}-arm64)
    needs: kryssbygg
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            candidate: nc_main_arm64
          - os: macos
            candidate: nc_main_macos_arm64
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: norscode-${{ matrix.os }}-arm64-kandidat
          path: build/arm64
      # Denne porten er framleis hard: ei ulik eller manglande seed/kandidat
      # gjer heile workflowen raud. Han er ein syskenjobb til seed-testane, slik
      # at faktisk ARM64-verifisering ikkje blir sperra av ventande promotering.
      - name: Krev byte-identisk committed stage0 og kjeldebygd kandidat
        env:
          NORSCODE_COMPARE_FILE_A: ${{ github.workspace }}/bootstrap/stage0/norscode-${{ matrix.os }}-arm64
          NORSCODE_COMPARE_FILE_B: ${{ github.workspace }}/build/arm64/${{ matrix.candidate }}
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/verify_identical_files.no
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,disk.read
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64

  seed-gate-arm64:
    name: seed-gate (linux-arm64) shard ${{ matrix.shard }}
    needs: kryssbygg
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      NORSCODE_CI_SYSTEM: Linux
      NORSCODE_CI_ARCH: arm64
      NORSCODE_VM_FAST: "1"
      NC_TEST_VM_FAST: "1"
    # Adapteren (ci_shell_runner) går med den committa arm64-stage0-en, som er den promoterte
    # kandidaten (seed-paritet krev at han er byte-lik det kjelda byggjer). Den gamle
    # C-æra-seeden (no i bootstrap/stage0/rollback/) ignorerte argumenta og køyrde berre sin
    # innebygde selftest, so ein port med han som shell testa ingenting. Kommandoane går til
    # kandidaten via ./bin/nc → dist/norscode_native.
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-arm64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: norscode-linux-arm64-kandidat
          path: build/arm64
      - name: Materialiser kandidaten som native runtime
        env:
          NORSCODE_CI_FILE_SOURCE: build/arm64/nc_main_arm64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_STREAM: "1"
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-arm64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-arm64"
        run: ./bootstrap/stage0/norscode-linux-arm64
      - name: Kandidat-selftest
        env:
          NORSCODE_VM_CI_STREAM: "1"
          NORSCODE_VM_CI_COMMAND: "./bin/nc selftest"
        run: ./bin/nc selftest
      - name: Kandidatens runtime-gap-port før stage0-promotering
        env:
          NORSCODE_VM_CI_STEP_TIMEOUT_MS: "300000"
          NORSCODE_VM_CI_STREAM: "1"
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/native_runtime_gap_gate_v3001.no"
        run: ./bin/nc run tools/native_runtime_gap_gate_v3001.no
      - name: "Seed-porten: tools/seed_gate_tests.txt via nc_test.no (kandidaten)"
        env:
          NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          TMPDIR: /tmp
          NC_TEST_LIST_FILE: ${{ github.workspace }}/tools/seed_gate_tests.txt
          NC_TEST_BERRE_UTSETTE: "0"
          NC_TEST_ALL: "1"
          NC_SLOW_TESTS: "1"
          SLOW_TEST_TIMEOUT: "1200"
          TEST_TIMEOUT: "600"
          NC_TEST_SHARD: "${{ matrix.shard }}"
          NC_TEST_SHARDS: "3"
          NC_TEST_PROGRESS_FILE: ${{ github.workspace }}/build/nc-test-progress-arm64-${{ matrix.shard }}.log
          NORSCODE_VM_CI_STEP_TIMEOUT_MS: "13800000"
          NC_TEST_MEMORY_BYTES: "10737418240"
          NC_TRACE_TESTS: "1"
          NC_VERBOSE: "1"
          NORSCODE_VM_CI_STREAM: "1"
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/nc_test.no"
        run: ./bin/nc run tools/nc_test.no
      - name: Last opp testframgang
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arm64-seed-gate-progress-${{ matrix.shard }}
          path: build/nc-test-progress-arm64-${{ matrix.shard }}.log
          if-no-files-found: ignore
          retention-days: 7

  seed-gate-macos:
    name: seed-gate (macos-arm64) shard ${{ matrix.shard }}
    needs: kryssbygg
    runs-on: macos-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      NORSCODE_CI_SYSTEM: macOS
      NORSCODE_CI_ARCH: arm64
      NORSCODE_VM_FAST: "1"
      NC_TEST_VM_FAST: "1"
      TMPDIR: /tmp
    # Adapteren (ci_shell_runner) går med den committa macOS-stage0-en; kommandoane går til
    # kandidaten via ./bin/nc → dist/norscode_native (Mach-O frå kryssbygg-jobben).
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-macos-arm64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: norscode-macos-arm64-kandidat
          path: build/arm64
      - name: Materialiser kandidaten som native runtime
        env:
          NORSCODE_CI_FILE_SOURCE: build/arm64/nc_main_macos_arm64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_STREAM: "1"
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-macos-arm64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-macos-arm64"
        run: ./bootstrap/stage0/norscode-macos-arm64
      - name: Kandidat-selftest
        env:
          NORSCODE_VM_CI_STREAM: "1"
          NORSCODE_VM_CI_COMMAND: "./bin/nc selftest"
        run: ./bin/nc selftest
      - name: Kandidatens runtime-gap-port før stage0-promotering
        env:
          NORSCODE_VM_CI_STEP_TIMEOUT_MS: "300000"
          NORSCODE_VM_CI_STREAM: "1"
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/native_runtime_gap_gate_v3001.no"
        run: ./bin/nc run tools/native_runtime_gap_gate_v3001.no
      - name: "Seed-porten: tools/seed_gate_tests.txt via nc_test.no (kandidaten)"
        env:
          NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
          NC_TEST_LIST_FILE: ${{ github.workspace }}/tools/seed_gate_tests.txt
          NC_TEST_BERRE_UTSETTE: "0"
          NC_TEST_ALL: "1"
          NC_SLOW_TESTS: "1"
          SLOW_TEST_TIMEOUT: "1200"
          TEST_TIMEOUT: "600"
          NC_TEST_SHARD: "${{ matrix.shard }}"
          NC_TEST_SHARDS: "3"
          NC_TEST_PROGRESS_FILE: ${{ github.workspace }}/build/nc-test-progress-macos-${{ matrix.shard }}.log
          NORSCODE_VM_CI_STEP_TIMEOUT_MS: "13800000"
          NC_TRACE_TESTS: "1"
          NC_VERBOSE: "1"
          NORSCODE_VM_CI_STREAM: "1"
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/nc_test.no"
        run: ./bin/nc run tools/nc_test.no
      - name: Last opp testframgang
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-seed-gate-progress-${{ matrix.shard }}
          path: build/nc-test-progress-macos-${{ matrix.shard }}.log
          if-no-files-found: ignore
          retention-days: 7
