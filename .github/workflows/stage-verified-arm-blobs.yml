name: Stage verified ARM blobs for PR 276

# Avgrensa leveringsjobb paa ei eiga arbeidsgren. Kandidatane er dei eksakte
# filene som vart bygde og testa i 19ee050-runden. Denne jobben kan berre
# opprette innhaldsadresserte Git-blobs; han flyttar aldri ei grein eller tag.
# PR-en blir oppdatert separat etter kontroll av dei returnerte blob-SHA-ane.
on:
  push:
    branches:
      - fix/pr276-arm-blob-staging-20261112

permissions:
  contents: read
  actions: read

concurrency:
  group: pr276-verified-arm-blob-staging
  cancel-in-progress: false

env:
  NORSCODE_ROOT: ${{ github.workspace }}
  NORSCODE_CMD: run
  NORSCODE_FILE: tools/ci_shell_runner.no
  NORSCODE_ENABLE_EXEC_PROSESS: "1"
  NORSCODE_VM_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write
  NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NC_CI: "1"

jobs:
  build-windows-uploader:
    name: Build the Norscode Windows uploader and verify its adapter
    if: github.repository == 'Norscode/Norscode' && github.ref == 'refs/heads/fix/pr276-arm-blob-staging-20261112' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      prepared_artifact_id: ${{ steps.prepared.outputs.artifact-id }}
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - name: Check out reviewed staging sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download exact verified Linux uploader runtime
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: 13965634112
          run-id: 43267262565
          repository: Norscode/Norscode
          github-token: ${{ github.token }}
          path: build/arm-blob-stage/host

      - name: Download exact tested CRT-free Windows adapter
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: 13966821546
          run-id: 43267262557
          repository: Norscode/Norscode
          github-token: ${{ github.token }}
          path: build/arm-blob-stage/windows

      - name: Verify both downloaded hosts with committed stage0 before execution
        env:
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/verify_arm_blob_windows_inputs.no
          NORSCODE_VM_CI_STREAM: "1"
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64

      - name: Reject same-size corruption of the Windows adapter
        env:
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tests/test_verify_arm_blob_windows_inputs.no
          NORSCODE_VM_CI_STREAM: "1"
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64

      - name: Prepare the verified Linux runtime through Norscode
        env:
          NORSCODE_CI_FILE_SOURCE: build/arm-blob-stage/host/dist/norscode_native
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_VM_CI_STREAM: "1"
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64

      - name: Build the Windows uploader with source-built Norscode codegen
        env:
          NORSCODE_GC_ALLOC: "1"
          NC_BUILTIN_REPORT: "1"
          NORSCODE_VM_FAST: "1"
          NORSCODE_VM_CI_STEP_TIMEOUT_MS: "900000"
          NORSCODE_VM_CI_STREAM: "1"
          NORSCODE_VM_CI_COMMAND: "./dist/norscode_native run tools/build_arm_blob_windows_uploader.no"
        run: ./dist/norscode_native run tools/build_arm_blob_windows_uploader.no

      - name: Transfer verified adapter and source-built uploader in this run only
        id: prepared
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pr276-windows-arm-blob-uploader
          path: |
            dist/norscode_native
            build/windows/nc_main_freestanding_win.exe
            build/arm-blob-stage/stage_blobs.exe
            build/arm-blob-stage/windows-build.json
          if-no-files-found: error
          retention-days: 14

  stage-blobs:
    name: Stage verified ARM blobs through authenticated Windows SChannel
    needs: build-windows-uploader
    if: github.repository == 'Norscode/Norscode' && github.ref == 'refs/heads/fix/pr276-arm-blob-staging-20261112' && github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: ${{ github.workspace }}/build/windows/nc_main_freestanding_win.exe run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - name: Check out reviewed staging sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download the immutable prepared artifact from this run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.build-windows-uploader.outputs.prepared_artifact_id }}
          path: .

      - name: Download exact Linux ARM candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: 13966976213
          run-id: 43267262599
          repository: Norscode/Norscode
          github-token: ${{ github.token }}
          path: build/arm-blob-stage/linux

      - name: Download exact macOS ARM candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: 13966143591
          run-id: 43267262599
          repository: Norscode/Norscode
          github-token: ${{ github.token }}
          path: build/arm-blob-stage/macos

      - name: Download source-bound build report and NCB
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: 13965918843
          run-id: 43267262599
          repository: Norscode/Norscode
          github-token: ${{ github.token }}
          path: build/arm-blob-stage/report

      - name: Validate all local hashes and full-size bounded encoding without credentials
        env:
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.
          NORSCODE_VM_CI_STEP_TIMEOUT_MS: "900000"
          NORSCODE_VM_CI_STREAM: "1"
          NORSCODE_VM_CI_COMMAND: "./build/arm-blob-stage/stage_blobs.exe --dry-run"
        run: ./build/arm-blob-stage/stage_blobs.exe --dry-run

      - name: Verify unauthenticated GitHub TLS through the Windows system trust store
        env:
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,disk.read,disk.write,net.dns,net.connect,net.tcp,net.tls
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.
          NORSCODE_VM_CI_STEP_TIMEOUT_MS: "900000"
          NORSCODE_VM_CI_STREAM: "1"
          NORSCODE_VM_CI_COMMAND: "./build/arm-blob-stage/stage_blobs.exe --probe"
        run: ./build/arm-blob-stage/stage_blobs.exe --probe

      - name: Recheck provenance and seven source jobs then stage only Git blobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,disk.read,disk.write,net.dns,net.connect,net.tcp,net.tls
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.
          NORSCODE_VM_CI_STEP_TIMEOUT_MS: "1500000"
          NORSCODE_VM_CI_STREAM: "1"
          NORSCODE_VM_CI_COMMAND: "./build/arm-blob-stage/stage_blobs.exe --upload"
        run: ./build/arm-blob-stage/stage_blobs.exe --upload

      - name: Preserve returned blob identities
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pr276-verified-arm-git-blobs
          path: build/arm-blob-stage/blob-shas.json
          if-no-files-found: error
          retention-days: 14
