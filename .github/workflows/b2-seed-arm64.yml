name: B2 Seed Direct (arm64)

on:
  workflow_dispatch:
  push:
    branches:
      - b2-independence

env:
  NORSCODE_CMD: run
  NORSCODE_FILE: tools/ci_shell_runner.no
  NORSCODE_ROOT: ${{ github.workspace }}
  NORSCODE_ENABLE_EXEC_PROSESS: "1"
  NORSCODE_VM_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write,jit.execute
  NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp

permissions:
  contents: read

jobs:
  # Kryss-kompiler ARM64-seed på ein FUNKSJONELL x86-vert (arm64 stage0 er stub).
  build-arm64:
    name: Kryss-bygg arm64 nc_main seed (x86-vert)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-x86_64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6

      - name: Materialiser funksjonell x86-runtime
        env:
          NORSCODE_CI_FILE_SOURCE: bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_CI_FILE_TARGET: dist/norscode_native
          NORSCODE_VM_CI_CHILD_CMD: run
          NORSCODE_VM_CI_CHILD_EXECUTABLE: ./bootstrap/stage0/norscode-linux-x86_64
          NORSCODE_VM_CI_CHILD_FILE: ${{ github.workspace }}/tools/ci_runtime_fileops.no
          NORSCODE_VM_CI_CHILD_CAPABILITIES: env.read,process.exec,disk.read,disk.write
          NORSCODE_VM_CI_CHILD_DISK_ROOT: ${{ github.workspace }},.,/tmp
          NORSCODE_VM_CI_COMMAND: "./bootstrap/stage0/norscode-linux-x86_64"
        run: ./bootstrap/stage0/norscode-linux-x86_64

      - name: Set ARM64-mål + bygg test-NCB (exit 42)
        shell: bash
        run: |
          set -e
          mkdir -p build
          touch build/.target_arm64
          printf 'funksjon start() -> heiltall { returner 42 }\n' > /tmp/tiny42.no
          NORSCODE_CMD=compile NORSCODE_FILE=/tmp/tiny42.no NORSCODE_OUTPUT=build/tiny42.ncb.json \
            NORSCODE_ROOT="$PWD" NORSCODE_VM_CAPABILITIES=env.read,disk.read,disk.write \
            NORSCODE_VM_DISK_ROOT="$PWD,.,/tmp" ./dist/norscode_native
          ls -la build/tiny42.ncb.json

      - name: Bygg full nc_main native seed (ARM64-codegen, fiksa json_parse)
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/build_x86_seed.no"
        run: ./bin/nc run tools/build_x86_seed.no

      - name: Bekreft ARM64-ELF + last opp
        shell: bash
        run: |
          set -e
          file build/nc_main_seed.elf
          ls -la build/nc_main_seed.elf build/tiny42.ncb.json

      - name: Last opp arm64-seed + testfixtur
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nc_main_arm64_seed
          path: |
            build/nc_main_seed.elf
            build/nc_main_seed.elf.symbols
            build/tiny42.ncb.json
          if-no-files-found: warn
          retention-days: 7

  # Verifiser den ferdige ARM64-seeden NATIVT på ein arm-runnar.
  verify-arm64:
    name: Verifiser arm64-seed (native arm-runnar)
    needs: build-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: nc_main_arm64_seed
          path: seed
      - name: "Kjør selftest + run-ncb-pure=42"
        shell: bash
        run: |
          set +e
          SEED=seed/nc_main_seed.elf
          file "$SEED"; chmod +x "$SEED"
          echo "===== help ====="; "$SEED" help; echo "HELP_EXIT=$?"
          echo "===== version ====="; "$SEED" version; echo "VERSION_EXIT=$?"
          echo "===== selftest ====="; "$SEED" selftest; echo "SELFTEST_EXIT=$?"
          echo "===== run-ncb-pure exit-42 ====="; "$SEED" run-ncb-pure seed/tiny42.ncb.json; echo "RUNNCBPURE_EXIT=$?"
          echo "ferdig"
