name: B2 Seed Direct (arm64)

on:
  workflow_dispatch:
  push:
    branches:
      - b2-independence

env:
  NORSCODE_CMD: run
  NORSCODE_FILE: tools/ci_shell_runner.no
  NORSCODE_ROOT: ${{ github.workspace }}
  NORSCODE_ENABLE_EXEC_PROSESS: "1"
  NORSCODE_VM_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write,jit.execute
  NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp,/private/tmp

permissions:
  contents: read

jobs:
  build-seed-arm64:
    name: Native arm64 nc_main seed
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: ${{ github.workspace }}/bootstrap/stage0/norscode-linux-arm64 run ${{ github.workspace }}/tools/ci_shell_runner.no {0}
    steps:
      - uses: actions/checkout@v6

      - name: Materialiser runtime (rå cp — gammal arm64 stage0 støttar ikkje ci_runtime_fileops)
        shell: bash
        run: |
          set -e
          mkdir -p dist
          cp bootstrap/stage0/norscode-linux-arm64 dist/norscode_native
          chmod +x dist/norscode_native bootstrap/stage0/norscode-linux-arm64
          ls -la dist/norscode_native
          file dist/norscode_native || true

      - name: Bygg full nc_main native seed (arm64-driver, fiksa json_parse)
        env:
          NORSCODE_VM_CI_COMMAND: "./bin/nc run tools/build_x86_seed.no"
        run: ./bin/nc run tools/build_x86_seed.no

      - name: "Verifiser arm64-seed (selftest + run-ncb-pure=42)"
        shell: bash
        env:
          NORSCODE_ROOT: ${{ github.workspace }}
          NORSCODE_VM_CAPABILITIES: env.read,env.write,process.exec,disk.read,disk.write,jit.execute
          NORSCODE_VM_DISK_ROOT: ${{ github.workspace }},.,/tmp
        run: |
          set +e
          SEED=./build/nc_main_seed.elf
          file "$SEED"; chmod +x "$SEED"
          echo "===== help ====="; "$SEED" help; echo "HELP_EXIT=$?"
          echo "===== version ====="; "$SEED" version; echo "VERSION_EXIT=$?"
          echo "===== run-ncb-pure exit-42 ====="
          printf 'funksjon start() -> heiltall { returner 42 }\n' > /tmp/tiny42.no
          ./dist/norscode_native compile /tmp/tiny42.no /tmp/tiny42.ncb.json
          "$SEED" run-ncb-pure /tmp/tiny42.ncb.json; echo "RUNNCBPURE_EXIT=$?"
          echo "===== selftest ====="; "$SEED" selftest; echo "SELFTEST_EXIT=$?"
          echo "ferdig"

      - name: Last opp arm64 native seed
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nc_main_arm64_seed
          path: |
            build/nc_main_seed.elf
            build/nc_main_seed.elf.symbols
          if-no-files-found: warn
          retention-days: 7
