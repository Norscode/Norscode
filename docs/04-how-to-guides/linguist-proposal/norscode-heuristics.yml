# This is only a proposed starting point, not deployed GitHub behavior.
# Existing .no language: Text. First matching rule wins; Text stays fallback.
disambiguations:
- extensions: ['.no']
  rules:
  # Compact single-line Norscode function with inline return.
  - language: Norscode
    and:
    - pattern: '^[ \t]*funksjon[ \t]+[A-Za-z_][A-Za-z0-9_]*[ \t]*\([^\r\n)]*\)(?:[ \t]*->[ \t]*[^\r\n{}]+)?[ \t]*\{[ \t]*returner[ \t]+[^\r\n{}]+[ \t]*\}[ \t]*  - language: Norscode
    and:
    # Conservative ASCII function declaration on a code line; may be typed or untyped.
    # Unicode-only identifiers are a known false-negative, pending upstream tests.
    - pattern: '^[ \t]*funksjon[ \t]+[A-Za-z_][A-Za-z0-9_]*[ \t]*\([^\r\n)]*\)(?:[ \t]*->[ \t]*[^\r\n{}]+)?[ \t]*(?:\{|:)?[ \t]*$'
    # Return statement must start an indented code line, not prose.
    - pattern: '^[ \t]+returner[ \t]+[^\s\r\n]'
    # Recognize curly-brace functions and legacy `slutt` blocks.
    - pattern: '^[ \t]*(?:\}|slutt)[ \t]*$'
    # Avoid tagging plain .no documentation with fenced code examples.
    - negative_pattern: '^[ \t]*```'
  - language: Text

    - negative_pattern: '^[ \t]*```'
