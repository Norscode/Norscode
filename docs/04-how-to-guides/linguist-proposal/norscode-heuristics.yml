# DRAFT: merge this disambiguation into github-linguist/linguist/lib/linguist/heuristics.yml
# This is only a proposed starting point, not deployed GitHub behavior.
# Existing .no language: Text. First matching rule wins; Text stays fallback.
named_patterns: {}
disambiguations:
- extensions: ['.no']
  rules:
  # Compact single-line Norscode function with inline return.
  - language: Norscode
    and:
    - pattern: '^[ \t]*funksjon[ \t]+[A-Za-z_][A-Za-z0-9_]*[ \t]*\([^\r\n)]*\)(?:[ \t]*->[ \t]*[^\r\n{}]+)?[ \t]*\{[ \t]*returner[ \t]+[^\r\n{}]+[ \t]*\}[ \t]*$'
    - negative_pattern: '^[ \t]*```'
  # Multi-line Norscode with function declaration, return statement and block end.
  - language: Norscode
    and:
    # ASCII-only identifiers: Unicode-only names remain a known false-negative.
    - pattern: '^[ \t]*funksjon[ \t]+[A-Za-z_][A-Za-z0-9_]*[ \t]*\([^\r\n)]*\)(?:[ \t]*->[ \t]*[^\r\n{}]+)?[ \t]*(?:\{|:)?[ \t]*$'
    - pattern: '^[ \t]+returner[ \t]+[^\s\r\n]'
    - pattern: '^[ \t]*(?:\}|slutt)[ \t]*$'
    # Fenced code snippets in .no documentation should remain Text.
    - negative_pattern: '^[ \t]*```'
  - language: Text
