# DRAFT: merge this disambiguation into github-linguist/linguist/lib/linguist/heuristics.yml
# This is only a proposed starting point, not deployed GitHub behavior.
# Existing .no language: Text. First matching rule wins; Text stays fallback.
disambiguations:
- extensions: ['.no']
  rules:
  - language: Norscode
    and:
    # Function declaration on a code line; may be typed or untyped.
    - pattern: '^[ \t]*funksjon[ \t]+[[:alpha:]_][[:alnum:]_]*[ \t]*\([^\r\n)]*\)(?:[ \t]*->[ \t]*[^\r\n{}]+)?[ \t]*(?:\{|:)?[ \t]*$'
    # Return statement must start an indented code line, not prose.
    - pattern: '^[ \t]+returner[ \t]+[^\s\r\n]'
    # Recognize curly-brace functions and legacy `slutt` blocks.
    - pattern: '^[ \t]*(?:\}|slutt)[ \t]*$'
  - language: Text
